<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Cámara Lucciano's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header with local + tabs, photo grid, fixed action bar */
:root{
  --bg:#f7f6f4; --surface:#ffffff; --ink:#1c1816; --muted:#6f6660; --line:#e6e1dc;
  --accent:#7b1e2c; --accent-ink:#ffffff; --accent-soft:#f5e6e8;
  --alert:#c62828; --alert-soft:#fde8e6; --ok:#2e7d4f; --ok-soft:#e5f3ea; --plate:#ffffff;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151211; --surface:#201c1a; --ink:#f3eee9; --muted:#a79d95; --line:#352f2c;
  --accent:#e0707f; --accent-ink:#1a0d10; --accent-soft:#3a1f24;
  --alert:#ff7a6e; --alert-soft:#3d1c19; --ok:#6fcf97; --ok-soft:#18301f; --plate:#f4f1ee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151211; --surface:#201c1a; --ink:#f3eee9; --muted:#a79d95; --line:#352f2c;
  --accent:#e0707f; --accent-ink:#1a0d10; --accent-soft:#3a1f24;
  --alert:#ff7a6e; --alert-soft:#3d1c19; --ok:#6fcf97; --ok-soft:#18301f; --plate:#f4f1ee; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.localSel{display:flex;align-items:center;gap:8px}
.localSel label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=search],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
select{max-width:210px}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px;font-weight:600;color:var(--muted)}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--alert);color:#fff;font-size:.72rem;line-height:18px}
.alertBar{margin-top:14px;background:var(--alert-soft);color:var(--alert);border-radius:12px;padding:10px 14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alertBar span{font-weight:500;color:var(--ink)}
.note{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.tools .grow{flex:1 1 180px}
.tools input{width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.85rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.emp{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.emp label{font-weight:600}
.emp input{flex:1 1 200px}
.emp.missing input{border-color:var(--alert);background:var(--alert-soft)}
.sec{font-family:var(--display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{position:relative}
.card>.pick{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s,border-color .15s}
.card>.pick:active{transform:scale(.96)}
.card.sel>.pick{border-color:var(--accent);background:var(--accent-soft)}
.plate{width:72px;height:72px;border-radius:50%;background:var(--plate);display:grid;place-items:center;overflow:hidden;flex:none}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;color:#fff}
.name{font-size:.8rem;font-weight:600;text-align:center;line-height:1.2;min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stk{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-variant-numeric:tabular-nums}
.stk.low{background:var(--alert-soft);color:var(--alert)}
.qty{position:absolute;top:-6px;right:-4px;min-width:30px;height:30px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0 8px;pointer-events:none}
.minus{position:absolute;top:-6px;left:-4px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem;line-height:1}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.bar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .sum{flex:1 1 200px;min-width:0;font-size:.88rem;color:var(--muted)}
.bar .sum b{color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.warn{color:var(--alert);font-weight:600}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .pbtn{width:44px;height:44px;border:0;padding:0;background:none;border-radius:50%}
.row .plate{width:44px;height:44px}
.row .plate .ph{width:38px;height:38px;font-size:.85rem}
.row .plate.add{background:none;border:1.5px dashed var(--muted);color:var(--muted);font-size:.6rem;font-weight:700;text-align:center;line-height:1.1}
.row .nm{font-weight:600;min-width:0}
.row .meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row .right{display:flex;align-items:center;gap:8px}
.row input[type=number]{width:74px;text-align:right;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:800;font-size:1.25rem;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.big.low{color:var(--alert)}
.pill{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px}
.pill.salida{background:var(--accent-soft);color:var(--accent)}
.pill.ingreso{background:var(--ok-soft);color:var(--ok)}
.pill.conteo{background:var(--line);color:var(--ink)}
.hist{display:flex;flex-direction:column;gap:8px}
.h{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.h .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.h .top .who{font-weight:700}
.h .top time{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.h .items{margin-top:4px;font-size:.85rem;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.card>.pick{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1><small>Lucciano's</small>Cámara y stock</h1>
      <div class="localSel"><label for="local">Local</label><select id="local"></select></div>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-t="salida">Salida</button>
      <button role="tab" data-t="ingreso">Ingreso</button>
      <button role="tab" data-t="stock">Stock</button>
      <button role="tab" data-t="historial">Historial</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<input type="file" id="fotoIn" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>

const LOCALES_PADRON = {"Propios": ["Agüero CABA", "Aldrey Mar del Plata", "Alem Mar del Plata", "Alto NOA Salta", "Alto Rosario Santa Fe", "Calle Corrientes CABA", "Central Mar del Plata", "Cerro De Las Rosas Córdoba", "Constitucion Mar del Plata", "Distrito Arcos CABA", "Dot CABA", "Galerias Pacifico CABA", "Galerias Salta", "Gallegos Mar del Plata", "Guemes Mar del Plata", "La Imprenta Gran Hotel CABA", "Martinez GBA", "Nordelta Buenos Aires", "Nuevocentro Córdoba", "Obelisco CABA", "Olivos GBA", "Oroño Santa Fe", "Paso Mar del Plata", "Patio Bullrich CABA", "Peatonal Mar del Plata", "Plaza Oeste Buenos Aires", "Posadas Misiones", "Recoleta CABA", "Roma Italia", "San Miguel GBA", "Santa Fe y Parana CABA", "Shopping Abasto 2 CABA", "Shopping Abasto CABA", "Torreon Mar del Plata", "Varese Mar del Plata"], "Franquicias": ["Adrogué GBA", "Adventure USA", "Alicante España", "Almagro CABA", "American Dream USA", "Arcos del Rosedal CABA", "Av Argentina Neuquén", "Bahia Blanca Buenos Aires", "Bahia Blanca Villa Mitre Buenos Aires", "Bajo Belgrano CABA", "Barcelona España", "Barcelona The Moon España", "Barrio Norte Tucuman", "Baxar Mercado Buenos Aires", "Belgrano C CABA", "Caballito CABA", "Cabildo y Juramento CABA", "Campana Buenos Aires", "Capital Corrientes", "Carilo Buenos Aires", "Carrasco Uruguay", "Caseros GBA", "Castelar Buenos Aires", "Catamarca Catamarca", "Chacras de Coria Mendoza", "Cid Campeador CABA", "Cipolletti Rio Negro", "City Bell Buenos Aires", "Coghlan CABA", "Colegiales CABA", "Devoto CABA", "Distrito T GBA", "General Pico Buenos Aires", "Gral Roca Rio Negro", "Granada España", "Honduras CABA", "Ituzaingo GBA", "La Plata Buenos Aires", "Lanus Buenos Aires", "Las Cañitas CABA", "Las Lomitas Buenos Aires", "Libertador CABA", "Madrid España", "Madryn Chubut", "Mar de las Pampas Buenos Aires", "Málaga I España", "Málaga Uncibay III España", "Nuñez CABA", "Palermo Buenos Aires", "Palermo Chico CABA", "Palmares Mendoza", "Parque Arauco Chile", "Parque Avellaneda Shopping GBA", "Parque Leloir GBA", "Parque Rivadavia CABA", "Paseo de la Costa Neuquén", "Paseo del Angel CABA", "Peatonal Sarmiento Mendoza", "Pilar Buenos Aires", "Pilar II Buenos Aires", "Plaza Houssay CABA", "Pocitos Uruguay", "Puerto Madero CABA", "Puerto Madero Dique CABA", "Punta Carrasco Uruguay", "Punta Carretas Uruguay", "Punta del Este Uruguay", "Quilmes GBA", "Ramos Mejia GBA", "Resistencia Chaco", "Ribera Shopping Santa Fe", "San Fernando Buenos Aires", "San Nicolas Buenos Aires", "San Telmo CABA", "Santa Fe Santa Fe", "Sawgrass USA", "Shopping Mendoza", "Tandil Buenos Aires", "The Florida Mall USA", "Valencia España", "Villa del Parque CABA", "Villa Luro CABA", "Villa Urquiza CABA", "Villa Urquiza II CABA", "Vista Pueblo Buenos Aires", "Weston USA", "Yerba Buena Tucuman"]}; // fuente: padrón de Lucciano's Academy (sin inactivas)
const MIN = 6;
const PH_COLORS=["#8d5a3b","#b0445a","#5f7a3a","#3b5f8d","#8d3b6f","#6b4c9a"];

const S = { db:null, canWrite:true, locales:[], local:null, tab:"salida", regs:[], base:null, fotos:{},
  cart:{salida:{},ingreso:{}}, confirm:false, conteo:null, q:"", soloAlerta:false, busy:false, unsub:[] };

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const keyOf=l=>l.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"local";
const nombre=id=>(SABORES.find(s=>s.id===id)||{n:"Sabor "+id}).n;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

function foto(id){return S.fotos[id]||FOTOS[id]||null}
function plateHTML(id,cls=""){
  const f=foto(id);
  if(f) return `<span class="plate ${cls}"><img src="${f}" alt=""></span>`;
  const n=nombre(id), ini=n.split(/\s+/).filter(w=>/^[A-ZÁÉÍÓÚ0-9]/.test(w)).slice(0,2).map(w=>w[0]).join("")||n[0];
  return `<span class="plate ${cls}"><span class="ph" style="background:${PH_COLORS[+id%PH_COLORS.length]}">${esc(ini)}</span></span>`;
}

/* ---------- stock math ---------- */
function stockMap(){
  const base=(S.base&&S.base.base)||{}, bts=(S.base&&S.base.ts)||0, m={};
  SABORES.forEach(s=>m[s.id]=+base[s.id]||0);
  for(const r of S.regs){ if(r.ts<=bts) continue;
    const sg=r.tipo==="ingreso"?1:r.tipo==="salida"?-1:0;
    for(const [id,q] of Object.entries(r.items||{})) if(id in m) m[id]+=sg*(+q||0); }
  return m;
}
function salidas7(){
  const since=Date.now()-7*864e5, m={};
  for(const r of S.regs) if(r.tipo==="salida"&&r.ts>=since) for(const [id,q] of Object.entries(r.items||{})) m[id]=(m[id]||0)+(+q||0);
  return m;
}
function alertas(st){return SABORES.filter(s=>st[s.id]<MIN)}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===S.tab));
  const st=stockMap(), al=alertas(st);
  const stockTab=$('#tabs [data-t="stock"]');
  stockTab.innerHTML="Stock"+(S.base&&al.length?`<span class="n">${al.length}</span>`:"");
  const m=$("#main");
  if(!S.local){m.innerHTML=`<div class="note">Elegí el local arriba para empezar.</div>`;$("#bar").hidden=true;return}
  let h="";
  if(!S.db) h+=`<div class="note">Conectando con la base de datos… Si no conecta, abrí el link desde la app de Claude con tu usuario.</div>`;
  else if(!S.canWrite) h+=`<div class="note">Tenés acceso de solo lectura. Pedile a quien administra la app que te dé acceso de colaborador para registrar movimientos.</div>`;
  if(S.base===null) h+=`<div class="note">Todavía no hay un conteo inicial para <b>${esc(S.local)}</b>. Andá a <b>Stock → Conteo físico</b> y cargá las vasquetas que hay en cámara.</div>`;
  else if(S.base&&al.length&&S.tab!=="historial") h+=`<div class="alertBar">⚠ ${al.length} ${al.length===1?"sabor":"sabores"} con menos de ${MIN} vasquetas <span>${al.slice(0,4).map(s=>esc(s.n)).join(" · ")}${al.length>4?" …":""}</span></div>`;
  if(S.tab==="salida"||S.tab==="ingreso") h+=gridView(st);
  else if(S.tab==="stock") h+=stockView(st);
  else h+=histView();
  m.innerHTML=h;
  renderBar(st);
}

function gridView(st){
  const mode=S.tab, cart=S.cart[mode];
  const empLabel=mode==="salida"?"¿Quién saca?":"¿Quién recibe?";
  const emp=ls.get("empleado","");
  const q=S.q.trim().toLowerCase();
  const list=SABORES.filter(s=>(!q||s.n.toLowerCase().includes(q))&&(!S.soloAlerta||st[s.id]<MIN));
  const card=s=>{const c=cart[s.id]||0;
    return `<div class="card${c?" sel":""}">
      <button class="pick" data-add="${s.id}" aria-label="${esc(s.n)}, sumar una">${plateHTML(s.id)}
        <span class="name">${esc(s.n)}</span><span class="stk${st[s.id]<MIN?" low":""}">${st[s.id]} en cámara</span></button>
      ${c?`<span class="qty">${c}</span><button class="minus" data-sub="${s.id}" aria-label="Restar una">−</button>`:""}</div>`};
  const v=list.filter(s=>s.t==="v"), b=list.filter(s=>s.t==="b");
  return `<div class="emp${S.needEmp&&!emp?" missing":""}"><label for="empleado">${empLabel}</label>
    <input type="text" id="empleado" placeholder="Nombre y apellido" value="${esc(emp)}" autocomplete="name"></div>
  <div class="tools"><div class="grow"><input type="search" id="q" placeholder="Buscar sabor" value="${esc(S.q)}"></div>
    <button class="chip" id="soloAlerta" aria-pressed="${S.soloAlerta}">Solo bajo mínimo</button></div>
  <p class="sec">${mode==="salida"?"Tocá una vez por cada vasqueta que sacás":"Tocá una vez por cada vasqueta que entra"}</p>
  ${v.length?`<div class="grid">${v.map(card).join("")}</div>`:""}
  ${b.length?`<p class="sec">Baldes</p><div class="grid">${b.map(card).join("")}</div>`:""}
  ${!list.length?`<div class="empty">Ningún sabor coincide con la búsqueda.</div>`:""}`;
}

function stockView(st){
  const s7=salidas7(), cont=S.conteo;
  const orden=cont||!S.base?SABORES:[...SABORES.filter(s=>st[s.id]<MIN),...SABORES.filter(s=>st[s.id]>=MIN)];
  const row=s=>{
    const low=st[s.id]<MIN, sug=Math.max(0,(s7[s.id]||0)+MIN-st[s.id]);
    const ph=foto(s.id)?plateHTML(s.id):`<span class="plate add">+ foto</span>`;
    return `<div class="row">
      <button class="pbtn" data-foto="${s.id}" aria-label="Cambiar foto de ${esc(s.n)}">${ph}</button>
      <div class="nm">${esc(s.n)}<div class="meta">Salidas 7 días: ${s7[s.id]||0}${!cont&&sug?` · Pedir ≈ ${sug}`:""}</div></div>
      <div class="right">${cont?`<input type="number" min="0" inputmode="numeric" id="c_${s.id}" data-c="${s.id}" value="${cont[s.id]}">`
        :`<span class="big${low?" low":""}">${st[s.id]}</span>`}</div></div>`};
  const last=S.base?new Date(S.base.ts).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):null;
  return `<div class="tools">
    ${cont?`<span class="grow"><b>Conteo físico:</b> escribí cuántas vasquetas hay de cada sabor.</span>`
      :`<span class="grow" style="color:var(--muted);font-size:.85rem">${last?`Último conteo: ${last}${S.base.empleado?" · "+esc(S.base.empleado):""}`:"Sin conteo todavía"}. Tocá la foto para cambiarla.</span>
        <button class="chip" id="conteoBtn">Conteo físico</button>`}</div>
  ${cont?`<div class="emp${S.needEmp&&!ls.get("empleado","")?" missing":""}"><label for="empleado">¿Quién cuenta?</label><input type="text" id="empleado" placeholder="Nombre y apellido" value="${esc(ls.get("empleado",""))}"></div>`:""}
  <p class="sec">${cont?"Stock contado":"Stock actual · pedido sugerido cubre 7 días + mínimo de "+MIN}</p>
  <div class="rows">${orden.map(row).join("")}</div>`;
}

function histView(){
  const regs=[...S.regs].sort((a,b)=>b.ts-a.ts);
  const now=new Date(), dow=(now.getDay()+6)%7, lunes=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow).getTime();
  const dias=["Lu","Ma","Mi","Ju","Vi","Sá","Do"], sem={};
  for(const r of regs) if(r.tipo==="salida"&&r.ts>=lunes){const d=(new Date(r.ts).getDay()+6)%7;
    for(const [id,q] of Object.entries(r.items||{})){(sem[id]=sem[id]||[0,0,0,0,0,0,0])[d]+=+q||0}}
  const ids=SABORES.filter(s=>sem[s.id]);
  const tabla=ids.length?`<div class="tbl"><table><thead><tr><th>Sabor</th>${dias.map(d=>`<th>${d}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${ids.map(s=>`<tr><td>${esc(s.n)}</td>${sem[s.id].map(x=>`<td>${x||"·"}</td>`).join("")}<td><b>${sem[s.id].reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}</tbody></table></div>`
    :`<div class="empty">Sin salidas desde el lunes.</div>`;
  const it=r=>Object.entries(r.items||{}).filter(([,q])=>q).map(([id,q])=>r.tipo==="conteo"?`${esc(nombre(id))}: ${q}`:`${esc(nombre(id))} ×${q}`).join(" · ");
  const lista=regs.slice(0,120).map(r=>`<div class="h"><div class="top"><span class="pill ${r.tipo}">${r.tipo}</span>
    <span class="who">${esc(r.empleado||"Sin nombre")}</span><span>${r.total||""} vasq.</span>
    <time>${new Date(r.ts).toLocaleString("es-AR",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</time></div>
    ${r.tipo==="conteo"?`<div class="items">Conteo físico de ${Object.keys(r.items||{}).length} sabores</div>`:`<div class="items">${it(r)}</div>`}</div>`).join("");
  return `<p class="sec">Salidas de cámara esta semana</p>${tabla}
  <p class="sec">Movimientos · últimos 60 días</p>${lista?`<div class="hist">${lista}</div>`:`<div class="empty">Todavía no hay movimientos en este local.</div>`}`;
}

function renderBar(st){
  const bar=$("#bar"), inn=$("#barIn");
  if(S.tab==="stock"&&S.conteo){
    bar.hidden=false;
    inn.innerHTML=S.confirm?`<div class="sum">¿Guardar el conteo de <b>${esc(S.local)}</b>? Reemplaza el stock actual.</div>
      <button class="btn ghost" id="volver">Volver</button><button class="btn" id="ok" ${S.busy?"disabled":""}>Guardar conteo</button>`
      :`<div class="sum">Revisá los números y guardá.</div><button class="btn ghost" id="cancelConteo">Cancelar</button><button class="btn" id="go" ${S.canWrite&&S.db?"":"disabled"}>Guardar conteo</button>`;
    return;
  }
  if(S.tab!=="salida"&&S.tab!=="ingreso"){bar.hidden=true;return}
  const cart=S.cart[S.tab], ent=Object.entries(cart).filter(([,q])=>q>0), tot=ent.reduce((a,[,q])=>a+q,0);
  if(!tot){bar.hidden=true;return}
  bar.hidden=false;
  const verbo=S.tab==="salida"?"salida":"ingreso";
  if(S.confirm){
    const neg=S.tab==="salida"?ent.filter(([id,q])=>st[id]-q<0).map(([id])=>nombre(id)):[];
    inn.innerHTML=`<div class="sum"><b>${esc(ls.get("empleado",""))}</b> · ${esc(S.local)}<br>${ent.map(([id,q])=>`${esc(nombre(id))} ×${q}`).join(" · ")}
      ${neg.length?`<div class="warn">Queda en negativo: ${neg.map(esc).join(", ")}. Revisá el stock con un conteo.</div>`:""}</div>
      <button class="btn ghost" id="volver">Volver</button><button class="btn" id="ok" ${S.busy?"disabled":""}>Confirmar ${verbo}</button>`;
  } else {
    inn.innerHTML=`<div class="sum"><b>${tot} ${tot===1?"vasqueta":"vasquetas"}</b> · ${ent.length} ${ent.length===1?"sabor":"sabores"}</div>
      <button class="btn ghost" id="limpiar">Borrar</button><button class="btn" id="go" ${S.canWrite&&S.db?"":"disabled"}>Registrar ${verbo}</button>`;
  }
}

/* ---------- actions ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.t){S.tab=t.dataset.t;S.confirm=false;S.needEmp=false;ls.set("tab",S.tab);render();return}
  if(t.dataset.add){const c=S.cart[S.tab];c[t.dataset.add]=(c[t.dataset.add]||0)+1;S.confirm=false;render();return}
  if(t.dataset.sub){const c=S.cart[S.tab];c[t.dataset.sub]=Math.max(0,(c[t.dataset.sub]||0)-1);if(!c[t.dataset.sub])delete c[t.dataset.sub];S.confirm=false;render();return}
  if(t.dataset.foto){S.fotoId=t.dataset.foto;$("#fotoIn").value="";$("#fotoIn").click();return}
  switch(t.id){
    case "soloAlerta": S.soloAlerta=!S.soloAlerta; render(); break;
    case "limpiar": S.cart[S.tab]={}; render(); break;
    case "conteoBtn": {const st=stockMap();S.conteo={...st};S.confirm=false;render();break}
    case "cancelConteo": S.conteo=null; render(); break;
    case "volver": S.confirm=false; render(); break;
    case "go":
      if(!ls.get("empleado","").trim()){S.needEmp=true;render();const i=$("#empleado");i&&i.focus();toast("Escribí tu nombre antes de registrar");break}
      S.confirm=true; render(); break;
    case "ok": guardar(); break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="empleado"){ls.set("empleado",e.target.value);if(S.needEmp&&e.target.value.trim()){S.needEmp=false;e.target.parentElement.classList.remove("missing")}}
  if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
  if(e.target.dataset.c){S.conteo[e.target.dataset.c]=Math.max(0,parseInt(e.target.value,10)||0)}
});
$("#local").addEventListener("change",e=>{setLocal(e.target.value)});

async function guardar(){
  if(S.busy||!S.db) return; S.busy=true; renderBar(stockMap());
  const empleado=ls.get("empleado","").trim(), ts=Date.now();
  try{
    if(S.tab==="stock"&&S.conteo){
      const items={}; SABORES.forEach(s=>items[s.id]=S.conteo[s.id]||0);
      const total=Object.values(items).reduce((a,b)=>a+b,0);
      await S.db.doc("stock/"+keyOf(S.local)).set({local:S.local,base:items,ts,empleado});
      await S.db.collection("registros").doc().set({tipo:"conteo",local:S.local,empleado,items,total,ts});
      S.conteo=null; toast("Conteo guardado");
      podar(ts);
    } else {
      const items={}; for(const [id,q] of Object.entries(S.cart[S.tab])) if(q>0) items[id]=q;
      const total=Object.values(items).reduce((a,b)=>a+b,0);
      await S.db.collection("registros").doc().set({tipo:S.tab,local:S.local,empleado,items,total,ts});
      toast(S.tab==="salida"?`Salida registrada: ${total} vasq.`:`Ingreso registrado: ${total} vasq.`);
      S.cart[S.tab]={};
    }
    S.confirm=false;
  }catch(err){
    if(err&&err.code==="invalid_argument"){S.canWrite=false;toast("No tenés permiso para registrar en esta app")}
    else if(err&&err.code==="quota_exceeded") toast("La base está llena. Hacé un conteo para limpiar movimientos viejos.");
    else toast("No se pudo guardar. Revisá la conexión y probá de nuevo.");
  }finally{S.busy=false;render()}
}
async function podar(ts){ // borra movimientos de este local de más de 60 días, para no llenar la base
  const lim=ts-60*864e5;
  for(const r of S.regs.filter(r=>r.ts<lim)){try{await S.db.collection("registros").doc(r._id).delete()}catch(e){break}}
}

$("#fotoIn").addEventListener("change",async e=>{
  const f=e.target.files[0], id=S.fotoId; if(!f||!id||!S.db) return;
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
    const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d");
    const side=Math.min(img.width,img.height);x.fillStyle="#fff";x.fillRect(0,0,160,160);
    x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,160,160);
    await S.db.doc("fotos/"+id).set({img:c.toDataURL("image/jpeg",.8)});
    toast("Foto actualizada: "+nombre(id));
  }catch(err){toast("No se pudo guardar la foto")}
});

/* ---------- data ---------- */
function renderLocales(){
  const sel=$("#local");
  const opt=l=>`<option ${l===S.local?"selected":""}>${esc(l)}</option>`;
  let body;
  if(S.locales.length) body=S.locales.map(opt).join("");
  else{
    const todos=[].concat(...Object.values(LOCALES_PADRON));
    body=Object.entries(LOCALES_PADRON).map(([g,ls])=>`<optgroup label="${esc(g)}">${ls.map(opt).join("")}</optgroup>`).join("")
      +(S.local&&!todos.includes(S.local)?opt(S.local):"");
  }
  sel.innerHTML=`<option value="">Elegir…</option>`+body;
}
function setLocal(l){
  S.local=l||null; ls.set("local",S.local||""); S.cart={salida:{},ingreso:{}}; S.conteo=null; S.confirm=false;
  S.regs=[]; S.base=undefined; subLocal(); render();
}
function subLocal(){
  S.unsub.forEach(u=>u()); S.unsub=[];
  if(!S.db||!S.local) return;
  S.unsub.push(S.db.collection("registros").where("local","==",S.local).onSnapshot(snap=>{
    S.regs=snap.docs.map(d=>({...d.data(),_id:d.id})); if(!S.conteo) render(); else renderBar(stockMap());
  },()=>{}));
  S.unsub.push(S.db.doc("stock/"+keyOf(S.local)).onSnapshot(d=>{
    S.base=d.exists?d.data():null; if(!S.conteo) render();
  },()=>{}));
}

(async function start(){
  S.tab=ls.get("tab","salida"); S.local=ls.get("local","")||null;
  renderLocales(); render();
  const claude=window.claude; if(!claude||!claude.use){return}
  const db=await claude.use("db"); if(!db){render();return}
  S.db=db;
  try{const u=await claude.use("user"); if(u){const c=await u.can("data.write"); if(c===false) S.canWrite=false}}catch(e){}
  db.doc("config/locales").onSnapshot(d=>{S.locales=(d.exists&&d.data().lista)||[];renderLocales()},()=>{});
  db.collection("fotos").onSnapshot(s=>{S.fotos={};s.docs.forEach(d=>S.fotos[d.id]=d.data().img);if(!S.conteo)render()},()=>{});
  subLocal(); render();
})();
</script>
