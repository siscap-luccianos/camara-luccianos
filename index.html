        ${ids.map(s=>`<tr><td>${esc(s.nombre)}${tagHtml(s)}</td><td><b>${sem[s.id].reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}
        <tr class="totalFila"><td><b>Total</b></td><td><b>${ids.reduce((a,s)=>a+sem[s.id].reduce((x,y)=>x+y,0),0)}</b></td></tr>

/** Qué movimientos muestra cada pill de categoría en la lista de abajo.
 *  Mismo criterio que la tabla de arriba: Vasquetas/Icepops son salidas
 *  (sin desperdicio) con algún sabor de ese grupo; si una salida mezcla
 *  los dos, aparece entera en ambos filtros. Chocolatería suma ingresos. */
function movimientoEnCategoria(r, cat){
  if(cat==="todas") return true;
  if(cat==="desperdicio") return r.tipo==="salida" && r.subtipo==="desperdicio";
  if(cat==="produccion") return r.subtipo==="produccion";
  // Chocolatería: también los ingresos, porque ahí es donde se carga el vencimiento
  if(cat==="chocolateria") return (r.tipo==="ingreso" && !r.subtipo || r.tipo==="salida" && r.subtipo!=="desperdicio") && Object.keys(r.items||{}).some(id=>grupoHistDe(id)===cat);
  return r.tipo==="salida" && r.subtipo!=="desperdicio" && Object.keys(r.items||{}).some(id=>grupoHistDe(id)===cat);
}

async function cargarEquipo(){
  const local = S.local;
  // Pintamos al toque con el último equipo que vimos de este local (si lo hay)
  // mientras se refresca en segundo plano, mismo criterio que ya usamos en
  // el login: no confundir "no llegó respuesta" con "no hay nadie cargado".
  if(S.equipo===null){
    try{
      const c = ls.get(_equipoCacheKey(local), "");
      if(c){ S.equipo = JSON.parse(c); S.errorEquipo = null; if(S.tab==="equipo") renderApp(); }
    }catch(e){}
  }
  const r = await api("empleadosAdmin", {local});
  if(S.local!==local) return; // se cambió de local mientras esperábamos
  if(r && r.ok){
    S.equipo = r.empleados; S.errorEquipo = null;
    try{ ls.set(_equipoCacheKey(local), JSON.stringify(r.empleados)); }catch(e){}
  } else if(!S.equipo || !S.equipo.length){
    S.equipo = []; S.errorEquipo = (r&&r.error) || "No se pudo conectar. Probá de nuevo.";
  }
  if(S.tab==="equipo") renderApp();
}

/* ============================================================
   SABORES — pestaña "Sabores": alta/edición/baja del catálogo
   (solo admin) o, para el Resp. de local, qué sabores tiene SU local
============================================================ */
/** Separación por tipo de producto — se usa tanto en la pestaña
 *  Sabores (antes mostraba todo en una sola lista/categoría mezclada)
 *  como en las pills de Salida/Ingreso/Stock/Pedido (antes Baldes
 *  quedaba mezclado adentro de la pill "Vasquetas", sin poder
 *  segmentarlo aparte). Baldes es su propio grupo aunque en los datos
 *  sea tipo "b" dentro de la familia "vasquetas", porque así los
 *  distingue Gabi en la práctica. Los ids quedan en minúscula (como ya
 *  venían `vasquetas`/`icepops`/`glutenfree`) para no romper nada que
 *  dependa de esos valores; `GRUPO_PRODUCTO_LABEL` tiene el texto para
 *  mostrar. */
const GRUPO_PRODUCTO_ORDEN = ["vasquetas","baldes","icepops","chocolateria","glutenfree"];
const GRUPO_PRODUCTO_LABEL = { vasquetas:"Vasquetas", baldes:"Baldes", icepops:"Icepops", chocolateria:"Chocolatería", glutenfree:"Gluten Free" };
function grupoProductoDe(s){
  if(s.tipo==="b") return "baldes";
  const familia=s.familia||"vasquetas";
  if(familia==="icepops") return "icepops";
  if(familia==="chocolateria") return "chocolateria";
  if(familia==="glutenfree") return "glutenfree";
  return "vasquetas";
}
/** Etiqueta corta de un producto en Historial. Las icepops de fruta, crema,
 *  bañados y luxury dicen "Ice Pop"; canoli, mini y Dubai dicen su nombre,
 *  para no confundir (pedido de Gabi 21/10/2026). */
const ETIQUETA_CATEGORIA_PRODUCTO = { "Cannoli":"Canoli", "Mini Icepops":"Mini Ice Pop", "Dubai":"Dubai" };
function etiquetaProductoDe(s){
  const g=grupoProductoDe(s);
  if(g==="icepops") return ETIQUETA_CATEGORIA_PRODUCTO[s.categoria]||"Ice Pop";
  return GRUPO_PRODUCTO_LABEL[g]||"Sabor";
}
function agruparPorProducto(lista){
  const porGrupo={};
  lista.forEach(s=>{ const g=grupoProductoDe(s); (porGrupo[g]=porGrupo[g]||[]).push(s) });
  return GRUPO_PRODUCTO_ORDEN.filter(g=>porGrupo[g]).map(g=>({clave:g, grupo:GRUPO_PRODUCTO_LABEL[g], sabores:porGrupo[g]}));
}

 *  ESE local, igual que el Resp. de local. El catálogo global (activar /

/** Mínimo por defecto según el tipo del sabor. Son los mismos valores que
 *  ya tiene la planilla. El formulario de alta lo propone solo al elegir el
 *  tipo; después se puede cambiar sabor por sabor o por rubro entero. */
const MINIMO_DEFECTO_TIPO = { v:6, i:6, c:6, b:3, m:3, p:3 };
function minimoDefectoDe(s){ return MINIMO_DEFECTO_TIPO[s.tipo] ?? 6 }
/** Cambia el mínimo de todo un rubro en una sola llamada. Con `minimoFijo`
 *  pone ese número a todos; sin él, cada sabor vuelve a su default por tipo. */
async function cambiarMinimosRubro(clave, minimoFijo){
  const sabores = (S.saboresAdmin||[]).filter(s=>grupoProductoDe(s)===clave);
  if(!sabores.length) return;
  const etiqueta = GRUPO_PRODUCTO_LABEL[clave];
  const porDefecto = minimoFijo==null;
  const texto = porDefecto ? `los mínimos por defecto de ${etiqueta}` : `el mínimo de ${etiqueta} a ${minimoFijo}`;
  if(!confirm(`¿Cambiar ${texto})? Son ${sabores.length} sabores.`)) return;
  const cambios = sabores.map(s=>({id:s.id, minimo: porDefecto ? minimoDefectoDe(s) : minimoFijo}));
  const r = await api("minimoMasivo", {cambios, detalle: porDefecto ? etiqueta+" por defecto" : etiqueta+" → "+minimoFijo});
  if(r && r.ok){ toast(`Listo: ${r.actualizados} sabores actualizados`); cargarSaboresAdmin(); }
  else if(r && /Acción desconocida/.test(r.error||"")) toast("Falta repegar Code.gs y hacer Nueva implementación para cambiar mínimos en bloque.");
  else toast((r&&r.error)||"No se pudo cambiar los mínimos.");
}

  } else if(S.tab==="salida" || S.tab==="ingreso" || S.tab==="devolucion"){
    const cartKey=cartKeyActual(), enDevolucion=cartKey==="devolucion", enDesperdicio=cartKey==="desperdicio", enProduccion=cartKey==="produccion";
    const cart=S.cart[cartKey], ent=Object.entries(cart).filter(([,q])=>q>0), tot=ent.reduce((a,[,q])=>a+q,0);
    if(tot){
      visible=true;
      const verbo=enDesperdicio?"desperdicio":enProduccion?"producción":S.tab==="salida"?"salida":(enDevolucion?"devolución":"ingreso");
      const faltaMotivo=enDesperdicio && !S.motivoDesperdicio.trim();
      const faltaVenc=cartKey==="ingreso" ? ent.filter(([id,q])=>loteProblema("ing:"+id, id, q, S.vencimientos[id])) : [];
      const kilosDe=id=>parseFloat(String(S.kilosProduccion[id]||"").replace(",","."))||0;
      const kilosTotal=enProduccion?ent.reduce((a,[id])=>a+kilosDe(id),0):0;
      const st=stockMap();
      if(S.confirm){
        const neg=(S.tab==="salida")?ent.filter(([id,q])=>st[id]-q<0).map(([id])=>nombre(id)):[];
        const dup=cartKey==="ingreso" ? remitoDuplicado(S.remito, S.local) : null;
        inn.innerHTML = `<div class="sum"><b>${esc(S.empleado.nombre)}</b> · ${esc(S.local)}<br>${ent.map(([id,q])=>enProduccion&&kilosDe(id)?`${esc(nombre(id))} ×${q} (${kilosDe(id).toLocaleString("es-AR",{maximumFractionDigits:1})} kg)`:`${esc(nombre(id))} ×${q}`).join(" · ")}
          ${neg.length?`<div class="warn">No hay stock suficiente de: ${neg.map(esc).join(", ")}. Actualizá la pantalla o sacá menos cantidad.</div>`:""}
          ${dup?`<div class="warn">El remito N° ${esc(S.remito)} ya se cargó el ${esc(new Date(dup.ts).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}))} — ¿seguro que es otro?</div>`:""}</div>
          <button class="btn ghost" id="volver" ${S.busy?"disabled":""}>Volver</button><button class="btn" id="ok" ${(S.busy||neg.length||faltaVenc.length)?"disabled":""}>${S.busy?"Guardando…":"Confirmar "+verbo}</button>`;
      } else {
        inn.innerHTML = `<div class="sum"><b>${tot} ${tot===1?"unidad":"unidades"}</b> · ${ent.length} ${ent.length===1?"sabor":"sabores"}${enProduccion&&kilosTotal>0?` · ${kilosTotal.toLocaleString("es-AR",{maximumFractionDigits:1})} kg`:""}${faltaMotivo?`<div class="warn">Escribí el motivo arriba para poder registrarlo.</div>`:""}${faltaVenc.length?`<div class="warn">Revisá el vencimiento de ${faltaVenc.length} ${faltaVenc.length===1?"producto":"productos"} para confirmar.</div>`:""}</div>
          <button class="btn ghost" id="limpiar">Borrar</button><button class="btn" id="go" ${(faltaMotivo||faltaVenc.length)?"disabled":""}>Registrar ${verbo}</button>`;
      }
    }
  }
  bar.hidden=!visible;
  const nav=$("#tabs"); if(nav) nav.hidden=visible;
}

   CARGA DE DATOS + POLLING (reemplaza los onSnapshot)
============================================================ */
function _datosCacheKey(local){ return "datosCache_"+local }
function guardarDatosCache(local, d){
  try{ ls.set(_datosCacheKey(local), JSON.stringify(d)); }catch(e){}
}
/** Trae a S lo último que se guardó de este local (si lo hay) — para no
 *  arrancar con las grillas vacías mientras se espera la respuesta real del
 *  servidor, y para que la app siga mostrando algo si no hay señal. */
function precargarDatosCache(local){
  try{
    const cache = ls.get(_datosCacheKey(local),"");
    if(!cache) return false;
    const d = JSON.parse(cache);
    S.sabores = d.sabores; S.saboresPorId={}; S.sabores.forEach(s=>S.saboresPorId[s.id]=s);
    S.saboresExcluidos = d.excluidos || [];
    S.produccionLocal = !!d.produccion;
    S.regs = d.registros; S.stock = d.stock;
    return true;
  }catch(e){ return false; }
}
async function cargarDatos(){
  if(!S.local || !S.token) return;
  const local=S.local; // por si cambia de local mientras esta llamada está en vuelo
  const r = await api("datos", {local});
  if(local!==S.local) return; // el usuario ya se movió a otro local, esta respuesta quedó vieja
  if(!r || !r.ok){
    S.errorCarga = (r&&r.error) || "No se pudo conectar. Se va a reintentar solo.";
    if(!S.sabores.length) renderApp();
    return;
  }
  S.errorCarga = null;
  S.sabores = r.sabores;
  S.saboresPorId = {}; S.sabores.forEach(s=>S.saboresPorId[s.id]=s);
  S.saboresExcluidos = r.excluidos || [];
  S.produccionLocal = !!r.produccion;
  S.regs = r.registros;
  S.stock = r.stock;
  guardarDatosCache(local, {sabores:r.sabores, excluidos:r.excluidos||[], produccion:!!r.produccion, registros:r.registros, stock:r.stock});
  if(S.conteo){ renderBar(); return }
  if(_estaEscribiendo()) return; // no repintamos toda la pantalla mientras alguien está escribiendo algo — se ve solo en el próximo refresco
  renderApp();
}
function _estaEscribiendo(){
  const t = document.activeElement && document.activeElement.tagName;
  return t==="INPUT" || t==="TEXTAREA" || t==="SELECT";
}
function iniciarPolling(){
  clearInterval(S.pollTimer);
  S.pollTimer = setInterval(()=>{ cargarDatos(); colaFlush(); }, POLL_MS);
}
function setLocal(local){
  S.local = local; S.sabores=[]; S.saboresPorId={}; S.saboresExcluidos=[]; S.produccionLocal=false; S.regs=[]; S.stock=undefined; S.errorCarga=null;
  try{ ls.set("ultimoLocal", local); }catch(e){}
  S.cart={salida:{},ingreso:{},devolucion:{},desperdicio:{},produccion:{}}; S.kilosProduccion={}; S.vencimientos={}; S.vencOmit={}; S.lotePick={}; limpiarLotesExtra("ing:"); S.modoDevolucion=false; S.modoDesperdicio=false; S.modoProduccion=false; S.motivoDesperdicio=""; S.conteo=null; S.verPedido=false; S.verResumenPedido=false; S.confirm=false; S.equipo=undefined; S.errorEquipo=null; S.pedidoAdj={}; S.categoriaHist="todas"; S.rangoHist="d7"; S.calHist=null; S.rangoMenu=false;
  // Pintamos al toque con lo último que vimos de este local (si lo vimos antes)
  // mientras se refresca en segundo plano — evita la pantalla en blanco al
  // cambiar de sucursal, que es lo más lento de esta app (Apps Script).
  precargarDatosCache(local);
  cargarDatos(); renderApp();
}

/* ============================================================
   GUARDAR — registrar (salida/ingreso), conteo, con cola offline
============================================================ */
/** Cuando un movimiento queda en la cola offline (todavía no lo confirmó el
 *  servidor), lo sumamos igual a S.regs para que el stock en pantalla ya lo
 *  descuente/sume — si no, la tablet seguía mostrando el stock de ANTES del
 *  retiro hasta que volviera la señal (reportado por Gabi: "sigue marcando
 *  lo mismo con lo que yo empecé"). Cuando el movimiento se sincroniza de
 *  verdad, el próximo cargarDatos() reemplaza TODO S.regs con la respuesta
 *  real del servidor, así que este registro provisorio desaparece solo —
 *  no hace falta sacarlo a mano ni arriesgarse a contarlo dos veces.
 */
function agregarRegistroOptimista(payload){
  S.regs.push({
    id: "pendiente-"+payload.clienteId, tipo: payload.tipo, local: payload.local,
    empleadoId: String(S.empleado.id), empleado: S.empleado.nombre, items: payload.items||{},
    total: Object.values(payload.items||{}).reduce((a,b)=>a+(+b||0),0),
    remito: payload.remito||"", ts: Date.now(), anulado:false, anulado_por:"", motivo: payload.motivo||"",
    foto_remito: payload.fotoRemito||"", subtipo: payload.subtipo||"", kilos: payload.kilos||{}, vencimientos: payload.vencimientos||{},
  });
  guardarDatosCache(S.local, {sabores:S.sabores, excluidos:S.saboresExcluidos, produccion:S.produccionLocal, registros:S.regs, stock:S.stock});
}
async function guardarMovimiento(){
  if(S.busy) return; S.busy=true; renderBar();
  try{
    const cartKey=cartKeyActual(), enDevolucion=cartKey==="devolucion", enDesperdicio=cartKey==="desperdicio", enProduccion=cartKey==="produccion";
    const tipo = (enDevolucion||enProduccion) ? "ingreso" : S.tab; // devolución y producción son un ingreso con subtipo, el backend no tiene un tercer/cuarto tipo de movimiento
    const cart=S.cart[cartKey];
    const items={}; for(const [id,q] of Object.entries(cart)) if(q>0) items[id]=q;
    const total=Object.values(items).reduce((a,b)=>a+b,0);
    const venc={};
    for(const id of Object.keys(items)){
      if(tipo==="ingreso"&&!enDevolucion&&!enProduccion){ const v=valorVencimiento("ing:"+id, S.vencimientos[id], items[id]); if(v) venc[id]=v }
      else if(tipo==="salida"&&S.lotePick[id]) venc[id]=S.lotePick[id];
    }
    const kilos={}; if(enProduccion) for(const id of Object.keys(items)){ const k=parseFloat(String(S.kilosProduccion[id]||"").replace(",",".")); if(k>0) kilos[id]=k; }
    const clienteId=uuid();
    const payload={clienteId, tipo, local:S.local, items,
      remito: tipo==="ingreso"&&!enDevolucion&&!enProduccion ? S.remito.trim() : undefined,
      fotoRemito: tipo==="ingreso"&&!enDevolucion&&!enProduccion ? (S.fotoRemitoUrl||undefined) : undefined,
      subtipo: enDevolucion ? "devolucion" : enDesperdicio ? "desperdicio" : enProduccion ? "produccion" : undefined,
      motivo: enDesperdicio ? S.motivoDesperdicio.trim() : undefined,
      kilos: enProduccion && Object.keys(kilos).length ? kilos : undefined,
      vencimientos: Object.keys(venc).length ? venc : undefined};
    const r = await api("registrar", payload);
    if(r && r.ok){
      toast((enDesperdicio?"Desperdicio registrado: ":enProduccion?"Producción registrada: ":S.tab==="salida"?"Salida registrada: ":enDevolucion?"Devolución registrada: ":"Ingreso registrado: ")+total+" u.");
      S.cart[cartKey]={}; S.kilosProduccion={}; S.vencimientos={}; S.vencOmit={}; S.lotePick={}; limpiarLotesExtra("ing:"); S.remito=""; S.fotoRemitoUrl=""; S.confirm=false; S.modoDevolucion=false; S.modoDesperdicio=false; S.modoProduccion=false; S.motivoDesperdicio="";
      await cargarDatos();
    } else if(r && r.offline){
      colaAgregar("registrar", payload);
      agregarRegistroOptimista(payload);
      toast("Sin conexión: se guardó y se va a enviar solo.");
      S.cart[cartKey]={}; S.kilosProduccion={}; S.vencimientos={}; S.vencOmit={}; S.lotePick={}; limpiarLotesExtra("ing:"); S.remito=""; S.fotoRemitoUrl=""; S.confirm=false; S.modoDevolucion=false; S.modoDesperdicio=false; S.modoProduccion=false; S.motivoDesperdicio="";
    } else {
      toast((r&&r.error)||"No se pudo guardar. Probá de nuevo.");
    }
  }finally{
    // pase lo que pase (incluso un error inesperado) el botón tiene que
    // volver a quedar usable — si no, la tablet queda trabada en
    // "Guardando…" para siempre y no hay forma de refrescar para salir.
    S.busy=false; renderApp();
  }
}
async function guardarConteo(){
  if(S.busy) return; S.busy=true; renderBar();
  try{
  const items={}; S.sabores.forEach(s=>items[s.id]=S.conteo[s.id]||0);
  const clienteId=uuid();
  const vencimientos={};
  for(const id of Object.keys(items)){ if(items[id]>0){ const v=valorVencimiento("conteo:"+id, S.vencConteo[id], items[id]); if(v) vencimientos[id]=v } }
  const payload={clienteId, local:S.local, items, vencimientos};
  const r = await api("conteo", payload);
  if(r && r.ok){
    toast("Conteo guardado");
    S.conteo=null; S.confirm=false; S.vencConteo={}; S.vencOmit={}; limpiarLotesExtra("conteo:");
    await cargarDatos();
  } else if(r && r.offline){
    colaAgregar("conteo", payload);
    // Un conteo fija el stock directo (no es un delta como salida/ingreso) —
    // acá actualizamos S.stock con lo recién contado para que la pantalla
    // ya lo refleje, por la misma razón que agregarRegistroOptimista().
    S.stock = {local:S.local, base:items, ts:Date.now(), empleado:S.empleado.nombre};
    guardarDatosCache(S.local, {sabores:S.sabores, excluidos:S.saboresExcluidos, produccion:S.produccionLocal, registros:S.regs, stock:S.stock});
    toast("Sin conexión: el conteo se va a enviar solo.");
    S.conteo=null; S.confirm=false;
  } else {
    toast((r&&r.error)||"No se pudo guardar el conteo.");
  }
  }finally{
    S.busy=false; renderApp();
  }
}
async function conBoton(btn, fn){
  if(!btn || btn.disabled) return;

  btn.disabled=true; btn.textContent="Cargando…";
  try{ return await fn(); }
  finally{ btn.disabled=false; btn.textContent=original; }
}

function teclaBloqueo(k){
  if(S.bloqueoCargando) return;

  else if(S.bloqueoPin.length<4) S.bloqueoPin += k;

// Entrar a otro local con código de admin: no hay botón. Tocar 5 veces seguidas
// el título "Elegí tu perfil" (en menos de 3 s) abre directo la casilla de
// local y después la del código, sin textos. Vale para PC y tablet.
let secretoToques=[];
function tocarSecretoOtroLocal(){
  const ahora=Date.now();
  secretoToques=secretoToques.filter(t=>ahora-t<3000);
  secretoToques.push(ahora);
  if(secretoToques.length<5) return false;
  secretoToques=[]; return true;
}
document.addEventListener("click", async e=>{
  const secreto=e.target.closest("[data-secreto-otro]");
  if(secreto){ if(tocarSecretoOtroLocal()){ const loc=(S.auth&&S.auth.local)||S.deviceLocal; if(loc){ S.auth={paso:"clave", local:loc, empleados:[], elegido:null, pin:"", pin1:"", error:"", cargando:false, otroLocal:true} } else { S.auth={paso:"local", local:null, empleados:[], elegido:null, pin:"", pin1:"", error:"", cargando:false, otroLocal:true} } renderApp() } return }
  // "Elegir lote" va dentro del botón de la tarjeta: se atiende antes que el toque de sumar.
  const le=e.target.closest("[data-elegir-lote]");
  if(le){ S.elegirLote=le.dataset.elegirLote; renderElegirLote(); return }
  const t=e.target.closest("button,a"); if(!t) return;

  if(t.dataset.authback){ authVolver(); return }
  // Admin: pasa a la vista general (catálogo para todos los locales) sin cerrar sesión.
  if(t.dataset.irOperaciones){ S.local=null; S.tab="sabores"; renderApp(); return }
  if(t.dataset.cambiarDispositivo){ cambiarDispositivo(); return }
  if(t.dataset.authemp){ const emp=S.auth.empleados.find(x=>String(x.id)===t.dataset.authemp); if(emp) authElegirEmpleado(emp); return }
  if(t.dataset.tecla){ authTecla(t.dataset.tecla); return }
  if(t.dataset.teclaBloqueo){ teclaBloqueo(t.dataset.teclaBloqueo); return }
  if(t.id==="bloqueoDesbloquear"){ desbloquearPC(); return }
  if(t.id==="bloqueoSalir"){ S.bloqueado=false; S.bloqueoPin=""; S.bloqueoClave=""; cerrarSesion(false); return }
  if(t.id==="authLocalOk"){
    const v=$("#authLocal").value.trim();
    if(!v) return;
    let match=S.locales.find(l=>l.nombre.toLowerCase()===v.toLowerCase());
    if(!match){ toast("Elegí un local de la lista"); return }
    // si el pedido inicial de locales todavía no terminó, esperamos ESE mismo pedido (no disparamos uno nuevo)
    // para no sumar una ida y vuelta extra al backend en el caso normal (que ya terminó hace rato)
    if(localesFetchPromise){
      t.disabled = true; t.textContent = "Verificando…";
      try{ await localesFetchPromise; }catch(e){ /* si el refresco de fondo falló, seguimos con lo que ya teníamos en vez de quedar trabados acá */ }
      t.disabled = false; t.textContent = "Continuar";
      match = S.locales.find(l=>l.nombre.toLowerCase()===v.toLowerCase()) || match;
    }
    authElegirLocal(match.nombre);

  }

  if(t.id==="authClaveOk"){ await authEnviarClave(); return }
  if(t.id==="authReintentar"){ await cargarEmpleadosDeAuth(); return }
  if(t.id==="salir"){ cerrarSesion(false); return }
  if(t.id==="reintentarCarga"){ S.errorCarga=null; renderApp(); cargarDatos(); return }
  if(t.id==="reintentarSabores"){ S.saboresAdmin=undefined; renderApp(); return }
  if(t.id==="reintentarEquipo"){ S.equipo=undefined; renderApp(); return }

/** Los teclados numéricos del PIN (login y bloqueo de pantalla en PC) son
 *  paneles táctiles, pero en PC hace falta poder tipear con el teclado
 *  físico (pedido de Gabi: "no me lo permite al querer poner el pin").
 *  No interfiere con otros inputs de texto (clave de local, buscador,
 *  etc.) porque se ignora si el foco está en un INPUT/TEXTAREA. */
document.addEventListener("keydown", e=>{
  // Conteo físico como una columna de Excel: Enter y flecha abajo bajan al
  // siguiente sabor, flecha arriba sube al anterior; al entrar al campo se
  // selecciona el número (ver focusin) y se pisa tipeando.
  if(e.target.dataset && e.target.dataset.c!==undefined && ["Enter","ArrowDown","ArrowUp"].includes(e.key)){
    e.preventDefault();
    const campos=[...document.querySelectorAll("input[data-c]")];
    const paso = e.key==="ArrowUp" ? -1 : 1;
    const destino=campos[campos.indexOf(e.target)+paso];
    if(destino) destino.focus(); else if(e.key!=="ArrowUp") e.target.blur();
    return;
  }
  if(e.key==="Enter"){
    // authClave no va acá: Enter envía el formulario (formClave) y el
    // botón submit dispara el mismo click de siempre; así el navegador ve
    // el envío y puede ofrecer guardar la contraseña de Operaciones.
    const botonEnter={authLocal:"authLocalOk", bloqueoClaveInput:"bloqueoDesbloquear"}[e.target.id];
    const btn=botonEnter && document.getElementById(botonEnter);
    if(btn && !btn.disabled){ e.preventDefault(); btn.click(); return }
  }
  if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA") return;
  const esDigito = /^[0-9]$/.test(e.key);
  const esBorrar = e.key==="Backspace" || e.key==="Delete";
  if(!esDigito && !esBorrar) return;
  const tecla = esBorrar ? "borrar" : e.key;
  if(document.querySelector("[data-tecla]")){ e.preventDefault(); authTecla(tecla); return }
  if(document.querySelector("[data-tecla-bloqueo]")){ e.preventDefault(); teclaBloqueo(tecla); return }
});
// El formulario de la contraseña de local solo sirve para que el navegador
// la reconozca (Operaciones la guarda); el envío real lo hace el click de
// authClaveOk, así que acá se corta la navegación.
document.addEventListener("submit", e=>{ if(e.target.id==="formClave") e.preventDefault() });
document.addEventListener("focusin", e=>{
  // Seleccionar todo el contenido al entrar a un campo numérico (Conteo
  // físico, cantidad en el lector de remitos, mínimo/peso/caja en
  // Sabores, etc.) — como una celda de Excel: el primer dígito que
  // escribís reemplaza el "0" de siempre en vez de agregarse al lado
  // (pedido de Gabi: "siempre aparece cero y me obliga a borrarlo").
  if(e.target.id==="local"||e.target.id==="authLocal"||e.target.type==="number") e.target.select();
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.q=e.target.value; const pos=e.target.selectionStart; renderApp(); const q=$("#q"); if(q){ q.focus(); q.setSelectionRange(pos,pos) } }
  if(e.target.id==="remito"){ S.remito=e.target.value }

  if(e.target.id==="authClave"){ S.auth.clave=e.target.value }
  if(e.target.id==="bloqueoClaveInput"){ S.bloqueoClave=e.target.value }
  if(e.target.dataset.c){
    const n=Math.max(0,parseInt(e.target.value,10)||0);
    S.conteo[e.target.dataset.c]=n;
    mostrarVencRenglon(e.target, e.target.dataset.c, "conteo:", "data-venc-conteo", n);
    renderBar();
  }

    const n=Math.max(0,Math.floor(+e.target.value||0));
    if(n) S.cart.ingreso[e.target.dataset.cantInput]=n; else delete S.cart.ingreso[e.target.dataset.cantInput];
    mostrarVencRenglon(e.target, e.target.dataset.cantInput, "ing:", "data-venc", n);
    renderBar();
  }
  if(e.target.dataset.remitoQty!==undefined){ S.lectorRemito.items[+e.target.dataset.remitoQty].cantidad=Math.max(0,parseInt(e.target.value,10)||0) }
  if(e.target.dataset.kilos){ S.kilosProduccion[e.target.dataset.kilos]=e.target.value; S.confirm=false; renderBar() }
  if(e.target.dataset.loteF!==undefined || e.target.dataset.loteC!==undefined){ setLoteExtra(e.target); renderBar() }

document.addEventListener("change", e=>{
  if(e.target.id==="inputRemitoFoto"){
    const file=e.target.files[0]; e.target.value="";
    if(!file) return;
    const procesar=(dataUrl)=>{
      const base64=dataUrl.split(",")[1];
      // Si ya veníamos revisando páginas anteriores de este mismo remito,
      // seguimos acumulando en la misma sesión (lr.items/remitos/etc.) en
      // vez de arrancar de cero — así un remito de varias páginas se carga
      // página por página sin perder lo ya leído.
      if(!S.lectorRemito || S.lectorRemito.paso!=="revision"){
        S.lectorRemito = { items:[], remitos:[], fotoUrls:[], paginasLeidas:0,
          bultosLeidosSabores:0, bultosLeidosBaldes:0, bultosLeidosPalitos:0,
          bultosDeclaradosSabores:null, bultosDeclaradosBaldes:null };
      }
      S.lectorRemito.paso="leyendo";
      S.lectorRemito.fotoDataUrl=dataUrl;
      reiniciarInactividad(); // cancela el timer que ya estaba corriendo de antes de abrir el lector
      renderApp();
      leerRemitoFoto(base64, "image/jpeg");
    };
    comprimirFotoRemito(file).then(procesar).catch(()=>toast("No pude leer esa foto. Probá con otra o sacála de nuevo."));
    return;
  }
  if(e.target.dataset.remitoElegir!==undefined){
    const it=S.lectorRemito.items[+e.target.dataset.remitoElegir], v=e.target.value;
    if(v==="ignorar"){ it.ignorar=true; it.saborId=null; it.nombreSabor=null; }
    else if(v){
      it.saborId=v; it.nombreSabor=(S.saboresPorId[v]||{}).nombre||""; it.ignorar=false;
      // Recalculamos la cantidad con el tamaño de caja del sabor recién elegido
      // (antes se quedaba con los bultos sin multiplicar, porque la IA no
      // conoce la caja maestra de un sabor que no supo reconocer solo).
      // OJO: esta misma cuenta vive también en leerRemito() de Code.gs —
      // si cambia la regla (tipo "m" sin multiplicar, el resto × cantidad_maestra),
      // hay que tocar los dos lados, acá no hay forma de compartir el código.
      const s=S.saboresPorId[v];
      if(s && it.bultos!==undefined) it.cantidad = s.tipo==="m" ? it.bultos : it.bultos*(s.cantidad_maestra||1);
    }
    else { it.saborId=null; it.nombreSabor=null; it.ignorar=false; }
    renderApp();
    return;
  }
  if(e.target.id==="local"){
    const v=e.target.value.trim();
    // Admin: "Operaciones" = vista general (habilitar/deshabilitar productos para todos los locales)
    if(v.toLowerCase()==="operaciones" && S.empleado.rol==="admin"){
      if(S.local){ S.local=null; S.tab="sabores"; renderApp(); }
      else e.target.value="Operaciones";
      return;
    }
    const match=S.locales.find(l=>l.nombre.toLowerCase()===v.toLowerCase() && !l.esGestion);
    if(match && match.nombre!==S.local) setLocal(match.nombre);
    else e.target.value=valorLocalHeader();
  }
  if(e.target.dataset.cambiarRol!==undefined){
    cambiarRolEmpleado(e.target.dataset.cambiarRol, e.target.value, e.target);
    return;
  }
});
async function conBotonCargando(form, fn){
  const btn=form.querySelector('button[type=submit]');
  if(!btn || btn.disabled) return;
  const textoOriginal=btn.textContent;
  btn.disabled=true; btn.textContent="Cargando…";
  try{ await fn(); }
  finally{ btn.disabled=false; btn.textContent=textoOriginal; }
}
document.addEventListener("submit", async e=>{
  if(e.target.id==="altaFormEquipo" || e.target.id==="altaFormGestion"){
    e.preventDefault();
    await conBotonCargando(e.target, async ()=>{
      const esGestion = e.target.id==="altaFormGestion";
      const fd=new FormData(e.target);
      const r = await api("altaEmpleado", {nombre:fd.get("nombre"), rol:fd.get("rol"), local: esGestion?"":S.local});
      if(r && r.ok){
        toast("Alta creada"); e.target.reset();
        if(esGestion) cargarGestion(); else cargarEquipo();
      } else toast((r&&r.error)||"No se pudo dar de alta.");
    });
  }
  if(e.target.dataset && e.target.dataset.editarSabor){
    e.preventDefault();
    await conBotonCargando(e.target, async ()=>{
      const id=e.target.dataset.editarSabor;
      const actual=(S.saboresAdmin||[]).find(x=>x.id===id);
      const fd=new FormData(e.target);
      await guardarSabor({
        id, nombre:fd.get("nombre"), tipo:fd.get("tipo"), familia:fd.get("familia"), categoria:fd.get("categoria"),
        minimo:fd.get("minimo"), peso:fd.get("peso"), cantidad_maestra:fd.get("cantidad_maestra"),
        orden: actual?actual.orden:0, activo: fd.get("activo")==="on",
      });
    });
  }
  if(e.target.id==="altaSaborForm"){
    e.preventDefault();
    await conBotonCargando(e.target, async ()=>{
      const fd=new FormData(e.target);
      await guardarSabor({ nombre:fd.get("nombre"), tipo:fd.get("tipo"), familia:fd.get("familia"), categoria:fd.get("categoria"), minimo:fd.get("minimo"), peso:fd.get("peso"), cantidad_maestra:fd.get("cantidad_maestra") });
      e.target.reset();
    });
  }
});

/* ============================================================
   AVISO DE VERSIÓN NUEVA — el sitio es un solo HTML estático sin
   build step, así que el navegador se queda con este archivo en su
   caché HTTP; alguien puede seguir usando una versión vieja horas sin
   enterarse (y en la tablet, instalada como acceso directo, no hay
   barra de direcciones para "simplemente recargar"). Mismo criterio
   que luccianos-academy: preguntar la versión publicada pidiendo este
   mismo archivo con un parámetro que cambia siempre (así esa lectura
   puntual no puede venir de la caché), y avisar si difiere.
============================================================ */
const CHEQUEO_VERSION_MS = 5 * 60 * 1000;
let avisoVersionMostrado = false;

async function versionPublicada(){
  try{
    const resp = await fetch(`./?nocache=${Date.now()}`, { cache: "no-store" });
    if(!resp.ok) return null;
    const texto = await resp.text();
    const m = texto.match(/FRONTEND_VERSION\s*=\s*"([\d.]+)"/);
    return m ? m[1] : null;
  }catch(e){ return null; } // sin conexión o servidor caído: se reintenta en el próximo chequeo
}
function mostrarAvisoVersion(nueva){
  if(avisoVersionMostrado) return;
  avisoVersionMostrado = true;
  const barra = document.createElement("div");
  barra.className = "avisoActualizacion";
  barra.innerHTML = `<span>Hay una versión nueva (${esc(nueva)}).</span><button class="btn" type="button" id="btnActualizarApp">Actualizar</button>`;
  document.body.appendChild(barra);
  barra.querySelector("#btnActualizarApp").addEventListener("click", async (e)=>{
    const boton = e.currentTarget;
    boton.disabled = true; boton.textContent = "Actualizando…";
    try{ if(window.caches){ const claves = await caches.keys(); await Promise.all(claves.map(k=>caches.delete(k))); } }catch(err){}
    // El "?v=" cambia la URL del documento, así el navegador no puede servir la copia vieja que tenía cacheada.
    location.replace(`${location.pathname}?v=${nueva}${location.hash}`);
  });
}
async function chequearVersionNueva(){
  const publicada = await versionPublicada();
  if(publicada && publicada!==FRONTEND_VERSION) mostrarAvisoVersion(publicada);
}
function iniciarChequeoDeVersion(){
  // También al toque, no solo más adelante — si no, recién instalada (o
  // reabierta después de días con una copia vieja en caché) podía tardar
  // hasta 5 minutos en darse cuenta de que había una versión nueva.
  chequearVersionNueva();
  setInterval(chequearVersionNueva, CHEQUEO_VERSION_MS);
  // Volver a la app después de un rato es el momento más probable de estar
  // corriendo algo viejo — sobre todo en la tablet/celular, que queda
  // abierta en segundo plano días entre usos.
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") chequearVersionNueva(); });
}

async function start(){
  setInterval(actualizarTimerInact, 1000);
  if(!S.locales.length){
    const cache = ls.get("localesCache","");
    if(cache){ try{ S.locales = JSON.parse(cache); }catch(e){} }
  }
  cargarLocalesSiFalta(); // en paralelo, no bloquea el primer render
  if(S.token && S.empleado){
    S.local = S.deviceLocal || S.empleado.local || S.local;
    if(!S.local && (S.empleado.rol==="admin"||S.empleado.rol==="supervisor")){
      const ultimo = ls.get("ultimoLocal","");
      if(ultimo && S.locales.find(l=>l.nombre===ultimo && !l.esGestion)) S.local = ultimo;
    }
    // Si la página se recarga sin señal (se cerró sola, se reinició el
    // dispositivo), acá no veníamos de un login con datos frescos ni de
    // setLocal() — sin esto, S.sabores arrancaba vacío y la app no tenía
    // nada para mostrar hasta que volviera la conexión.
    if(S.local) precargarDatosCache(S.local);
    renderApp();
    reiniciarInactividad();
    await cargarDatos();
    iniciarPolling();
    colaFlush();
  } else {
    iniciarAuth();
  }
  iniciarChequeoDeVersion();
}
// Guarda el cascarón de la app (este HTML + manifest + íconos) en el
// dispositivo la primera vez que hay señal, para que después se pueda
// seguir abriendo sin internet (tablets de cámara lejos del salón, que a
// veces solo tienen wifi una vez al día). Los datos de sabores/stock/
// registros ya se cacheaban solos en localStorage; esto solo cubre que la
// propia app pueda arrancar sin red.
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
start();

function renderBloqueo(){
  if(S.esGestion){
    // Entró por Operaciones (sin PIN propio) — el desbloqueo pide la misma
    // contraseña de local, no un PIN que esta cuenta nunca llegó a crear.
    return `<div class="authWrap"><div class="authCard">
      <h1>Sesión bloqueada</h1>
      <p>${esc(S.empleado.nombre.split(" ")[0])}, ingresá la contraseña de Operaciones para seguir.</p>
      <input type="text" id="bloqueoClaveInput" class="inputMasked" placeholder="Contraseña" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:100%" value="${esc(S.bloqueoClave)}" ${S.bloqueoCargando?"disabled":""}>
      ${S.bloqueoCargando?`<div class="note">Verificando…</div>`:S.bloqueoError?`<div class="warn">${esc(S.bloqueoError)}</div>`:""}
      <button type="button" class="btn" id="bloqueoDesbloquear" style="width:100%;margin-top:10px" ${S.bloqueoCargando?"disabled":""}>${S.bloqueoCargando?"Verificando…":"Desbloquear"}</button>
      <button type="button" class="btn ghost" id="bloqueoSalir" style="width:100%;margin-top:10px" ${S.bloqueoCargando?"disabled":""}>Salir</button>
    </div></div>`;
  }
  return `<div class="authWrap"><div class="authCard">
    <h1>Sesión bloqueada</h1>
    <p>${esc(S.empleado.nombre.split(" ")[0])}, ingresá tu PIN para seguir.</p>
    <div class="dots">${[0,1,2,3].map(i=>`<span class="${i<S.bloqueoPin.length?"on":""}"></span>`).join("")}</div>
    ${S.bloqueoCargando?`<div class="note">Verificando…</div>`:S.bloqueoError?`<div class="warn">${esc(S.bloqueoError)}</div>`:""}
    <div class="keypad">
      ${["1","2","3","4","5","6","7","8","9"].map(k=>`<button type="button" data-tecla-bloqueo="${k}" ${S.bloqueoCargando?"disabled":""}>${k}</button>`).join("")}
      <button type="button" class="op" id="bloqueoSalir" ${S.bloqueoCargando?"disabled":""}>Salir</button>
      <button type="button" data-tecla-bloqueo="0" ${S.bloqueoCargando?"disabled":""}>0</button>
      <button type="button" class="op" data-tecla-bloqueo="borrar" ${S.bloqueoCargando?"disabled":""}>Borrar</button>
    </div>
  </div></div>`;
}
// Tocar +1/-1 muchas veces seguidas (cargando un remito grande a mano, por
// ejemplo) antes disparaba un renderApp() — que reconstruye TODA la grilla
// de sabores, ahora ~100+ tarjetas — por cada toque. En una tablet eso tarda
// lo suficiente como para que los toques se acumulen en la cola de eventos
// del navegador y después salten todos juntos de golpe ("se bugea"). Acá
// agrupamos varios toques seguidos en un solo render, justo antes del
// próximo repintado — cada toque individual vuelve a ser instantáneo.
let _renderProgramado=false;
/* ---------- Salida: mantener apretado para elegir cuántos (alfajores y conitos) ----------
   Tocar sigue sumando de a uno. Mantener ~450 ms abre "¿Cuántos sacás?".
   Solo Alfajores y Conitos (chocolatería), a pedido de Gabi 20/10/2026. */
const MANTENER_MS = 450;
const CATEGORIAS_MANTENER = ["Alfajores","Conitos"];
function esMantenible(s){
  return !!s && grupoProductoDe(s)==="chocolateria" && CATEGORIAS_MANTENER.indexOf(s.categoria)!==-1;
}
let _mantenerTimer=null;
document.addEventListener("pointerdown", e=>{
  S.mantenerSuprimirClick=false;
  const b=e.target.closest("[data-mantener]"); if(!b) return;
  clearTimeout(_mantenerTimer);
  _mantenerTimer=setTimeout(()=>{ _mantenerTimer=null; S.mantenerSuprimirClick=true; abrirMantener(b.dataset.mantener) }, MANTENER_MS);
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>document.addEventListener(ev, ()=>{ clearTimeout(_mantenerTimer); _mantenerTimer=null }));
// En Android, mantener apretado abre el menú contextual: lo cancelamos solo sobre los sabores que lo usan.
document.addEventListener("contextmenu", e=>{ if(e.target.closest("[data-mantener]")) e.preventDefault() });
function mantenerMax(id){ return Math.max(0,vendibleDe(id)-(S.cart.salida[id]||0)) }
function abrirMantener(id){
  if(mantenerMax(id)<=0){ toast("No queda más stock para sacar."); return }
  S.mantener={id:String(id), n:1}; renderMantener();
}
function cerrarMantener(){ S.mantener=null; renderMantener() }
function renderMantener(){
  let ov=document.getElementById("mantenerOv");
  if(!S.mantener){ if(ov) ov.remove(); return }
  const m=S.mantener, s=(S.sabores||[]).find(x=>String(x.id)===m.id);
  if(!s){ cerrarMantener(); return }
  if(!ov){
    ov=document.createElement("div"); ov.id="mantenerOv"; ov.className="mantenerOv";
    ov.addEventListener("click", e=>mantenerClick(e));
    ov.addEventListener("input", e=>{ if(e.target.id==="mantN"){ m.n=Math.min(Math.max(0,parseInt(e.target.value,10)||0),mantenerMax(m.id)); e.target.value=m.n; actualizarOkMantener(ov) } });
    document.body.appendChild(ov);
  }
  const max=mantenerMax(m.id), stock=stockMap()[m.id]||0, ya=S.cart.salida[m.id]||0, caja=Number(s.cantidad_maestra)||0;
  m.n=Math.min(m.n,max);
  const atajos=[1,6,12].filter(q=>q<=max).map(q=>`<button type="button" class="chip" data-mant-q="${q}">+${q}</button>`)
    .concat(caja&&caja<=max?[`<button type="button" class="chip" data-mant-q="${caja}">+${caja} caja</button>`]:[]).join("");
  ov.innerHTML = `<div class="mantenerBox" role="dialog" aria-modal="true" aria-labelledby="mantTit">
    <p class="mantTit" id="mantTit">¿Cuántos sacás?</p>
    <p class="mantSub">${esc(s.nombre)} · hay ${stock} en stock${ya?` · ya en la salida: ${ya}`:""}</p>
    <div class="mantStep">
      <button type="button" class="mantBtn" data-mant-dec aria-label="Restar uno">−</button>
      <input type="number" id="mantN" min="0" max="${max}" inputmode="numeric" value="${m.n}" aria-label="Cantidad a sacar">
      <button type="button" class="mantBtn" data-mant-inc aria-label="Sumar uno">+</button>
    </div>
    <div class="mantQuick">${atajos}</div>
    <p class="mantAyuda">Podés escribir el número. Como máximo podés sacar ${max}.</p>
    <div class="mantAcc">
      <button type="button" class="btn ghost" data-mant-cancel>Cancelar</button>
      <button type="button" class="btn" data-mant-ok>Agregar ${m.n}</button>
    </div>
  </div>`;
  actualizarOkMantener(ov);
}
function actualizarOkMantener(ov){
  const btn=ov.querySelector("[data-mant-ok]"); if(!btn||!S.mantener) return;
  btn.disabled=S.mantener.n<1; btn.textContent="Agregar "+S.mantener.n;
}
function mantenerClick(e){
  const ov=e.currentTarget, m=S.mantener; if(!m) return;
  if(e.target===ov){ cerrarMantener(); return }
  const t=e.target.closest("button"); if(!t) return;
  const max=mantenerMax(m.id);
  if(t.dataset.mantCancel!==undefined){ cerrarMantener(); return }
  if(t.dataset.mantOk!==undefined){
    const n=Math.min(m.n,max);
    if(n>0){ const c=S.cart.salida; c[m.id]=(c[m.id]||0)+n; S.confirm=false }
    cerrarMantener(); scheduleRender(); return;
  }
  if(t.dataset.mantDec!==undefined) m.n=Math.max(0,m.n-1);
  else if(t.dataset.mantInc!==undefined) m.n=Math.min(max,m.n+1);
  else if(t.dataset.mantQ!==undefined) m.n=Math.min(max,m.n+Number(t.dataset.mantQ));
  else return;
  renderMantener();
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.mantener){ cerrarMantener() } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.elegirLote){ cerrarElegirLote() } });

function scheduleRender(){
  if(_renderProgramado) return;
  _renderProgramado=true;
  requestAnimationFrame(()=>{ _renderProgramado=false; renderApp(); });
}
function renderApp(){
  _lotesMemo=null;
  document.body.classList.remove("sinLocal");
  const m=$("#app");
  if(S.auth){ m.innerHTML = renderAuth(); return }
  if(!S.empleado){ iniciarAuth(); return }
  if(S.bloqueado){ m.innerHTML = renderBloqueo(); return }
  m.innerHTML = renderHeader() + `<div class="wrap"><main id="main">${renderMain()}</main></div>` + renderNav() + `<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>`;
  document.body.classList.toggle("sinLocal", !S.local);
  renderBar();
  if(S.offline || S.cola.length){
    const b=document.createElement("div"); b.className="offlineBadge";
    b.textContent = S.cola.length ? `${S.cola.length} sin enviar` : "Sin conexión";
    document.body.appendChild(b); setTimeout(()=>b.remove(), 4000);
  }
}
</script>
