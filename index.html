<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LogiStock Lucciano's</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#5E7A3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LogiStock Lucciano's">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F5F0E8; --surface:#ffffff; --ink:#2A1E17; --muted:#6B5D52; --line:#E6DDD0;
  --accent:#7A3E1D; --accent-hover:#5A2B12; --accent-ink:#ffffff; --accent-soft:#F1E4D6;
  --alert:#8A1F11; --alert-soft:#F6D5CF; --warn:#6B3F00; --warn-soft:#FBE7C6;
  --ok:#24461A; --ok-soft:#E3EEDC; --plate:#ffffff;
  --header-bg:#2A1E17; --header-bg-rgb:42,30,23; --header-ink:#F5F0E8; --header-muted:#D9CBB8; --header-chip:#3D2C22;
  --surface-rgb:255,255,255; --glass-line:rgba(255,255,255,.14);
  --accent-rgb:122,62,29; --warn-rgb:107,63,0; --alert-rgb:138,31,17;
  --wa:#1E6B45; --wa-bubble:#DCF3D0; --wa-bubble-ink:#1F2A1A; --wa-panel:#ECE5DD;
  --display:"Fraunces","Georgia",serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* Tema crema siempre, sin importar el modo del sistema — a Gabi no le
   gustaba que la app se pusiera oscura sola en dispositivos con modo
   oscuro activado. El tema oscuro queda armado para uso manual futuro
   (ej. un botón de "modo oscuro"), vía data-theme="dark" explícito. */
:root[data-theme="dark"]{
  --bg:#1B1611; --surface:#241D17; --ink:#F2EAE1; --muted:#B3A395; --line:#3A2F26;
  --accent:#D9925A; --accent-hover:#E8A671; --accent-ink:#1B1611; --accent-soft:#3A2A1E;
  --alert:#F0968A; --alert-soft:#3D211C; --warn:#E0B266; --warn-soft:#3A2C15;
  --ok:#8FCB9E; --ok-soft:#1B3220; --plate:#F2EAE1;
  --wa-bubble:#204030; --wa-bubble-ink:#DCF3D0; --wa-panel:#182721;
  --surface-rgb:36,29,23; --glass-line:rgba(255,255,255,.08);
  --accent-rgb:217,146,90; --warn-rgb:224,178,102; --alert-rgb:240,150,138; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 40%),rgba(var(--header-bg-rgb),.62);backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);color:var(--header-ink);padding-block:14px 0;border-bottom:1px solid rgba(255,255,255,.16);box-shadow:0 8px 32px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-inline:16px;max-width:980px;margin:0 auto}
.brand .tit{display:flex;flex-direction:column;gap:1px}
h1{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--header-muted);letter-spacing:.04em}
.localSel{display:flex;align-items:center;gap:8px;color:var(--header-ink)}
.localSel input{width:170px}
.localSel label{font-size:.72rem;color:var(--header-muted);text-transform:uppercase;letter-spacing:.06em}
.localFija{font-weight:700}
select,input[type=text],input[type=search],input[type=number],input[type=tel]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
select{max-width:220px}
.userChip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-line);border-radius:999px;padding:5px 6px 5px 14px;font-size:.82rem}
.userChip button{min-height:32px;padding:0 14px;border-radius:999px;border:0;background:var(--bg);color:var(--ink);font-weight:700;font-size:.78rem}
.userChip #editarNombre{padding:0;width:32px;font-size:.95rem;background:transparent;color:var(--header-ink)}
.alertPill{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(251,231,198,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(251,231,198,.28);color:#F2C879;font-size:.82rem;font-weight:700}
.timerInact{font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--muted);white-space:nowrap}
.timerInact.urgente{color:#F2C879;border-color:rgba(251,231,198,.4)}
.timerInact:empty{display:none}
.bottomNav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9;
  display:flex;gap:2px;padding:6px;max-width:820px;margin-inline:auto;border-radius:26px;
  background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 40%),rgba(var(--header-bg-rgb),.78);
  backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bottomNav button{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:58px;border:0;border-radius:20px;background:transparent;color:var(--header-muted);font-size:.66rem;font-weight:700;transition:background .15s,color .15s}
.bottomNav button svg{width:22px;height:22px;flex:none}
.bottomNav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bottomNav button[aria-selected=true]{background:rgba(255,255,255,.14);color:var(--header-ink)}
.bottomNav .n{position:absolute;top:4px;right:18%;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--alert);color:#fff;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.bottomNav[hidden]{display:none}
.alertBar{margin-top:14px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alertBar span{font-weight:500;color:var(--ink)}
.note{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.tools .grow{flex:1 1 180px}
.tools input{width:100%}
.glass{background:rgba(var(--surface-rgb),.6);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(var(--surface-rgb),.78);box-shadow:0 1px 0 rgba(var(--surface-rgb),.9) inset,0 6px 16px -8px rgba(var(--header-bg-rgb),.18)}
/* Pills de filtro, formato premium (mock Chocolatería 19/10/2026): superficie sólida y
   legible; activa = bloque oscuro con texto claro, para que se vea de un vistazo cuál está prendido. */
.chip{min-height:30px;border:1px solid rgba(var(--header-bg-rgb),.22);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 11px;font-weight:700;font-size:.8rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vencCampo{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.vencCampo input{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font-size:.9rem;font-weight:700;text-transform:none;letter-spacing:0}
.vencCampo.falta input{border:1.5px dashed var(--alert)}
.vencCampo.omitido{flex-direction:row;align-items:center;justify-content:space-between;gap:8px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)}
.vencHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vencHint{font-size:.72rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)}
.tabsCat{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;border-bottom:1px solid var(--line);margin:10px 0 12px}
.tabCat{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 0 9px;font:inherit;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabCat[aria-selected=true]{color:var(--ink);font-weight:800;border-bottom-color:var(--ink)}
.perRow{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.segPer{display:flex;flex:1;max-width:340px;background:#EADFCD;border-radius:12px;padding:3px}
.segBtn{flex:1;border:none;background:none;border-radius:9px;padding:7px 0;font:inherit;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;text-align:center}
.segBtn[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(42,30,23,.14)}
.calWrap{position:relative;flex:none}
.calBtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.calBtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rangoMenu{position:absolute;right:0;top:42px;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px rgba(42,30,23,.18);padding:6px;display:flex;flex-direction:column;z-index:20}
.rangoOpt{border:none;background:none;border-radius:10px;padding:9px 10px;font:inherit;font-size:.85rem;font-weight:700;color:var(--ink);cursor:pointer;text-align:center}
.rangoOpt.on{background:#F0E7D9;font-weight:800}
.rangoCal{color:var(--accent);font-weight:800}
.rangoSep{height:1px;background:var(--line);margin:4px 6px}
.tituloTabla{text-align:center}
.tbl th,.tbl td{text-align:center}
.subCats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:#EFE6D6;border-radius:14px;padding:10px;margin:8px 0 4px}
.subCat{font:inherit;font-size:.78rem;font-weight:700;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.subCat[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.calCard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin:0 0 12px;max-width:420px}
.calHead{display:flex;align-items:center;justify-content:space-between}
.calNav{width:34px;height:34px;border-radius:999px;border:none;background:#F0E7D9;color:var(--ink);font-size:18px;font-weight:800;cursor:pointer}
.calTitulo{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:17px}
.calGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;row-gap:4px}
.calSem{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.calDia{height:40px;border:none;background:none;border-radius:999px;font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;padding:0}
.calDia.rango{background:#E9DCC9;border-radius:0}
.calDia.hoy{box-shadow:inset 0 0 0 1.5px var(--accent)}
.calDia.sel{background:var(--accent);color:#fff}
.calDia:disabled{opacity:.3;cursor:default}
.calHint{font-size:.78rem;color:var(--muted);line-height:1.4}
.calRes{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.85rem}
.calRes span{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px}
.calBotones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vencOmitir{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.75rem;text-transform:none;letter-spacing:0;cursor:pointer}
.cantInput{width:64px;height:36px;text-align:center;font-weight:800;font-size:1rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 6px}
/* Tarjeta con ícono + texto para un CTA destacado (Pedido sugerido / Volver
   a Stock, Leer remito con una foto) — se combina con .glass para la
   superficie translúcida. */
.ctaCard{border:0;margin:0;font:inherit;color:inherit;text-align:left;background:none;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;cursor:pointer}
.ctaCard:active{transform:scale(.98)}
.ctaCard .ico{flex:none;width:38px;height:38px;border-radius:999px;background:rgba(var(--accent-rgb),.14);display:flex;align-items:center;justify-content:center}
.ctaCard .tx{flex:1;text-align:left;min-width:0}
.ctaCard .tx b{display:block;font-weight:800;font-size:.88rem}
.ctaCard .tx span{display:block;font-size:.74rem;color:var(--muted);margin-top:1px}
.emp{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.emp label{font-weight:700}
.emp input{flex:1 1 200px}
.emp.missing input{border-color:var(--alert);background:var(--alert-soft)}
.sec{font-family:var(--body);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{position:relative}
.card>.pick{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 0 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;overflow:hidden;transition:transform .08s,border-color .15s}
.card>.pick:active{transform:scale(.97)}
.card.sel>.pick{border-color:var(--accent);border-width:2.5px}
.strip{display:block;width:100%;height:7px}
.plate{width:60px;height:60px;flex:none;border-radius:14px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.cardTop{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 13px 0;width:100%}
.pnombre{font-weight:700;font-size:.88rem;line-height:1.2;height:2.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pstock{padding:0 13px;margin-top:auto;display:flex;align-items:baseline;gap:5px}
.pstock b{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1}
.pstock span{font-size:.72rem;color:var(--muted)}
.badge{margin:0 13px;padding:2px 9px;border-radius:999px;font-size:.68rem;font-weight:800;align-self:flex-start;border:1px solid transparent}
.badge.warn{background:rgba(var(--warn-rgb),.12);color:var(--warn);border-color:rgba(var(--warn-rgb),.22)}
.badge.alert{background:rgba(var(--alert-rgb),.12);color:var(--alert);border-color:rgba(var(--alert-rgb),.22)}
.qty{position:absolute;top:10px;right:8px;min-width:34px;height:34px;border-radius:17px;background:var(--accent);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0 8px;pointer-events:none}
.minus{position:absolute;top:10px;left:8px;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem;line-height:1}
.card.sel .strip{filter:brightness(0.85)}
.card.agotado>.pick{opacity:.45;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:linear-gradient(345deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 40%),rgba(var(--surface-rgb),.6);backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 rgba(255,255,255,.3),0 -8px 32px rgba(0,0,0,.28)}
.bar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .sum{flex:1 1 200px;min-width:0;font-size:.88rem;color:var(--muted)}
.bar .sum b{color:var(--ink)}
.btn{min-height:50px;border:0;border-radius:14px;padding:0 18px;font-weight:800;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wa{background:var(--wa);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn.desperdicio{background:rgba(var(--warn-rgb),.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--warn);border:1px solid rgba(var(--warn-rgb),.25);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 4px 10px -6px rgba(var(--warn-rgb),.3)}
.btn.produccion{background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 2px 12px rgba(122,62,29,.4)}
.btn.volver{background:var(--ink);color:var(--bg);border:0;box-shadow:0 2px 12px rgba(42,30,23,.35)}
/* Contraseñas compartidas (local/Operaciones): se ven enmascaradas
   igual que un input type="password", pero SON type="text" — así el
   navegador no las reconoce como campo de contraseña y no ofrece
   guardarlas/autocompletarlas (eso es justo lo que no queremos acá,
   es una clave de local compartida, no la de una persona). */
.inputMasked{-webkit-text-security:disc;text-security:disc}
.warn{color:var(--alert);font-weight:600}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .plate{width:54px;height:54px}
.row .nm{font-weight:700;min-width:0}
.row .meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.row .right{display:flex;align-items:center;gap:8px}
.row input[type=number]{width:70px;text-align:right;font-variant-numeric:tabular-nums}
.saborRow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.rows .saborRow:first-child{border-top:0}
.saborRow .plate{width:54px;height:54px}
.saborRow .nm{font-weight:700;min-width:0}
.saborRow .meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.saborRow.baja{opacity:.55}
.saborForm{background:var(--accent-soft)}
.saborForm input,.saborForm select{min-height:38px;border-radius:9px;border:1px solid var(--line);padding:0 10px;background:var(--surface);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:999px;border:0;background:rgba(var(--header-bg-rgb),.08);color:var(--ink);font-weight:800;font-size:1.1rem}
.stepper button:last-child{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 10px -4px rgba(var(--accent-rgb),.5)}
.stepper button:disabled{opacity:.4}
.stepper .n{width:32px;text-align:center;font-family:var(--display);font-size:1.15rem;font-weight:700}
.big{font-family:var(--display);font-weight:700;font-size:1.3rem;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.big.low{color:var(--warn)}
.big.crit{color:var(--alert)}
.pill{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:6px}
.pill.salida{background:var(--accent-soft);color:var(--accent)}
.pill.ingreso{background:var(--ok-soft);color:var(--ok)}
.pill.conteo{background:var(--line);color:var(--ink)}
.pill.devolucion{background:var(--warn-soft);color:var(--warn)}
.pill.desperdicio{background:var(--alert-soft);color:var(--alert)}
.pill.produccion{background:var(--accent);color:var(--accent-ink)}
.hist{display:flex;flex-direction:column;gap:8px}
.h{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.h.anulado{opacity:.55}
.h .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.h .top .who{font-weight:700}

<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   LogiStock Lucciano's — cliente estático (GitHub Pages)
   Backend: Google Apps Script + Google Sheets (ver apps-script/).
   Pegá acá la URL del deploy (termina en /exec).
============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbw6xlN3nrDdJ4w-kVoNunOKQEE-rHvj515lYWpuEDybrhM1stfZUsaGVZjXc3IgL1oi/exec";

// Versión del FRONTEND (este archivo) — se bumpea en cada cambio de index.html,
// independiente de BACKEND_VERSION (que solo se mueve con cambios en Code.gs).
// Sirve para confirmar a simple vista, mirando el header, que el dispositivo
// ya cargó la última versión pusheada (útil por el caché del navegador/GitHub Pages).
const FRONTEND_VERSION = "1.71.1";

const POLL_MS = 30000;
const INACTIVIDAD_TABLET_MS = 60000;
const INACTIVIDAD_PC_MS = 10 * 60 * 1000;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normalizar=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():"c"+Date.now()+"-"+Math.random().toString(36).slice(2));
const ls={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}},
};
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}

/* ============================================================
   ESTADO
============================================================ */
const S = {
  deviceLocal: ls.get("deviceLocal","") || null, // local fijo de este dispositivo (tablet) o null (PC/gestión)
  token: ls.get("sesionToken","") || null,
  empleado: JSON.parse(ls.get("sesionEmpleado","null")),
  esGestion: ls.get("sesionEsGestion","")==="1", // entró por Operaciones (sin PIN propio) — el bloqueo por inactividad pide la clave de Operaciones, no un PIN
  gestionLocal: ls.get("sesionGestionLocal","") || null,
  esTablet: false, // se decide en start(): true si hay deviceLocal
  auth: null, // pantalla de login en curso
  locales: [],
  local: null,
  sabores: [], saboresPorId: {}, saboresExcluidos: [], produccionLocal: false,
  regs: [], stock: null,
  tab: "salida",
  cart: { salida:{}, ingreso:{}, devolucion:{}, desperdicio:{}, produccion:{} },
  vencimientos: {}, // chocolatería: vencimiento por sabor del carrito de Ingreso (YYYY-MM-DD)
  vencConteo: {}, // chocolatería: vencimiento por sabor del conteo físico (YYYY-MM-DD)
  vencOmit: {}, // alfajores/conitos: "ing:<id>" o "conteo:<id>" marcados con Omitir (sin fecha, opcional)
  kilosProduccion: {}, // kilos fabricados por sabor en modo Producción — dato suelto, sin fórmula con las vasquetas del carrito
  modoDevolucion: false, // responsable viendo Devolución desde adentro de Ingreso (colaborador tiene su propia pestaña, no usa esto)
  modoDesperdicio: false, // viendo Desperdicio desde adentro de Salida
  modoProduccion: false, // viendo Producción desde adentro de Ingreso (local con Locales.produccion=SI)
  motivoDesperdicio: "",
  confirm: false, remito: "", fotoRemitoUrl: "", q: "", filtroFamilia: null, filtroCategoria: "todas", catAbierta: false, soloAlerta: false, needEmp:false,
  conteo: null,
  lectorRemito: null,
  verPedido: false,
  diasEntrega: Number(ls.get("diasEntrega","3"))||3,
  categoriaHist: "todas", // todas|vasquetas|icepops|desperdicio|produccion — pills de categoría de Historial
  rangoHist: "d7", // d1/d7/d30/d60 = últimos N días (incluye hoy) — segmento Hoy/7/30/Todo, s0..s3 = semana actual..hace 3 semanas, m0/m1 = mes actual/pasado, c<desde>|<hasta> = rango del calendario (YYYY-MM-DD) — tabla de Historial
  calHist: null, // calendario de Historial abierto: {mes, d, h} (d/h = YYYY-MM-DD elegidos), null = cerrado
  rangoMenu: false, // menú de período de Historial (presets + Rango personalizado) abierto
  pedidoAdj: {},
  cola: JSON.parse(ls.get("cola","[]")),
  busy: false, offline: false,
  inactTimer: null, pollTimer: null,
};

function guardarSesionPC(){
  ls.set("sesionToken", S.token||""); ls.set("sesionEmpleado", JSON.stringify(S.empleado||null));
  ls.set("sesionEsGestion", S.esGestion?"1":"0"); ls.set("sesionGestionLocal", S.gestionLocal||"");
}
function limpiarSesion(){
  S.token=null; S.empleado=null; S.esGestion=false; S.gestionLocal=null;
  ls.del("sesionToken"); ls.del("sesionEmpleado"); ls.del("sesionEsGestion"); ls.del("sesionGestionLocal");
}

/* ============================================================
   API — fetch POST text/plain (evita preflight CORS), acción
   despachada por "accion". Mismo patrón que luccianos-academy.
============================================================ */
async function api(accion, payload={}, timeoutMs=30000){
  if(!API_URL || API_URL.indexOf("PEGAR_URL")===0){
    return { ok:false, error:"La app todavía no está conectada. Avisale a Gabi que falta pegar la URL de Apps Script en index.html." };
  }
  for(let intento=0; intento<2; intento++){
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), timeoutMs);
    try{
      const res = await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(Object.assign({accion, token:S.token}, payload)),
        signal: ctrl.signal,
      });
      const data = await res.json();
      S.offline = false;
      if(data && data.backendVersion) S.backendVersion = data.backendVersion;
      if(data && data.sesionInvalida){ cerrarSesion(true); }
      return data;
    }catch(err){
      clearTimeout(t);
      if(intento===0) continue; // primer intento falló (puede ser un cuelgue puntual de Apps Script) — reintentamos una vez antes de avisar
      S.offline = true;
      const esTimeout = err && err.name==="AbortError";
      return { ok:false, error: esTimeout ? "Está tardando más de lo normal. Probá de nuevo." : "Sin conexión.", offline:true };
    }finally{
      clearTimeout(t);
    }
  }
}

/* ============================================================
   COLA OFFLINE — movimientos que no se pudieron mandar todavía
============================================================ */
function colaGuardar(){ ls.set("cola", JSON.stringify(S.cola)); }
function colaAgregar(accion, payload){
  S.cola.push({ id: payload.clienteId, accion, payload, ts: Date.now() });
  colaGuardar();
}
async function colaFlush(){
  if(!S.cola.length || !S.token) return;
  const pendiente = [...S.cola];
  for(const item of pendiente){
    const r = await api(item.accion, item.payload);
    if(r && r.ok){
      S.cola = S.cola.filter(x=>x.id!==item.id);
      colaGuardar();
    } else if(!r || !r.offline){
      // el backend contestó pero rechazó el movimiento (no es un problema de red): lo sacamos de la cola para no reintentar algo que nunca va a andar
      S.cola = S.cola.filter(x=>x.id!==item.id);
      colaGuardar();
      toast("No se pudo registrar un movimiento pendiente: "+((r&&r.error)||"motivo desconocido")+". Avisá a tu encargado.");
    } else {
      break; // seguimos sin conexión, reintentamos en el próximo ciclo
    }
  }
  await cargarDatos();
}
window.addEventListener("online", colaFlush);

/* ============================================================
   SABORES / STOCK
============================================================ */
function nombre(id){ return (S.saboresPorId[id]||{}).nombre || ("Sabor "+id) }
function minimoDe(id){ return (S.saboresPorId[id]||{}).minimo ?? 6 }
function tipoDe(id){ return (S.saboresPorId[id]||{}).tipo || "v" }
const UNIDAD_LABEL = { b:["balde","baldes"], i:["icepop","icepops"], m:["caja","cajas"], p:["pote","potes"], v:["vasqueta","vasquetas"], c:["unidad","unidades"] };
function unidad(id,n){ const l=UNIDAD_LABEL[tipoDe(id)]||UNIDAD_LABEL.v; return n===1?l[0]:l[1] }
const TIPO_LABEL = { v:"Vasqueta", b:"Balde", i:"Icepop", m:"Mini icepops (caja x4)", p:"Pote individual", c:"Chocolatería (unidad)" };

function regsActivos(){ return S.regs.filter(r=>!r.anulado) }
/** Busca si este N° de remito ya tiene un ingreso cargado (no anulado) en
 *  este local — para avisar antes de confirmar, no para bloquear (puede
 *  ser una coincidencia real, o el proveedor reusó el número). */
function remitoDuplicado(remito, local){
  const v=String(remito||"").trim().toLowerCase();
  if(!v) return null;
  return regsActivos().find(r=>r.tipo==="ingreso" && !r.subtipo && r.local===local && String(r.remito||"").trim().toLowerCase()===v) || null;
}

function stockMapHasta(hasta){
  const base=(S.stock&&S.stock.base)||{}, bts=(S.stock&&S.stock.ts)||0, m={};
  S.sabores.forEach(s=>m[s.id]=+base[s.id]||0);
  for(const r of regsActivos()){ if(r.ts<=bts || r.ts>hasta) continue;
    const sg=r.tipo==="ingreso"?1:r.tipo==="salida"?-1:0;
    for(const [id,q] of Object.entries(r.items||{})) if(id in m) m[id]+=sg*(+q||0); }
  return m;
}
function stockMap(){ return stockMapHasta(Date.now()) }
/** Lunes 00:00 de la semana de `ts` (o de ahora si no se pasa nada). */
function lunesDe(ts){
  const d=new Date(ts===undefined?Date.now():ts), dow=(d.getDay()+6)%7;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow).getTime();
}
/** Para cada sabor, consumo y si hubo quiebre de stock en cada una de las
 *  últimas 3 semanas calendario COMPLETAS (lunes a domingo), sin contar la
 *  semana en curso que todavía está a mitad — más vieja primero. Todo se
 *  calcula sobre lo que ya trajo datos() (hasta DIAS_HISTORIAL atrás), sin
 *  pedirle nada nuevo al backend. */
function tendenciaSemanas(){
  const lunesActual=lunesDe();
  const resultado={};
  S.sabores.forEach(s=>resultado[s.id]=[]);
  for(let i=3;i>=1;i--){
    const inicio=lunesActual-i*7*864e5, fin=inicio+7*864e5;
    const stockCorrida=stockMapHasta(inicio-1);
    const totales={}, agotado={};
    const movs=regsActivos().filter(r=>r.ts>=inicio&&r.ts<fin&&(r.tipo==="salida"||r.tipo==="ingreso")).sort((a,b)=>a.ts-b.ts);
    for(const r of movs){
      for(const [id,qRaw] of Object.entries(r.items||{})){
        const q=+qRaw||0; if(!q) continue;
        if(r.tipo==="salida"){ totales[id]=(totales[id]||0)+q; stockCorrida[id]=(stockCorrida[id]||0)-q; if(stockCorrida[id]<=0) agotado[id]=true; }
        else { stockCorrida[id]=(stockCorrida[id]||0)+q; }
      }
    }
    S.sabores.forEach(s=>resultado[s.id].push({total:totales[s.id]||0, agotado:!!agotado[s.id]}));
  }
  return resultado;
}
function salidasDias(dias){
  const since=Date.now()-dias*864e5, m={};
  for(const r of regsActivos()) if(r.tipo==="salida"&&r.ts>=since) for(const [id,q] of Object.entries(r.items||{})) m[id]=(m[id]||0)+(+q||0);
  return m;
}
function inicioDeHoy(){
  const d=new Date();
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
}
/** Por sabor, cuánto sacó hoy esta persona y todavía no devolvió (neto de
 *  las devoluciones de hoy ya guardadas) — es lo que puede devolver ahora
 *  en la pantalla de Devolución. Sabores en 0 no aparecen ahí. */
function pendienteDevolucionHoy(){
  const desde=inicioDeHoy(), sacado={}, devuelto={};
  for(const r of regsActivos()){
    if(r.ts<desde || String(r.empleadoId)!==String(S.empleado.id)) continue;
    if(r.tipo==="salida" && r.subtipo!=="desperdicio") for(const [id,q] of Object.entries(r.items||{})) sacado[id]=(sacado[id]||0)+(+q||0);
    else if(r.tipo==="ingreso" && r.subtipo==="devolucion") for(const [id,q] of Object.entries(r.items||{})) devuelto[id]=(devuelto[id]||0)+(+q||0);
  }
  const pendiente={};
  Object.keys(sacado).forEach(id=>{ const p=sacado[id]-(devuelto[id]||0); if(p>0) pendiente[id]=p; });
  return pendiente;
}
function estadoSabor(id, st){
  const n=st[id], min=minimoDe(id);
  if(n<=0) return {tier:"sinstock", label:"Sin stock", cls:"alert"};
  if(n<Math.max(1,Math.round(min/2))) return {tier:"critico", label:"Crítico", cls:"alert"};
  if(n<min) return {tier:"bajo", label:"Stock bajo", cls:"warn"};
  return null;
}
/** Sabores del catálogo global que ESTE local sí tiene — se usa para
 *  armar las grillas de Salida/Ingreso/Stock/Conteo/Pedido y las
 *  alertas de mínimo. A propósito NO se toca S.sabores/S.saboresPorId
 *  (nombre(), Historial y la lectura de remitos siguen viendo el
 *  catálogo completo), así un sabor que el local excluyó después de
 *  haber tenido movimientos viejos sigue mostrando su nombre real ahí. */
function saboresDelLocal(){
  if(!S.saboresExcluidos || !S.saboresExcluidos.length) return S.sabores;
  const ex=new Set(S.saboresExcluidos);
  return S.sabores.filter(s=>!ex.has(s.id));
}
function alertas(st){ return saboresDelLocal().filter(s=>estadoSabor(s.id,st)) }

// Vasquetas van de a 2 (pedido de fábrica, no se puede pedir una unidad
// suelta). Un icepop con caja maestra cargada redondea a esa cantidad —
// la fábrica se lo manda por caja cerrada, no por unidad individual.
function multiploPedido(id){
  const s=S.saboresPorId[id];
  return (s && s.cantidad_maestra) ? s.cantidad_maestra : 2;
}
function pedidoSugerido(id, st){
  const s7=salidasDias(7), promedioDiario=(s7[id]||0)/7;
  let sug=Math.max(0, Math.ceil(promedioDiario*(S.diasEntrega+1) - st[id]));
  const multiplo=multiploPedido(id);
  sug = Math.ceil(sug/multiplo)*multiplo;
  return Math.max(0, sug + (S.pedidoAdj[id]||0));
}

/* ============================================================
   AUTENTICACIÓN — "¿quién sos?" + PIN con teclado propio
   S.auth = { paso:'local'|'clave'|'quien'|'pin'|'pinConfirm',
              local, empleados, elegido:{id,nombre,rol}, pin, pin1, error, cargando }
============================================================ */
function iniciarAuth(){
  S.auth = { paso: S.deviceLocal ? "quien" : "local", local: S.deviceLocal || null, empleados: [], elegido: null, pin: "", pin1: "", error: "", cargando:false };
  if(S.auth.paso==="quien") cargarEmpleadosDeAuth();
  renderApp();
}
let localesFetchPromise = null;
function refrescarLocales(){
  localesFetchPromise = _refrescarLocales();
  return localesFetchPromise;
}
async function _refrescarLocales(){
  const r = await api("localesActivos", {});
  if(r && r.ok){
    S.locales = r.locales;
    ls.set("localesCache", JSON.stringify(r.locales));
    if(S.auth && S.auth.paso==="local") renderApp();
  }
}
function cargarLocalesSiFalta(){
  // Pintamos con lo que haya en caché al toque (no bloquea el primer render)
  // y refrescamos en segundo plano — evita que la pantalla de login quede
  // en blanco esperando una ida y vuelta a Apps Script.
  if(!S.locales.length){
    const cache = ls.get("localesCache","");
    if(cache){ try{ S.locales = JSON.parse(cache); }catch(e){} }
  }
  return refrescarLocales();
}
function _empleadosCacheKey(esGestion, local){ return esGestion ? "empleadosCache_gestion" : "empleadosCache_"+local }
async function cargarEmpleadosDeAuth(){
  // Cada local ve solo su propio equipo (responsable de local, de turno
  // y colaboradores) — nunca admins/supervisores mezclados ahí, sea PC
  // o tablet. "Operaciones" (S.auth.esGestion) es un local trucho para
  // que admin/supervisor entren: se ve igual que cualquier local en el
  // buscador, nadie que no sepa que existe lo encuentra, y si tiene
  // contraseña cargada queda protegido igual que cualquier otro.
  const esGestion = S.auth.esGestion, local = S.auth.local;
  const key = _empleadosCacheKey(esGestion, local);
  // Pintamos al toque con la nómina que vimos la última vez en este local
  // (si la hay) mientras se refresca en segundo plano — el mismo criterio
  // que ya usamos para el stock: no hacer esperar al backend para mostrar
  // algo, y autocorregirse solo si cambió algo.
  let pintadoDeCache = false;
  if(!S.auth.empleados.length){
    try{
      const cache = ls.get(key, "");
      if(cache){ S.auth.empleados = JSON.parse(cache); pintadoDeCache = true; }
    }catch(e){}
  }
  S.auth.cargando = !pintadoDeCache; S.auth.errorCarga = ""; renderApp();
  const r = esGestion ? await api("empleadosGestion", {}) : await api("empleadosLocal", {local});
  if(!S.auth || S.auth.paso!=="quien" || S.auth.esGestion!==esGestion || S.auth.local!==local) return; // se movió de pantalla mientras esperábamos
  if(r && r.ok){
    S.auth.empleados = r.empleados;
    S.auth.errorCarga = "";
    try{ ls.set(key, JSON.stringify(r.empleados)); }catch(e){}
  } else if(!pintadoDeCache){
    S.auth.errorCarga = (r&&r.error)||"No se pudo conectar. Probá de nuevo.";
  }
  S.auth.cargando = false;
  renderApp();
}
function iniPersona(nombre){
  return nombre.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}
const ROL_LABEL = { admin:"Administrador", supervisor:"Supervisor", encargado:"Responsable de local", turno:"Responsable de turno", colaborador:"Colaborador", produccion:"Producción" };

function authElegirLocal(local){
  S.auth.local=local; S.auth.error="";
  const info=S.locales.find(l=>l.nombre===local);
  S.auth.esGestion = !!(info && info.esGestion);
  if(info && info.tieneClave){ S.auth.paso="clave"; S.auth.clave=""; renderApp(); }
  else { S.auth.paso="quien"; cargarEmpleadosDeAuth(); }
}
async function authEnviarClave(){
  const clave=(S.auth.clave||"").trim();
  if(!clave){ S.auth.error="Ingresá la contraseña del local."; renderApp(); return }
  S.auth.cargando=true; S.auth.error=""; renderApp();
  const r = await api("verificarClaveLocal", {local:S.auth.local, clave});
  S.auth.cargando=false;
  if(r && r.ok){ S.auth.paso="quien"; cargarEmpleadosDeAuth(); }
  else { S.auth.error=(r&&r.error)||"No se pudo verificar la contraseña."; renderApp(); }
}
function authElegirEmpleado(emp){
  if(S.auth.esGestion){ authEntrarGestion(emp); return }
  S.auth.elegido=emp; S.auth.paso="pin"; S.auth.pin=""; S.auth.pin1=""; S.auth.error=""; renderApp();
}
/** Operaciones (admin/supervisor) no pide PIN — alcanza con la
 *  contraseña del local que ya se validó en el paso anterior. */
async function authEntrarGestion(emp){
  if(S.auth.cargando) return; // evita disparar varios pedidos si toca de nuevo mientras espera
  S.auth.elegido=emp; S.auth.cargando=true; S.auth.error=""; renderApp();
  const r = await api("loginGestion", { empleadoId:emp.id, clave:S.auth.clave, local:S.auth.local });
  S.auth.cargando=false;
  if(r && r.ok){ aplicarLogin(r); return }
  S.auth.elegido=null; S.auth.error=(r&&r.error)||"No se pudo entrar. Probá de nuevo.";
  renderApp();
}
function authVolver(){
  if(S.auth.paso==="pinConfirm"){ S.auth.paso="pin"; S.auth.pin=""; renderApp(); return }
  if(S.auth.paso==="pin"){ S.auth.elegido=null; S.auth.paso="quien"; renderApp(); return }
  if(S.auth.paso==="quien" && !S.deviceLocal){
    const info=S.locales.find(l=>l.nombre===S.auth.local);
    S.auth.paso = (info && info.tieneClave) ? "clave" : "local";
    if(S.auth.paso==="local") S.auth.local=null;
    renderApp(); return;
  }
  if(S.auth.paso==="clave"){ S.auth.local=null; S.auth.paso="local"; renderApp(); return }
  S.auth=null; renderApp();
}
/** Desfija el local guardado en este dispositivo — para cuando alguien
 *  fijó un local por error (p. ej. un admin/supervisor que tocó "sí" sin
 *  querer) y necesita volver a elegir, incluida la entrada a Operaciones. */
function cambiarDispositivo(){
  if(!confirm("¿Dejar de usar este local fijo en este dispositivo? La próxima vez va a volver a pedir elegir el local.")) return;
  S.deviceLocal=null; ls.del("deviceLocal");
  S.auth={ paso:"local", local:null, empleados:[], elegido:null, pin:"", pin1:"", error:"", cargando:false };
  renderApp();
}
async function authTecla(k){
  const cur = S.auth.paso==="pinConfirm" ? "pin1" : "pin";
  if(k==="borrar"){ S.auth[cur]=S.auth[cur].slice(0,-1); renderApp(); return }
  if(S.auth[cur].length>=4) return;
  S.auth[cur]+=k;
  renderApp();
  if(S.auth[cur].length===4) setTimeout(authSubmit, 150);
}
async function authSubmit(){
  const a=S.auth;
  if(a.paso==="pin"){
    a.cargando=true; a.error=""; renderApp();
    const r = await api("login", { empleadoId:a.elegido.id, pin:a.pin, local:a.local });
    a.cargando=false;
    if(r && r.ok){ aplicarLogin(r); return }
    if(r && r.primeraVez){ a.paso="pinConfirm"; a.pin1=""; renderApp(); return }
    a.error = (r&&r.error) || "No se pudo validar el PIN.";
    a.pin=""; renderApp();
    return;
  }
  if(a.paso==="pinConfirm"){
    a.cargando=true; a.error=""; renderApp();
    const r = await api("login", { empleadoId:a.elegido.id, pin:a.pin, pinConfirm:a.pin1, local:a.local });
    a.cargando=false;
    if(r && r.ok){ aplicarLogin(r); return }
    a.error = (r&&r.error) || "Los PIN no coinciden. Probá de nuevo.";
    a.paso="pin"; a.pin=""; a.pin1=""; renderApp();
  }
}
function aplicarLogin(r){
  const yaFijado = !!S.deviceLocal;
  const esGestion = S.auth ? S.auth.esGestion : false;
  const localElegido = (S.auth && !esGestion) ? S.auth.local : null;
  const puedeFijar = ["encargado","turno","colaborador","produccion"].indexOf(r.empleado.rol) !== -1;
  S.token = r.token; S.empleado = r.empleado;
  S.esGestion = esGestion; S.gestionLocal = esGestion ? S.auth.local : null;
  // Admin/supervisor: un login NUEVO (recién entrando, o después de haber
  // tocado "Salir") arranca siempre neutral, sin local elegido — nunca el
  // primero de la lista ni el último que se había mirado. Retomar el
  // último local solo tiene sentido si la sesión seguía abierta (ver
  // start(), que sí usa "ultimoLocal" para sobrevivir a un refresco de
  // página sin haber cerrado sesión).
  S.local = (S.deviceLocal) || (r.empleado.rol==="encargado"||r.empleado.rol==="turno"||r.empleado.rol==="colaborador"||r.empleado.rol==="produccion" ? r.empleado.local : localElegido);
  // Siempre arranca en "Salida" — si no, a quien entra por primera vez le
  // puede quedar pegada la pestaña en la que estaba el usuario anterior en
  // este mismo dispositivo (por ejemplo "Equipo", que ni siquiera tendría
  // permiso de ver).
  S.tab = "salida";
  if(!S.deviceLocal) guardarSesionPC();
  if(localElegido) recordarLocalReciente(localElegido);
  S.auth=null;
  if(!yaFijado && puedeFijar && localElegido && confirm(`¿Fijar "${localElegido}" como local de este dispositivo? La próxima vez arranca directo, sin volver a elegir local.`)){
    S.deviceLocal = localElegido; ls.set("deviceLocal", localElegido);
  }
  toast("Hola, "+r.empleado.nombre.split(" ")[0]);
  reiniciarInactividad();
  if(r.datos && r.datos.ok){
    // Vino en la misma respuesta del login — nos ahorramos una ida y vuelta más a Apps Script.
    S.sabores = r.datos.sabores; S.saboresPorId = {}; S.sabores.forEach(s=>S.saboresPorId[s.id]=s);
    S.saboresExcluidos = r.datos.excluidos || [];
    S.produccionLocal = !!r.datos.produccion;
    S.regs = r.datos.registros; S.stock = r.datos.stock;
    // Lo guardamos ya mismo (no solo cuando corra el próximo cargarDatos()) —
    // si el dispositivo se queda sin señal antes del primer polling (30 s),
    // que no se pierda este primer dato ya recibido.
    guardarDatosCache(S.local, {sabores:r.datos.sabores, excluidos:r.datos.excluidos||[], produccion:!!r.datos.produccion, registros:r.datos.registros, stock:r.datos.stock});
  } else {
    cargarDatos();
  }
  iniciarPolling();
  renderApp();
}
function cerrarSesion(silencioso){
  limpiarSesion();
  S.busy = false; // si se cierra la sesión en medio de un guardado (ej. auto-cierre de tablet tras una salida), que no quede "Guardando…" trabado para la próxima persona que entre
  S.local = S.deviceLocal || null;
  S.tab = "salida";
  S.equipo = undefined; S.gestion = undefined; S.saboresAdmin = undefined; S.editandoSaborId = null; S.errorSaboresAdmin = null; S.errorEquipo = null; S.errorGestion = null;
  clearTimeout(S.inactTimer);
  clearInterval(S.pollTimer);
  if(!silencioso) toast("Sesión cerrada");
  iniciarAuth();
}
function hayTrabajoSinGuardar(){
  if(S.conteo) return true; // conteo físico en curso
  return Object.values(S.cart).some(c=>Object.values(c).some(cant=>cant>0));
}
function reiniciarInactividad(){
  clearTimeout(S.inactTimer);
  S.inactHasta = null; // lo fija abajo cuando hay un cierre o bloqueo real; el contador de la cabecera lo lee de acá
  if(S.lectorRemito || !S.empleado || S.esGestion) return; // remito en curso o Operaciones (admin/supervisor): sin timer
  if(S.empleado.rol==="colaborador" || S.empleado.rol==="produccion"){
    // Colaborador/producción (tablet y PC, misma regla): se cierra la sesión
    // entera a los 60 s (vuelve a elegir quién sos) — pero no si hay un carrito
    // o un conteo sin guardar, ahí sí se perdería.
    if(hayTrabajoSinGuardar()) return;
    S.inactHasta = Date.now() + INACTIVIDAD_TABLET_MS;
    S.inactTimer = setTimeout(()=>cerrarSesion(false), INACTIVIDAD_TABLET_MS);
    return;
  }
  // Encargado/turno/supervisor (tablet y PC): no cierra sesión, solo bloquea la pantalla
  // a los 10 min y pide el PIN de quien está logueado. Nunca pierde el carrito
  // ni el conteo (siguen ahí al desbloquear), así que bloquea igual aunque haya
  // algo sin guardar — es lo que evita que alguien use el equipo sin PIN si lo
  // dejaron abierto.
  S.inactHasta = Date.now() + INACTIVIDAD_PC_MS;
  S.inactTimer = setTimeout(()=>bloquearPC(), INACTIVIDAD_PC_MS);
}
// Contador chiquito en la cabecera: muestra cuánto falta para que se bloquee
// (PC, tablet de encargado/turno) o se cierre (tablet de colaborador/producción)
// la sesión por inactividad. No aparece en Operaciones (sin timer).
function segundosInact(){
  if(!S.inactHasta || S.bloqueado) return null;
  return Math.max(0, Math.ceil((S.inactHasta - Date.now()) / 1000));
}
function textoTimerInact(seg){
  return seg===null ? "" : `${Math.floor(seg/60)}:${String(seg%60).padStart(2,"0")}`;
}
function actualizarTimerInact(){
  const el = document.getElementById("timerInact");
  if(!el) return;
  const seg = segundosInact();
  el.textContent = textoTimerInact(seg);
  el.classList.toggle("urgente", seg!==null && seg<=60);
}
function bloquearPC(){
  if(S.bloqueado) return;
  S.bloqueado = true; S.bloqueoPin = ""; S.bloqueoClave = ""; S.bloqueoError = "";
  renderApp();
}
async function desbloquearPC(){
  if(S.esGestion){ if(!S.bloqueoClave) return }
  else if(S.bloqueoPin.length!==4) return;
  S.bloqueoCargando = true; S.bloqueoError=""; renderApp();
  const r = S.esGestion
    ? await api("loginGestion", { empleadoId:S.empleado.id, clave:S.bloqueoClave, local:S.gestionLocal })
    : await api("login", { empleadoId:S.empleado.id, pin:S.bloqueoPin, local:S.local });
  S.bloqueoCargando = false;
  if(r && r.ok){
    S.token = r.token; guardarSesionPC();
    S.bloqueado = false; S.bloqueoPin = ""; S.bloqueoClave = "";
    reiniciarInactividad();
    renderApp();
  } else {
    S.bloqueoError = (r&&r.error) || (S.esGestion?"Contraseña incorrecta.":"PIN incorrecto.");
    S.bloqueoPin = ""; S.bloqueoClave = ""; renderApp();
  }
}
// Cualquier uso de la pantalla cuenta como actividad: en PC se lee y se carga
// mucho con la rueda del mouse y el teclado, sin tocar un botón. Antes solo
// contaban click/input/touch y la PC se bloqueaba mientras la estaban usando.
// El scroll no burbujea desde los contenedores, por eso va con captura.
/* Chocolatería: cada producto del carrito de Ingreso pide su vencimiento antes de confirmar. */
function esChocolateria(id){ return (S.saboresPorId[id]||{}).familia==="chocolateria" }
/** Alfajores, conitos y minis (categoría Alfajores/Conitos) se rotulan a mano en
 *  el local: el vencimiento es opcional. El resto viene con fecha impresa y la pide. */
function requiereVencimiento(id){ const c=(S.saboresPorId[id]||{}).categoria; return esChocolateria(id) && c!=="Alfajores" && c!=="Conitos" }
/** Campo de vencimiento de un renglón de chocolatería. Obligatorio (tabletas,
 *  avellas, latas, squares): label con fecha, en alerta si falta. Opcional
 *  (alfajores/conitos): muestra "Omitir" para seguir de largo sin fecha. */
function vencCampoHTML(id, valor, prefijo, attr){
  const clave=prefijo+id;
  if(requiereVencimiento(id)) return `<label class="vencCampo${!valor?" falta":""}">Vencimiento<input type="date" ${attr}="${id}" value="${esc(valor||"")}"></label>`;
  if(S.vencOmit[clave] && !valor) return `<div class="vencCampo omitido"><span>Sin vencimiento</span><button type="button" class="vencOmitir" data-venc-cargar="${clave}">Cargar fecha</button></div>`;
  if(valor) return `<div class="vencCampo"><div class="vencHead"><span>Vencimiento: ${fechaVencCorta(valor)}</span><button type="button" class="vencOmitir" data-venc-omitir="${clave}">Quitar fecha</button></div><input type="date" ${attr}="${id}" value="${esc(valor)}"></div>`;
  return `<div class="vencCampo"><div class="vencHead"><span>Vencimiento · opcional</span><button type="button" class="vencOmitir" data-venc-omitir="${clave}">Omitir</button></div><span class="vencHint">Si no lo sabés, tocá Omitir y seguí con el siguiente.</span><input type="date" ${attr}="${id}"></div>`;
}
/** Al tipear la cantidad de chocolatería, el campo de vencimiento aparece (o se
 *  quita) en el momento, sin esperar a Guardar. Se agrega al DOM del renglón en
 *  vez de rehacer la lista, así no se pierde el foco mientras se escribe. */
function mostrarVencRenglon(input, id, prefijo, attr, cantidad){
  if(!esChocolateria(id)) return;
  const nm=input.closest(".row").querySelector(".nm");
  const visible=nm.querySelector(".vencCampo");
  if(cantidad>0 && !visible) nm.insertAdjacentHTML("beforeend", vencCampoHTML(id, prefijo==="ing:"?S.vencimientos[id]:S.vencConteo[id], prefijo, attr));
  else if(cantidad<=0 && visible) visible.remove();
}
function fechaVencCorta(iso){ const [y,m,d]=String(iso).split("-"); return y&&m&&d ? `${d}/${m}/${y}` : "" }
document.addEventListener("change", (e)=>{
  const idConteo=e.target && e.target.dataset && e.target.dataset.vencConteo;
  if(idConteo){
    if(e.target.value) S.vencConteo[idConteo]=e.target.value; else delete S.vencConteo[idConteo];
    const campo=e.target.closest(".vencCampo");
    if(campo) campo.classList.toggle("falta", !e.target.value && requiereVencimiento(idConteo));
    renderBar();
    return;
  }
  const idCant=e.target && e.target.dataset && e.target.dataset.cantInput;
  if(idCant){
    const n=Math.max(0, Math.floor(+e.target.value||0));
    if(n) S.cart.ingreso[idCant]=n; else delete S.cart.ingreso[idCant];
    renderApp();
    return;
  }
  const id=e.target && e.target.dataset && e.target.dataset.venc;
  if(!id) return;
  if(e.target.value) S.vencimientos[id]=e.target.value; else delete S.vencimientos[id];
  const campo=e.target.closest(".vencCampo");
  if(campo) campo.classList.toggle("falta", !e.target.value);
  renderBar();
});
function registrarActividad(){ if(S.empleado && !S.bloqueado) reiniciarInactividad() }
["click","input","touchstart","keydown","wheel","pointermove"].forEach(ev=>document.addEventListener(ev, registrarActividad, {passive:true}));

      <video src="media/promo-minion-icepop.mp4" autoplay muted loop playsinline disablepictureinpicture disableremoteplayback style="width:100%;display:block;background:#000;pointer-events:none"></video>

    return `<div class="note">Cargando datos de ${esc(S.local)}…</div>`;
  }
  const st=stockMap();
  let h="";
  if(S.tab==="salida") h=gridSalida(st);
  else if(S.tab==="ingreso") h = S.modoProduccion ? gridProduccion(st) : S.modoDevolucion ? gridDevolucion(st) : gridIngreso(st);

  else if(S.tab==="equipo") h=teamView();

const CATEGORIA_COLOR = { "Chocolates":"#5C3A25", "Cremas":"#C9A46B", "Frutales":"#D9546B", "Dulces de leche":"#B5762E" };
const CATEGORIAS_ORDEN = ["Chocolates","Cremas","Frutales","Dulces de leche","Fruta","Crema","Bañados","Luxury","Cannoli","Mini Icepops","Gluten Free","Alfajores","Conitos","Tabletas","Avella","Latas"];
const FAMILIA_LABEL = { vasquetas:"Vasquetas", icepops:"Icepops", glutenfree:"Gluten Free" };
const FAMILIA_ORDEN = ["vasquetas","icepops","glutenfree"];
function colorCategoria(cat){ return CATEGORIA_COLOR[cat] || "#8A7A6B" }
/** Grupos con al menos un sabor cargado en este local — si solo hay
 *  Vasquetas (todavía no se cargó ningún Balde/Icepop/Gluten Free), no
 *  tiene sentido mostrar las pills, total hay una sola. Usa
 *  grupoProductoDe() (Vasquetas/Baldes/Icepops/Gluten Free, ver sección
 *  SABORES más abajo) en vez de la familia cruda, así Baldes tiene su
 *  propia pill aunque en los datos sea tipo "b" dentro de "vasquetas". */
function familiasPresentes(){
  const set=new Set(saboresDelLocal().map(grupoProductoDe));
  return GRUPO_PRODUCTO_ORDEN.filter(g=>set.has(g));
}
function categoriasPresentes(){
  const grupo=S.filtroFamilia||"vasquetas";
  const set=new Set(saboresDelLocal().filter(s=>grupoProductoDe(s)===grupo).map(s=>s.categoria||"Cremas"));
  return CATEGORIAS_ORDEN.filter(c=>set.has(c)).concat([...set].filter(c=>!CATEGORIAS_ORDEN.includes(c)));
}

/** Filtros de Salida, Ingreso, Stock y Pedido (decidido por Gabi 21/10/2026):
 *  las familias son pestañas con subrayado; tocar la activa despliega sus
 *  subcategorías (Todas + las de la familia), y tocar de nuevo las cierra.
 *  Cerradas, la pestaña muestra la subcategoría elegida ("Vasquetas · Frutales"). */
function chipFiltros(){
  const grupos=familiasPresentes(), grupoActivo=S.filtroFamilia||"vasquetas";
  const cats=categoriasPresentes();
  const subElegida=S.filtroCategoria!=="todas"?S.filtroCategoria:null;
  const etiqueta=g=>{
    if(g!==grupoActivo) return esc(GRUPO_PRODUCTO_LABEL[g]||g);
    const base=esc(GRUPO_PRODUCTO_LABEL[g]||g)+(subElegida&&!S.catAbierta?` · ${esc(subElegida)}`:"");
    return `${base} ${S.catAbierta?"▴":"▾"}`;
  };
  return `<div class="tools">
    <div class="grow"><input type="search" id="q" placeholder="Buscar sabor" value="${esc(S.q)}"></div>
    <button class="chip" id="soloAlerta" aria-pressed="${S.soloAlerta}">Debajo del mínimo</button>
  </div>
  <div class="tabsCat" role="tablist">
    ${grupos.map(g=>`<button type="button" class="tabCat" role="tab" data-familia="${g}" aria-selected="${grupoActivo===g}" aria-expanded="${grupoActivo===g&&S.catAbierta}">${etiqueta(g)}</button>`).join("")}
  </div>
  ${S.catAbierta?`<div class="subCats" role="group" aria-label="Subcategorías">
    <button type="button" class="subCat" data-cat="todas" aria-pressed="${S.filtroCategoria==="todas"}">Todas</button>
    ${cats.map(c=>`<button type="button" class="subCat" data-cat="${esc(c)}" aria-pressed="${S.filtroCategoria===c}">${esc(c)}</button>`).join("")}
  </div>`:""}`;
}
function listaFiltrada(st){
  const q=normalizar(S.q.trim()), grupoActivo=S.filtroFamilia||"vasquetas";
  return saboresDelLocal().filter(s=>grupoProductoDe(s)===grupoActivo&&(!q||normalizar(s.nombre).includes(q))&&(S.filtroCategoria==="todas"||(s.categoria||"Cremas")===S.filtroCategoria)&&(!S.soloAlerta||estadoSabor(s.id,st)));
}

function gridSalida(st){
  if(S.modoDesperdicio) return gridDesperdicio(st);
  const cart=S.cart.salida, emp=S.empleado.nombre;
  const list=listaFiltrada(st);
  const card=s=>{
    const c=cart[s.id]||0, ed=estadoSabor(s.id,st), disponible=st[s.id]||0, agotado=c>=disponible;
    return `<div class="card${c?" sel":""}${agotado?" agotado":""}">
      <button class="pick" data-add="${s.id}" aria-label="${esc(s.nombre)}, sumar una">
        <span class="strip" style="background:${colorCategoria(s.categoria)}"></span>
        <span class="cardTop">${plateHTML(s.id)}<span class="pnombre">${esc(s.nombre)}</span></span>
        ${ed?`<span class="badge ${ed.cls}">${ed.label}</span>`:`<span class="badge" style="visibility:hidden">&nbsp;</span>`}
        <span class="pstock"><b>${st[s.id]}</b><span>${unidad(s.id,st[s.id])}</span></span>
      </button>
      ${c?`<span class="qty">${c}</span><button class="minus" data-sub="${s.id}" aria-label="Restar una">−</button>`:""}</div>`};
  return `<p class="sec">Retira: <b>${esc(emp)}</b></p>
  <button type="button" class="btn desperdicio" id="irDesperdicio" style="margin-bottom:12px">Desperdicio</button>
  ${chipFiltros()}
  <p class="sec" style="margin-top:16px">Tocá un sabor para sumar una unidad</p>
  ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">Ningún sabor coincide con la búsqueda.</div>`}`;
}
function gridDesperdicio(st){
  const cart=S.cart.desperdicio;
  const list=listaFiltrada(st);
  const card=s=>{
    const c=cart[s.id]||0, ed=estadoSabor(s.id,st), disponible=st[s.id]||0, agotado=c>=disponible;
    return `<div class="card${c?" sel":""}${agotado?" agotado":""}">
      <button class="pick" data-wadd="${s.id}" aria-label="${esc(s.nombre)}, sumar una">
        <span class="strip" style="background:${colorCategoria(s.categoria)}"></span>
        <span class="cardTop">${plateHTML(s.id)}<span class="pnombre">${esc(s.nombre)}</span></span>
        ${ed?`<span class="badge ${ed.cls}">${ed.label}</span>`:`<span class="badge" style="visibility:hidden">&nbsp;</span>`}
        <span class="pstock"><b>${st[s.id]}</b><span>${unidad(s.id,st[s.id])}</span></span>
      </button>
      ${c?`<span class="qty">${c}</span><button class="minus" data-wsub="${s.id}" aria-label="Restar una">−</button>`:""}</div>`};
  return `<button class="btn volver" type="button" id="volverSalida" style="margin-bottom:12px">Volver a Salida</button>
  <p class="sec" style="margin-top:6px">Desperdicio</p>
  <p style="margin:0 0 10px;color:var(--muted);font-size:.85rem;line-height:1.4">Modo Desperdicio: todo lo que marques acá se descuenta como desperdicio, no como salida de cámara.</p>
  <div class="remitoRow"><label for="motivoDesperdicio" style="font-weight:700">Motivo</label><input type="text" id="motivoDesperdicio" placeholder="Ej: se cayó, se rompió" value="${esc(S.motivoDesperdicio)}"></div>
  ${chipFiltros()}
  <p class="sec" style="margin-top:16px">Tocá un sabor para sumar una unidad</p>
  ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">Ningún sabor coincide con la búsqueda.</div>`}`;
}

/** Agrupa el catálogo para el <select> de "elegí a qué sabor
 *  corresponde" del lector de remitos — antes era una lista plana de
 *  100+ sabores sin ningún orden visual, costaba encontrar el que
 *  corresponde a mano. Vasquetas y Baldes quedan como un grupo cada
 *  uno; Icepops se abre por su propia categoría (Fruta/Luxury/
 *  Cannoli/Crema/Bañados/Mini Icepops) porque ahí solo sí son
 *  demasiados sabores como para dejarlos juntos. */
const ICEPOP_CATEGORIAS = ["Fruta","Crema","Bañados","Luxury","Cannoli","Mini Icepops"];
function gruposParaSelectSabor(){
  const porClave={};
  S.sabores.forEach(s=>{
    const g=grupoProductoDe(s);
    const clave = g==="icepops" ? (s.categoria||"Icepops") : GRUPO_PRODUCTO_LABEL[g];
    (porClave[clave]=porClave[clave]||[]).push(s);
  });
  const orden=["Vasquetas","Baldes",...ICEPOP_CATEGORIAS,"Gluten Free"];
  return orden.filter(k=>porClave[k]).map(k=>({label:k, sabores:porClave[k]}));
}
function lectorRemitoView(){
  const lr=S.lectorRemito;
  if(lr.paso==="leyendo"){
    return `<p class="sec">Leer remito</p>
    <div class="photoStage">
      <img src="${lr.fotoDataUrl}" alt="Foto del remito">
      <div class="scanline"></div>
      <div class="scanOverlay"><b>Leyendo la página ${lr.paginasLeidas+1}…</b><span>Separando sabores y cantidades…</span></div>
    </div>`;
  }
  if(lr.paso==="error"){
    return `<p class="sec">Leer remito</p>
    <div class="empty">${esc(lr.error)}</div>
    <div style="display:flex;gap:10px;margin-top:10px">
      ${lr.paginasLeidas>0?`<button class="btn ghost" type="button" id="remitoVolverRevision">Volver a lo ya leído</button>`:""}
      <button class="btn ${lr.paginasLeidas>0?"":"ghost"}" type="button" id="remitoCancelar">${lr.paginasLeidas>0?"Cancelar todo":"Volver"}</button>
    </div>`;
  }
  if(lr.items.length===0){
    return `<p class="sec">Leer remito</p>
    <div class="empty">No encontramos renglones de Vasquetas, Icepops, Sin Gluten o Cannolis en esta foto${lr.remitos.length?` (remito N° ${esc(lr.remitos.join(" + "))})`:""}. Si esos productos están en otra página del remito, sacale una foto a esa página.</div>
    <button class="btn ghost" type="button" id="remitoCancelar" style="margin-top:10px">Volver</button>`;
  }
  const total=lr.items.reduce((a,it)=>a+(it.ignorar?0:(it.cantidad||0)),0);
  const sinResolver=lr.items.filter(it=>!it.saborId && !it.ignorar).length;
  const fila=(it,i)=>{
    const flag=!it.saborId && !it.ignorar;
    const dudoso=it.saborId && it.confianza==="media" && !it.ignorar;
    return `<div class="row${flag?" flag":""}">
      ${it.saborId?plateHTML(it.saborId):`<span class="plate" style="display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--warn);font-weight:800">?</span>`}
      <div class="nm"><b>${esc(it.saborId?it.nombreSabor:it.nombreDetectado)}</b>${flag?`<div class="meta">Detectado como "${esc(it.nombreDetectado)}" — no está en tu catálogo. ${it.bultos} bulto${it.bultos===1?"":"s"} en el remito — elegí el sabor para calcular la cantidad real, o cargala a mano.</div>`:it.ignorar?`<div class="meta">Se va a ignorar</div>`:dudoso?`<div class="meta">Lo matcheamos por parecido con "${esc(it.nombreDetectado)}" — revisá que sea el sabor correcto.</div>`:""}</div>
      <div class="right"><input type="number" min="0" data-remito-qty="${i}" value="${it.cantidad}" ${it.ignorar?"disabled":""}></div>
      ${flag||it.ignorar||dudoso?`<div class="flagPick"><select data-remito-elegir="${i}">
        <option value="" ${!it.saborId&&!it.ignorar?"selected":""}>Elegí a qué sabor corresponde…</option>
        ${gruposParaSelectSabor().map(g=>`<optgroup label="${esc(g.label)}">${g.sabores.map(s=>`<option value="${s.id}" ${it.saborId===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}</optgroup>`).join("")}
        <option value="ignorar" ${it.ignorar?"selected":""}>Ignorar este renglón</option>
      </select></div>`:""}
    </div>`;
  };
  // Agrupa los renglones por tipo de producto para la revisión — Gabi
  // pidió esto porque Baldes reusa el mismo nombre y la misma foto que
  // la vasqueta equivalente (ej. "Limón" existe como las dos cosas), así
  // que en una lista plana no hay forma de distinguir cuál es cuál de
  // un vistazo. El orden de lectura del remito NO se pierde: dentro de
  // cada grupo los renglones quedan en el mismo orden en que la IA los
  // detectó (se agrupa por índice, no se reordena el array).
  const grupoDeItem=(it)=>{
    const sabor=it.saborId?S.saboresPorId[it.saborId]:null;
    if(!sabor) return "Sin identificar";
    const g=grupoProductoDe(sabor);
    return g==="icepops" ? (sabor.categoria||"Icepops") : GRUPO_PRODUCTO_LABEL[g];
  };
  const ORDEN_GRUPOS_REMITO=["Sin identificar","Vasquetas","Baldes",...ICEPOP_CATEGORIAS,"Gluten Free"];
  const porGrupoItems={};
  lr.items.forEach((it,i)=>{ const g=grupoDeItem(it); (porGrupoItems[g]=porGrupoItems[g]||[]).push(i) });
  const gruposItems=ORDEN_GRUPOS_REMITO.filter(g=>porGrupoItems[g]).map(g=>({label:g, indices:porGrupoItems[g]}));
  // Vasquetas y Baldes: el recuadro "Bultos:" de la fábrica siempre
  // cerró bien contra estas dos familias, así que acá sí vale la pena
  // comparar y avisar.
  const cmpFila=(label,leido,decl)=>{
    if(decl===null||decl===undefined) return "";
    if(leido===decl) return `<div style="color:var(--ok);font-weight:700">${label}: ${leido} leídos ✓ (declarado ${decl})</div>`;
    if(leido>decl) return `<div style="color:var(--alert);font-weight:700">${label}: ${leido} leídos — más que los ${decl} declarados, revisá si repetiste una página</div>`;
    return `<div style="color:var(--muted);font-weight:700">${label}: ${leido} leídos de ${decl} declarados</div>`;
  };
  // Palitos (Icepops/Sin Gluten/Cannolis): un remito real nos enseñó que
  // ahí el recuadro "Bultos:" de la fábrica no siempre cierra con la suma
  // real de los renglones (parece contar las cajas distinto para ese
  // resumen), aunque la lectura esté perfecta — comparar contra ese
  // declarado generaba falsas alarmas. Acá mostramos solo lo detectado,
  // sin compararlo contra nada; el control real de un renglón puntual mal
  // leído sigue siendo el amarillo "?" / "revisá que sea el sabor
  // correcto" de cada fila, más abajo.
  const vasquetasLinea = lr.bultosDeclaradosSabores!=null ? cmpFila("Vasquetas",lr.bultosLeidosSabores,lr.bultosDeclaradosSabores) : "";
  const baldesLinea = lr.bultosDeclaradosBaldes!=null ? cmpFila("Baldes",lr.bultosLeidosBaldes,lr.bultosDeclaradosBaldes) : "";
  const palitosLinea = lr.bultosLeidosPalitos>0 ? `<div style="color:var(--muted);font-weight:700">Palitos: ${lr.bultosLeidosPalitos} cajas detectadas</div>` : "";
  const bultosCmp = (vasquetasLinea||baldesLinea||palitosLinea) ? `<div class="note">${vasquetasLinea}${baldesLinea}${palitosLinea}</div>` : "";
  const paginasTxt = lr.paginasLeidas===1?"1 página cargada":`${lr.paginasLeidas} páginas cargadas`;
  return `<p class="sec">Detectado en el remito</p>
  <div class="remitoResumen">${paginasTxt} · ${lr.items.length} renglones, ${total} unidades en total.${sinResolver?` ${sinResolver} sin resolver — elegí el sabor o ignorá el renglón antes de cargar.`:""}</div>
  ${lr.remitos.length?`<p class="lede" style="margin:8px 0 0;color:var(--muted)">N° de remito detectado: <b style="color:var(--ink)">${esc(lr.remitos.join(" + "))}</b></p>`:""}
  ${bultosCmp}
  ${gruposItems.map(g=>`<p class="sec" style="margin-top:14px">${esc(g.label)}${g.label==="Sin identificar"?` (${g.indices.length})`:""}</p><div class="rows">${g.indices.map(i=>fila(lr.items[i],i)).join("")}</div>`).join("")}
  <input type="file" accept="image/*" id="inputRemitoFoto" style="display:none">
  <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
    <button class="btn ghost" type="button" id="remitoCancelar">Cancelar</button>
    <button class="btn ghost" type="button" id="remitoAgregarPagina">+ Agregar otra página</button>
    <button class="btn" type="button" id="remitoCargar" ${sinResolver?"disabled":""} style="flex:1">Cargar al carrito de ingreso</button>
  </div>`;
}
async function leerRemitoFoto(base64, mime){
  const r = await api("leerRemito", {foto:base64, mime, local:S.local}, 60000);
  const lr=S.lectorRemito;
  if(r && r.ok){
    lr.items = lr.items.concat(r.items);
    lr.paginasLeidas += 1;
    lr.bultosLeidosSabores += (r.bultosLeidosSabores||0);
    lr.bultosLeidosBaldes += (r.bultosLeidosBaldes||0);
    lr.bultosLeidosPalitos += (r.bultosLeidosPalitos||0);
    if(lr.bultosDeclaradosSabores==null && r.bultosDeclaradosSabores!=null) lr.bultosDeclaradosSabores=r.bultosDeclaradosSabores;
    if(lr.bultosDeclaradosBaldes==null && r.bultosDeclaradosBaldes!=null) lr.bultosDeclaradosBaldes=r.bultosDeclaradosBaldes;
    if(r.remitoDetectado && lr.remitos.indexOf(r.remitoDetectado)===-1) lr.remitos.push(r.remitoDetectado);
    if(r.fotoUrl) lr.fotoUrls.push(r.fotoUrl);
    lr.paso="revision";
  } else {
    lr.paso="error";
    lr.error=(r&&r.error)||"No se pudo leer el remito. Probá de nuevo.";
  }
  renderApp();
}

function stockView(st){

    const ed=estadoSabor(s.id,st);

      <div class="big${ed?" "+(ed.tier==="critico"||ed.tier==="sinstock"?"crit":"low"):""}">${st[s.id]}</div>

  </div>

    <span class="tx"><b>Pedido sugerido</b><span>${al.length} ${al.length===1?"sabor bajo":"sabores bajos"} · ${pedidoTotal} ${pedidoTotal===1?"unidad":"unidades"}</span></span>

  </button>`:""}
  <div class="tools" style="margin-top:16px">
    <span class="grow" style="color:var(--muted);font-size:.85rem">${last?`Último conteo: ${last}${S.stock.empleado?" · "+esc(S.stock.empleado):""}`:"Sin conteo todavía"}</span>

  </div>

  const filas=S.sabores.filter(s=>grupoProductoDe(s)===grupoActivo).map(s=>{

function puedeAnular(r){
  if(r.anulado) return false;
  const rol=S.empleado.rol, edad=Date.now()-r.ts;
  if(rol==="admin"||rol==="supervisor") return true;
  if(rol==="encargado"||rol==="turno"||rol==="produccion") return edad<=24*3600*1000;
  if(rol==="colaborador") return String(r.empleadoId)===String(S.empleado.id) && edad<=10*60*1000;
  return false;
}
const CATEGORIAS_HIST = [["todas","Todas"],["vasquetas","Vasquetas"],["icepops","Icepops"],["chocolateria","Chocolatería"],["desperdicio","Desperdicio"],["produccion","Producción"]];
const RANGOS_HIST = [["s0","Esta semana"],["s1","Semana pasada"],["s2","Hace 2 semanas"],["s3","Hace 3 semanas"],["m0","Este mes"],["m1","Mes pasado"]];
/** Info del rango elegido en Historial: una semana calendario (lunes a
 *  domingo, igual que antes) o — nuevo — un mes calendario completo. Los
 *  60 días que trae el backend (DIAS_HISTORIAL) alcanzan siempre para
 *  "semana" y casi siempre para "mes": el único borde conocido es mirar
 *  "Mes pasado" el día 29-31 de enero o agosto (los únicos meses de 31
 *  días precedidos por otro de 31) — ahí pueden faltar los primeros 1-2
 *  días de diciembre/julio. Caso raro, no bloquea, se documenta en
 *  CLAUDE.md. */
/** Fechas del calendario de Historial: "YYYY-MM-DD" en hora local. */
function isoALocal(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).getTime() }
function isoDeFecha(f){ return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}-${String(f.getDate()).padStart(2,"0")}` }
/** El backend trae 60 días contando hoy: el calendario no deja elegir más atrás. */
const CAL_DIAS_ATRAS = 59;
function rangoHistInfo(id){
  if(id.charAt(0)==="d"){
    // Últimos N días contando hoy: Hoy = d1, 7 días = d7, 30 días = d30, Todo = d60
    const n=+id.slice(1), hoy=new Date(); hoy.setHours(0,0,0,0);
    const inicio=hoy.getTime()-(n-1)*864e5, fin=Date.now()+1;
    const f=ms=>new Date(ms).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
    const label = n===1 ? f(inicio) : `${new Date(inicio).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})} al ${f(fin-1)}`;
    return { tipo:"rango", inicio, fin, label };
  }
  if(id.charAt(0)==="c"){
    const [d,h]=id.slice(1).split("|"), inicio=isoALocal(d), fin=isoALocal(h)+864e5;
    const corto=ms=>new Date(ms).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
    return { tipo:"rango", inicio, fin, label:`${corto(inicio)} al ${new Date(isoALocal(h)).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}` };
  }
  if(id.charAt(0)==="s"){
    const n=+id.slice(1), inicio=lunesDe()-n*7*864e5, fin=inicio+7*864e5;
    return { tipo:"semana", inicio, fin,
      label:`${new Date(inicio).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})} al ${new Date(fin-864e5).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})}` };
  }
  const n=+id.slice(1), ahora=new Date(), anio=ahora.getFullYear(), mes=ahora.getMonth()-n;
  const inicio=new Date(anio,mes,1).getTime(), fin=new Date(anio,mes+1,1).getTime();
  const label=new Date(inicio).toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  return { tipo:"mes", inicio, fin, label: label.charAt(0).toUpperCase()+label.slice(1) };
}
/** La pill "Vasquetas" agrupa también Baldes y Gluten Free: esas familias
 *  no se pisan nombres entre sí en la práctica — la confusión real que
 *  reportó Gabi era solo contra Icepops (ej. "Frutilla" existe en vasqueta
 *  Y en Icepop). Si algún día hace falta separarlas más fino, se agrega
 *  otra pill — por ahora, menos pills es mejor (pedido explícito de Gabi). */
function grupoHistDe(id){ const s=S.saboresPorId[id]; const g=s?grupoProductoDe(s):"vasquetas"; return g==="icepops"||g==="chocolateria" ? g : "vasquetas"; }
/** Una fila de la lista de "Movimientos" — compartida entre el Historial
 *  completo (Encargado/Turno/Supervisor/Admin/Producción) y el Historial
 *  simplificado de Colaborador. */
/** Un registro "pendiente-<clienteId>" es el que agregarRegistroOptimista()
 *  empujó mientras no había señal — todavía no lo confirmó el servidor, así
 *  que no tiene un id real para anular/eliminar (y desaparece solo, sin
 *  avisar, apenas se sincronice de verdad). */
function esPendienteSync(r){ return String(r.id||"").indexOf("pendiente-")===0 }
function filaMovimiento(r){
  const it=Object.entries(r.items||{}).filter(([,q])=>q).map(([id,q])=>{
    if(r.tipo==="conteo") return `${esc(nombre(id))}: ${q}`;
    const kg=r.subtipo==="produccion"&&r.kilos&&r.kilos[id];
    const vto=r.vencimientos&&r.vencimientos[id]?` · vence ${fechaVencCorta(r.vencimientos[id])}`:"";
    return `${esc(nombre(id))} ×${q}${kg?` (${Number(kg).toLocaleString("es-AR",{maximumFractionDigits:1})} kg)`:""}${vto}`;
  }).join(" · ");
  const claseTipo=r.subtipo==="devolucion"?"devolucion":r.subtipo==="desperdicio"?"desperdicio":r.subtipo==="produccion"?"produccion":r.tipo;
  const labelTipo=r.subtipo==="devolucion"?"devolución":r.subtipo==="desperdicio"?"desperdicio":r.subtipo==="produccion"?"producción":r.tipo;
  return `<div class="h${r.anulado?" anulado":""}"><div class="top"><span class="pill ${claseTipo}">${labelTipo}</span>
    <span class="who">${esc(r.empleado||"Sin nombre")}</span><span>${r.total||""} u.${r.remito?" · Remito "+esc(r.remito):""}${r.subtipo==="desperdicio"&&r.motivo&&!r.anulado?" · "+esc(r.motivo):""}</span>
    <time>${new Date(r.ts).toLocaleString("es-AR",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}</time></div>
    ${r.tipo==="conteo"?`<div class="items">Conteo físico de ${Object.keys(r.items||{}).length} sabores</div><div class="meta" style="color:var(--muted);font-size:.72rem;margin-top:2px">Un Conteo fija el stock directo — anularlo NO lo revierte. Para corregir números mal cargados, hacé un Conteo físico nuevo.</div>`:`<div class="items">${it}</div>`}
    ${esPendienteSync(r)?`<div class="pendienteTag">Pendiente de enviar — sin conexión. Se va a mandar solo apenas vuelva la señal.</div>`:r.anulado?`<div class="anulTag">Anulado por ${esc(r.anulado_por)}${r.motivo?": "+esc(r.motivo):""}</div>`:puedeAnular(r)?`<button type="button" class="anularBtn" data-anular="${r.id}">Anular</button>`:""}
    ${!esPendienteSync(r)&&S.empleado.rol==="admin"?`<button type="button" class="anularBtn" style="color:var(--alert);border-color:var(--alert)" data-eliminar-reg="${r.id}" data-tipo-reg="${r.tipo}">Eliminar</button>`:""}
    </div>`;
}
/** Historial del Colaborador (decidido por Gabi 14/10/2026: "que no estén
 *  tocando todo... se empiezan a jugar y hacen lío") — nada de pills de

/** Calendario del período de Historial: un toque elige un día, dos toques
 *  eligen el rango entre ambos (pedido de Gabi 20/10/2026). */
function calendarioHist(){
  const c=S.calHist, anio=c.mes.getFullYear(), m=c.mes.getMonth();
  const offset=(new Date(anio,m,1).getDay()+6)%7, dias=new Date(anio,m+1,0).getDate();
  const hoy=isoDeFecha(new Date()), minimo=isoDeFecha(new Date(Date.now()-CAL_DIAS_ATRAS*864e5));
  const titulo=c.mes.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  const celdas=[...Array(offset).fill(0), ...Array.from({length:dias},(_,i)=>i+1)].map(n=>{
    if(!n) return `<span></span>`;
    const iso=`${anio}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;
    const sel=iso===c.d||iso===c.h, enRango=!!(c.d&&c.h&&iso>c.d&&iso<c.h);
    return `<button type="button" class="calDia${sel?" sel":""}${enRango?" rango":""}${iso===hoy?" hoy":""}" data-cal-dia="${iso}" ${iso>hoy||iso<minimo?"disabled":""} aria-pressed="${sel}">${n}</button>`;
  }).join("");
  const fmt=iso=>iso?new Date(isoALocal(iso)).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}):"—";
  return `<div class="calCard noPrint">
    <div class="calHead"><button type="button" class="calNav" data-cal-mes="-1" aria-label="Mes anterior">‹</button><span class="calTitulo">${esc(titulo.charAt(0).toUpperCase()+titulo.slice(1))}</span><button type="button" class="calNav" data-cal-mes="1" aria-label="Mes siguiente">›</button></div>
    <div class="calGrid calSem"><span>LU</span><span>MA</span><span>MI</span><span>JU</span><span>VI</span><span>SÁ</span><span>DO</span></div>
    <div class="calGrid">${celdas}</div>
    <div class="calHint">Tocá un día para elegir ese día, o dos para elegir el rango entre ellos.</div>
    <div class="calRes"><span><b>Desde</b> ${fmt(c.d)}</span><span><b>Hasta</b> ${fmt(c.h||c.d)}</span></div>
    <div class="calBotones"><button type="button" class="btn ghost" id="calCancelar">Cancelar</button><button type="button" class="btn" id="calAplicar" ${c.d?"":"disabled"}>Aplicar</button></div>
  </div>`;
}

        </tbody></table></div>`;
    }
  }

  // La lista de abajo sigue a la pill de categoría igual que la tabla de arriba
  const regsCategoria=regs.filter(r=>movimientoEnCategoria(r, S.categoriaHist));
  const lista=regsCategoria.slice(0,150).map(filaMovimiento).join("");

  <div class="noPrint">${lista?`<div class="hist">${lista}</div>`:`<div class="empty">${S.categoriaHist==="todas"?"Sin movimientos en este período.":"Sin movimientos de esta categoría en este período."}</div>`}</div>`;
}
/** Qué movimientos muestra cada pill de categoría en la lista de abajo.
 *  Mismo criterio que la tabla de arriba: Vasquetas/Icepops son salidas
 *  (sin desperdicio) con algún sabor de ese grupo; si una salida mezcla
 *  los dos, aparece entera en ambos filtros. Chocolatería suma ingresos. */
function movimientoEnCategoria(r, cat){
  if(cat==="todas") return true;
  if(cat==="desperdicio") return r.tipo==="salida" && r.subtipo==="desperdicio";
  if(cat==="produccion") return r.subtipo==="produccion";
  // Chocolatería: también los ingresos, porque ahí es donde se carga el vencimiento
  if(cat==="chocolateria") return (r.tipo==="ingreso" && !r.subtipo || r.tipo==="salida" && r.subtipo!=="desperdicio") && Object.keys(r.items||{}).some(id=>grupoHistDe(id)===cat);
  return r.tipo==="salida" && r.subtipo!=="desperdicio" && Object.keys(r.items||{}).some(id=>grupoHistDe(id)===cat);
}

function _equipoCacheKey(local){ return "equipoCache_"+local }
async function cargarEquipo(){
  const local = S.local;
  // Pintamos al toque con el último equipo que vimos de este local (si lo hay)
  // mientras se refresca en segundo plano, mismo criterio que ya usamos en
  // el login: no confundir "no llegó respuesta" con "no hay nadie cargado".
  if(S.equipo===null){
    try{
      const c = ls.get(_equipoCacheKey(local), "");
      if(c){ S.equipo = JSON.parse(c); S.errorEquipo = null; if(S.tab==="equipo") renderApp(); }
    }catch(e){}
  }
  const r = await api("empleadosAdmin", {local});
  if(S.local!==local) return; // se cambió de local mientras esperábamos
  if(r && r.ok){
    S.equipo = r.empleados; S.errorEquipo = null;
    try{ ls.set(_equipoCacheKey(local), JSON.stringify(r.empleados)); }catch(e){}
  } else if(!S.equipo || !S.equipo.length){
    S.equipo = []; S.errorEquipo = (r&&r.error) || "No se pudo conectar. Probá de nuevo.";
  }
  if(S.tab==="equipo") renderApp();
}
