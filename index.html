<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LogiStock Lucciano's</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#5E7A3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LogiStock Lucciano's">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F5F0E8; --surface:#ffffff; --ink:#2A1E17; --muted:#6B5D52; --line:#E6DDD0;
  --accent:#7A3E1D; --accent-hover:#5A2B12; --accent-ink:#ffffff; --accent-soft:#F1E4D6;
  --alert:#8A1F11; --alert-soft:#F6D5CF; --warn:#6B3F00; --warn-soft:#FBE7C6;
  --ok:#24461A; --ok-soft:#E3EEDC; --plate:#ffffff;
  --header-bg:#2A1E17; --header-bg-rgb:42,30,23; --header-ink:#F5F0E8; --header-muted:#D9CBB8; --header-chip:#3D2C22;
  --surface-rgb:255,255,255; --glass-line:rgba(255,255,255,.14);
  --wa:#1E6B45; --wa-bubble:#DCF3D0; --wa-bubble-ink:#1F2A1A; --wa-panel:#ECE5DD;
  --display:"Fraunces","Georgia",serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* Tema crema siempre, sin importar el modo del sistema — a Gabi no le
   gustaba que la app se pusiera oscura sola en dispositivos con modo
   oscuro activado. El tema oscuro queda armado para uso manual futuro
   (ej. un botón de "modo oscuro"), vía data-theme="dark" explícito. */
:root[data-theme="dark"]{
  --bg:#1B1611; --surface:#241D17; --ink:#F2EAE1; --muted:#B3A395; --line:#3A2F26;
  --accent:#D9925A; --accent-hover:#E8A671; --accent-ink:#1B1611; --accent-soft:#3A2A1E;
  --alert:#F0968A; --alert-soft:#3D211C; --warn:#E0B266; --warn-soft:#3A2C15;
  --ok:#8FCB9E; --ok-soft:#1B3220; --plate:#F2EAE1;
  --wa-bubble:#204030; --wa-bubble-ink:#DCF3D0; --wa-panel:#182721;
  --surface-rgb:36,29,23; --glass-line:rgba(255,255,255,.08); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 140px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 40%),rgba(var(--header-bg-rgb),.62);backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);color:var(--header-ink);padding-block:14px 0;border-bottom:1px solid rgba(255,255,255,.16);box-shadow:0 8px 32px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-inline:16px;max-width:980px;margin:0 auto}
.brand .tit{display:flex;flex-direction:column;gap:1px}
h1{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--header-muted);letter-spacing:.04em}
.localSel{display:flex;align-items:center;gap:8px;color:var(--header-ink)}
.localSel input{width:170px}
.localSel label{font-size:.72rem;color:var(--header-muted);text-transform:uppercase;letter-spacing:.06em}
.localFija{font-weight:700}
select,input[type=text],input[type=search],input[type=number],input[type=tel]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
select{max-width:220px}
.userChip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-line);border-radius:999px;padding:5px 6px 5px 14px;font-size:.82rem}
.userChip button{min-height:32px;padding:0 14px;border-radius:999px;border:0;background:var(--bg);color:var(--ink);font-weight:700;font-size:.78rem}
.userChip #editarNombre{padding:0;width:32px;font-size:.95rem;background:transparent;color:var(--header-ink)}
.alertPill{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(251,231,198,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(251,231,198,.28);color:#F2C879;font-size:.82rem;font-weight:700}
.bottomNav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9;
  display:flex;gap:2px;padding:6px;max-width:820px;margin-inline:auto;border-radius:26px;
  background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 40%),rgba(var(--header-bg-rgb),.78);
  backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bottomNav button{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:58px;border:0;border-radius:20px;background:transparent;color:var(--header-muted);font-size:.66rem;font-weight:700;transition:background .15s,color .15s}
.bottomNav button svg{width:22px;height:22px;flex:none}
.bottomNav button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bottomNav button[aria-selected=true]{background:rgba(255,255,255,.14);color:var(--header-ink)}
.bottomNav .n{position:absolute;top:4px;right:18%;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--alert);color:#fff;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.bottomNav[hidden]{display:none}
.alertBar{margin-top:14px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alertBar span{font-weight:500;color:var(--ink)}
.note{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.tools .grow{flex:1 1 180px}
.tools input{width:100%}
.chip{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;font-weight:700;font-size:.85rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.emp{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.emp label{font-weight:700}
.emp input{flex:1 1 200px}
.emp.missing input{border-color:var(--alert);background:var(--alert-soft)}
.sec{font-family:var(--display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{position:relative}
.card>.pick{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 0 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;overflow:hidden;transition:transform .08s,border-color .15s}
.card>.pick:active{transform:scale(.97)}
.card.sel>.pick{border-color:var(--accent);border-width:2.5px}
.strip{display:block;width:100%;height:7px}
.plate{width:44px;height:44px;flex:none;border-radius:999px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.cardTop{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 13px 0;width:100%}
.pnombre{font-weight:700;font-size:.88rem;line-height:1.2;height:2.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pstock{padding:0 13px;margin-top:auto;display:flex;align-items:baseline;gap:5px}
.pstock b{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1}
.pstock span{font-size:.72rem;color:var(--muted)}
.badge{margin:0 13px;padding:2px 9px;border-radius:999px;font-size:.68rem;font-weight:800;align-self:flex-start}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.alert{background:var(--alert-soft);color:var(--alert)}
.qty{position:absolute;top:10px;right:8px;min-width:34px;height:34px;border-radius:17px;background:var(--accent);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0 8px;pointer-events:none}
.minus{position:absolute;top:10px;left:8px;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem;line-height:1}
.card.sel .strip{filter:brightness(0.85)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:linear-gradient(345deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 40%),rgba(var(--surface-rgb),.6);backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 rgba(255,255,255,.3),0 -8px 32px rgba(0,0,0,.28)}
.bar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .sum{flex:1 1 200px;min-width:0;font-size:.88rem;color:var(--muted)}
.bar .sum b{color:var(--ink)}
.btn{min-height:46px;border:0;border-radius:12px;padding:0 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wa{background:var(--wa);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.warn{color:var(--alert);font-weight:600}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .plate{width:38px;height:38px}
.row .nm{font-weight:700;min-width:0}
.row .meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.row .right{display:flex;align-items:center;gap:8px}
.row input[type=number]{width:70px;text-align:right;font-variant-numeric:tabular-nums}
.saborRow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.rows .saborRow:first-child{border-top:0}
.saborRow .plate{width:38px;height:38px}
.saborRow .nm{font-weight:700;min-width:0}
.saborRow .meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.saborRow.baja{opacity:.55}
.saborForm{background:var(--accent-soft)}
.saborForm input,.saborForm select{min-height:38px;border-radius:9px;border:1px solid var(--line);padding:0 10px;background:var(--surface);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem}
.stepper .n{width:32px;text-align:center;font-family:var(--display);font-size:1.15rem;font-weight:700}
.big{font-family:var(--display);font-weight:700;font-size:1.3rem;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.big.low{color:var(--warn)}
.big.crit{color:var(--alert)}
.pill{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:6px}
.pill.salida{background:var(--accent-soft);color:var(--accent)}
.pill.ingreso{background:var(--ok-soft);color:var(--ok)}
.pill.conteo{background:var(--line);color:var(--ink)}
.pill.devolucion{background:var(--warn-soft);color:var(--warn)}
.hist{display:flex;flex-direction:column;gap:8px}
.h{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.h.anulado{opacity:.55}
.h .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.h .top .who{font-weight:700}
.h .top time{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.h .items{margin-top:4px;font-size:.85rem;color:var(--muted)}
.h .anulTag{margin-top:4px;font-size:.78rem;color:var(--alert);font-weight:700}
.h .anularBtn{margin-top:6px;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.75rem;font-weight:700;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.totalFila td{border-top:2px solid var(--ink);border-bottom:none;background:var(--bg)}
.totalFila td:first-child{background:var(--bg)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1}
.kpi .val.crit{color:var(--alert)}
.kpi .sub{font-size:.78rem;color:var(--muted)}
.diasChips{display:flex;gap:6px;flex-wrap:wrap}
.waPanel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.waBubbleBox{max-height:280px;overflow:auto;padding:16px;border-radius:14px;background:var(--wa-panel)}
.waBubble{padding:12px 14px;border-radius:12px 12px 4px 12px;background:var(--wa-bubble);color:var(--wa-bubble-ink);font-size:.88rem;line-height:1.55;white-space:pre-line}
.waActions{display:flex;gap:10px;flex-wrap:wrap}
.avisoActualizacion{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:900;
  display:flex;align-items:center;gap:14px;max-width:calc(100vw - 28px);padding:12px 16px;
  background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:.85rem}
@media (min-width:900px){.avisoActualizacion{bottom:24px}}
.remitoRow{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.remitoRow input{flex:1 1 220px}
/* --- lector de remitos --- */
.photoStage{position:relative;border-radius:16px;overflow:hidden;margin-top:14px;background:#000;max-height:50vh;aspect-ratio:3/4}
.photoStage img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent) 20%,#fff 50%,var(--accent) 80%,transparent);box-shadow:0 0 16px 4px var(--accent);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%{top:4%}50%{top:94%}100%{top:4%}}
.scanOverlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:22px;gap:6px;text-align:center}
.scanOverlay b{color:#fff;font-family:var(--display);font-size:1.1rem}
.scanOverlay span{color:rgba(255,255,255,.78);font-size:.8rem}
.row.flag{background:var(--warn-soft);border-radius:12px;padding:8px 10px;margin:4px 0}
.row.flag .meta{color:var(--warn);font-weight:600}
.flagPick{grid-column:1/-1;margin-top:8px}
.flagPick select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.remitoResumen{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:11px 13px;font-size:.84rem;font-weight:600;margin-top:12px}
/* --- auth --- */
.authWrap{max-width:460px;margin:36px auto;padding:0 16px}
.authCard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.authCard h1{font-size:1.6rem}
.authCard p{margin:0;color:var(--muted);font-size:.92rem}
.authBack{background:none;border:0;color:var(--muted);font-weight:700;align-self:flex-start;padding:4px 0}
.authList{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%;text-align:left}
.authList button{min-height:88px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.authList button:active{background:var(--accent-soft)}
.ini{width:48px;height:48px;flex-shrink:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:1rem}
.authList .nm{font-weight:700;font-size:.98rem}
.authList .rol{font-size:.76rem;color:var(--muted)}
.dots{display:flex;gap:14px}
.dots span{width:16px;height:16px;border-radius:999px;border:2px solid var(--accent);background:transparent}
.dots span.on{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:320px}
.keypad button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:700}
.keypad button.op{font-size:.85rem}
.selectLocal{width:100%}
.pcLink{background:none;border:0;color:var(--muted);font-size:.82rem;text-decoration:underline;margin-top:6px}
.offlineBadge{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:30;background:var(--warn-soft);color:var(--warn);padding:6px 12px;border-radius:999px;font-size:.72rem;font-weight:700}
.teamRow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--line);flex-wrap:wrap}
.teamRow:first-child{border-top:0}
.teamRow .nm{flex:1 1 160px;font-weight:700}
.teamRow .rol{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.teamRow.baja{opacity:.5}
.teamRow .acciones{display:flex;gap:6px;flex-wrap:wrap}
.teamRow .acciones button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.75rem;font-weight:700}
.altaForm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.altaForm input,.altaForm select{flex:1 1 160px}
@media (prefers-reduced-motion:reduce){.card>.pick{transition:none}}
@media (max-width:640px){.authList{grid-template-columns:1fr 1fr}}
@media (max-width:480px){
  header{padding-block:10px 0}
  .brand{gap:8px}
  h1{font-size:1.18rem}
  h1 small{font-size:.66rem}
  .localSel input{width:130px}
  .userChip{font-size:.76rem;padding:4px 5px 4px 12px}
  .alertPill{font-size:.76rem;padding:6px 11px}
  .authList{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   LogiStock Lucciano's — cliente estático (GitHub Pages)
   Backend: Google Apps Script + Google Sheets (ver apps-script/).
   Pegá acá la URL del deploy (termina en /exec).
============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbw6xlN3nrDdJ4w-kVoNunOKQEE-rHvj515lYWpuEDybrhM1stfZUsaGVZjXc3IgL1oi/exec";

// Versión del FRONTEND (este archivo) — se bumpea en cada cambio de index.html,
// independiente de BACKEND_VERSION (que solo se mueve con cambios en Code.gs).

/* ============================================================
   API — fetch POST text/plain (evita preflight CORS), acción
   despachada por "accion". Mismo patrón que luccianos-academy.
============================================================ */
async function api(accion, payload={}, timeoutMs=30000){
  if(!API_URL || API_URL.indexOf("PEGAR_URL")===0){
    return { ok:false, error:"La app todavía no está conectada. Avisale a Gabi que falta pegar la URL de Apps Script en index.html." };
  }
  for(let intento=0; intento<2; intento++){
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), timeoutMs);
    try{
      const res = await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(Object.assign({accion, token:S.token}, payload)),
        signal: ctrl.signal,
      });
      const data = await res.json();
      S.offline = false;
      if(data && data.backendVersion) S.backendVersion = data.backendVersion;
      if(data && data.sesionInvalida){ cerrarSesion(true); }
      return data;
    }catch(err){
      clearTimeout(t);
      if(intento===0) continue; // primer intento falló (puede ser un cuelgue puntual de Apps Script) — reintentamos una vez antes de avisar
      S.offline = true;
      const esTimeout = err && err.name==="AbortError";
      return { ok:false, error: esTimeout ? "Está tardando más de lo normal. Probá de nuevo." : "Sin conexión.", offline:true };
    }finally{
      clearTimeout(t);
    }
  }
}

/* ============================================================

============================================================ */
function colaGuardar(){ ls.set("cola", JSON.stringify(S.cola)); }
function colaAgregar(accion, payload){
  S.cola.push({ id: payload.clienteId, accion, payload, ts: Date.now() });
  colaGuardar();
}
async function colaFlush(){
  if(!S.cola.length || !S.token) return;
  const pendiente = [...S.cola];
  for(const item of pendiente){
    const r = await api(item.accion, item.payload);
    if(r && r.ok){
      S.cola = S.cola.filter(x=>x.id!==item.id);
      colaGuardar();
    } else if(!r || !r.offline){
      // el backend contestó pero rechazó el movimiento (no es un problema de red): lo sacamos de la cola para no reintentar algo que nunca va a andar
      S.cola = S.cola.filter(x=>x.id!==item.id);
      colaGuardar();
    } else {
      break; // seguimos sin conexión, reintentamos en el próximo ciclo
    }
  }
  await cargarDatos();
}
window.addEventListener("online", colaFlush);

const UNIDAD_LABEL = { b:["balde","baldes"], i:["icepop","icepops"], m:["caja","cajas"], v:["vasqueta","vasquetas"] };
function unidad(id,n){ const l=UNIDAD_LABEL[tipoDe(id)]||UNIDAD_LABEL.v; return n===1?l[0]:l[1] }
const TIPO_LABEL = { v:"Vasqueta", b:"Balde", i:"Icepop", m:"Mini icepops (caja x4)" };

function regsActivos(){ return S.regs.filter(r=>!r.anulado) }

function stockMapHasta(hasta){
  const base=(S.stock&&S.stock.base)||{}, bts=(S.stock&&S.stock.ts)||0, m={};
  S.sabores.forEach(s=>m[s.id]=+base[s.id]||0);
  for(const r of regsActivos()){ if(r.ts<=bts || r.ts>hasta) continue;
    const sg=r.tipo==="ingreso"?1:r.tipo==="salida"?-1:0;
    for(const [id,q] of Object.entries(r.items||{})) if(id in m) m[id]+=sg*(+q||0); }
  return m;
}
function stockMap(){ return stockMapHasta(Date.now()) }
/** Lunes 00:00 de la semana de `ts` (o de ahora si no se pasa nada). */
function lunesDe(ts){
  const d=new Date(ts===undefined?Date.now():ts), dow=(d.getDay()+6)%7;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow).getTime();
}
/** Para cada sabor, consumo y si hubo quiebre de stock en cada una de las
 *  últimas 3 semanas calendario COMPLETAS (lunes a domingo), sin contar la
 *  semana en curso que todavía está a mitad — más vieja primero. Todo se
 *  calcula sobre lo que ya trajo datos() (hasta DIAS_HISTORIAL atrás), sin
 *  pedirle nada nuevo al backend. */
function tendenciaSemanas(){
  const lunesActual=lunesDe();
  const resultado={};
  S.sabores.forEach(s=>resultado[s.id]=[]);
  for(let i=3;i>=1;i--){
    const inicio=lunesActual-i*7*864e5, fin=inicio+7*864e5;
    const stockCorrida=stockMapHasta(inicio-1);
    const totales={}, agotado={};
    const movs=regsActivos().filter(r=>r.ts>=inicio&&r.ts<fin&&(r.tipo==="salida"||r.tipo==="ingreso")).sort((a,b)=>a.ts-b.ts);
    for(const r of movs){
      for(const [id,qRaw] of Object.entries(r.items||{})){
        const q=+qRaw||0; if(!q) continue;
        if(r.tipo==="salida"){ totales[id]=(totales[id]||0)+q; stockCorrida[id]=(stockCorrida[id]||0)-q; if(stockCorrida[id]<=0) agotado[id]=true; }
        else { stockCorrida[id]=(stockCorrida[id]||0)+q; }
      }
    }
    S.sabores.forEach(s=>resultado[s.id].push({total:totales[s.id]||0, agotado:!!agotado[s.id]}));
  }
  return resultado;
}
function salidasDias(dias){
  const since=Date.now()-dias*864e5, m={};
  for(const r of regsActivos()) if(r.tipo==="salida"&&r.ts>=since) for(const [id,q] of Object.entries(r.items||{})) m[id]=(m[id]||0)+(+q||0);
  return m;
}
function inicioDeHoy(){
  const d=new Date();
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
}
/** Por sabor, cuánto sacó hoy esta persona y todavía no devolvió (neto de
 *  las devoluciones de hoy ya guardadas) — es lo que puede devolver ahora
 *  en la pantalla de Devolución. Sabores en 0 no aparecen ahí. */
function pendienteDevolucionHoy(){
  const desde=inicioDeHoy(), sacado={}, devuelto={};
  for(const r of regsActivos()){
    if(r.ts<desde || String(r.empleadoId)!==String(S.empleado.id)) continue;
    if(r.tipo==="salida") for(const [id,q] of Object.entries(r.items||{})) sacado[id]=(sacado[id]||0)+(+q||0);
    else if(r.tipo==="ingreso" && r.subtipo==="devolucion") for(const [id,q] of Object.entries(r.items||{})) devuelto[id]=(devuelto[id]||0)+(+q||0);
  }
  const pendiente={};
  Object.keys(sacado).forEach(id=>{ const p=sacado[id]-(devuelto[id]||0); if(p>0) pendiente[id]=p; });
  return pendiente;
}
function estadoSabor(id, st){
  const n=st[id], min=minimoDe(id);
  if(n<=0) return {tier:"sinstock", label:"Sin stock", cls:"alert"};
  if(n<Math.max(1,Math.round(min/2))) return {tier:"critico", label:"Crítico", cls:"alert"};
  if(n<min) return {tier:"bajo", label:"Stock bajo", cls:"warn"};
  return null;
}
function alertas(st){ return S.sabores.filter(s=>estadoSabor(s.id,st)) }

function pedidoSugerido(id, st){
  const s7=salidasDias(7), promedioDiario=(s7[id]||0)/7;
  let sug=Math.max(0, Math.ceil(promedioDiario*(S.diasEntrega+1) - st[id]));
  sug = Math.ceil(sug/2)*2; // los pedidos a fábrica van de a 2 — no se puede pedir una unidad suelta
  return Math.max(0, sug + (S.pedidoAdj[id]||0));
}

function iniciarAuth(){

let localesFetchPromise = null;
function refrescarLocales(){

async function _refrescarLocales(){
  const r = await api("localesActivos", {});
  if(r && r.ok){
    S.locales = r.locales;
    ls.set("localesCache", JSON.stringify(r.locales));

function cargarLocalesSiFalta(){
  // Pintamos con lo que haya en caché al toque (no bloquea el primer render)
  // y refrescamos en segundo plano — evita que la pantalla de login quede
  // en blanco esperando una ida y vuelta a Apps Script.
  if(!S.locales.length){
    const cache = ls.get("localesCache","");
    if(cache){ try{ S.locales = JSON.parse(cache); }catch(e){} }
  }
  return refrescarLocales();
}
function _empleadosCacheKey(esGestion, local){ return esGestion ? "empleadosCache_gestion" : "empleadosCache_"+local }
async function cargarEmpleadosDeAuth(){
  // Cada local ve solo su propio equipo (responsable de local, de turno
  // y colaboradores) — nunca admins/supervisores mezclados ahí, sea PC
  // o tablet. "Operaciones" (S.auth.esGestion) es un local trucho para
  // que admin/supervisor entren: se ve igual que cualquier local en el
  // buscador, nadie que no sepa que existe lo encuentra, y si tiene
  // contraseña cargada queda protegido igual que cualquier otro.
  const esGestion = S.auth.esGestion, local = S.auth.local;
  const key = _empleadosCacheKey(esGestion, local);
  // Pintamos al toque con la nómina que vimos la última vez en este local
  // (si la hay) mientras se refresca en segundo plano — el mismo criterio
  // que ya usamos para el stock: no hacer esperar al backend para mostrar
  // algo, y autocorregirse solo si cambió algo.
  let pintadoDeCache = false;
  if(!S.auth.empleados.length){
    try{
      const cache = ls.get(key, "");
      if(cache){ S.auth.empleados = JSON.parse(cache); pintadoDeCache = true; }
    }catch(e){}
  }
  S.auth.cargando = !pintadoDeCache; S.auth.errorCarga = ""; renderApp();
  const r = esGestion ? await api("empleadosGestion", {}) : await api("empleadosLocal", {local});
  if(!S.auth || S.auth.paso!=="quien" || S.auth.esGestion!==esGestion || S.auth.local!==local) return; // se movió de pantalla mientras esperábamos
  if(r && r.ok){
    S.auth.empleados = r.empleados;
    S.auth.errorCarga = "";
    try{ ls.set(key, JSON.stringify(r.empleados)); }catch(e){}
  } else if(!pintadoDeCache){
    S.auth.errorCarga = (r&&r.error)||"No se pudo conectar. Probá de nuevo.";
  }
  S.auth.cargando = false;
  renderApp();
}
function iniPersona(nombre){
  return nombre.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}
const ROL_LABEL = { admin:"Administrador", supervisor:"Supervisor", encargado:"Responsable de local", turno:"Responsable de turno", colaborador:"Colaborador" };

function authElegirLocal(local){
  S.auth.local=local; S.auth.error="";
  const info=S.locales.find(l=>l.nombre===local);
  S.auth.esGestion = !!(info && info.esGestion);
  if(info && info.tieneClave){ S.auth.paso="clave"; S.auth.clave=""; renderApp(); }
  else { S.auth.paso="quien"; cargarEmpleadosDeAuth(); }
}
async function authEnviarClave(){
  const clave=(S.auth.clave||"").trim();
  if(!clave){ S.auth.error="Ingresá la contraseña del local."; renderApp(); return }
  S.auth.cargando=true; S.auth.error=""; renderApp();
  const r = await api("verificarClaveLocal", {local:S.auth.local, clave});
  S.auth.cargando=false;
  if(r && r.ok){ S.auth.paso="quien"; cargarEmpleadosDeAuth(); }
  else { S.auth.error=(r&&r.error)||"No se pudo verificar la contraseña."; renderApp(); }
}
function authElegirEmpleado(emp){
  if(S.auth.esGestion){ authEntrarGestion(emp); return }
  S.auth.elegido=emp; S.auth.paso="pin"; S.auth.pin=""; S.auth.pin1=""; S.auth.error=""; renderApp();
}
/** Operaciones (admin/supervisor) no pide PIN — alcanza con la
 *  contraseña del local que ya se validó en el paso anterior. */
async function authEntrarGestion(emp){
  if(S.auth.cargando) return; // evita disparar varios pedidos si toca de nuevo mientras espera
  S.auth.elegido=emp; S.auth.cargando=true; S.auth.error=""; renderApp();
  const r = await api("loginGestion", { empleadoId:emp.id, clave:S.auth.clave, local:S.auth.local });
  S.auth.cargando=false;
  if(r && r.ok){ aplicarLogin(r); return }
  S.auth.elegido=null; S.auth.error=(r&&r.error)||"No se pudo entrar. Probá de nuevo.";
  renderApp();
}
function authVolver(){
  if(S.auth.paso==="pinConfirm"){ S.auth.paso="pin"; S.auth.pin=""; renderApp(); return }
  if(S.auth.paso==="pin"){ S.auth.elegido=null; S.auth.paso="quien"; renderApp(); return }
  if(S.auth.paso==="quien" && !S.deviceLocal){
    const info=S.locales.find(l=>l.nombre===S.auth.local);
    S.auth.paso = (info && info.tieneClave) ? "clave" : "local";
    if(S.auth.paso==="local") S.auth.local=null;
    renderApp(); return;
  }
  if(S.auth.paso==="clave"){ S.auth.local=null; S.auth.paso="local"; renderApp(); return }
  S.auth=null; renderApp();
}
/** Desfija el local guardado en este dispositivo — para cuando alguien
 *  fijó un local por error (p. ej. un admin/supervisor que tocó "sí" sin
 *  querer) y necesita volver a elegir, incluida la entrada a Operaciones. */
function cambiarDispositivo(){
  if(!confirm("¿Dejar de usar este local fijo en este dispositivo? La próxima vez va a volver a pedir elegir el local.")) return;
  S.deviceLocal=null; ls.del("deviceLocal");
  S.auth={ paso:"local", local:null, empleados:[], elegido:null, pin:"", pin1:"", error:"", cargando:false };
  renderApp();
}
async function authTecla(k){
  const cur = S.auth.paso==="pinConfirm" ? "pin1" : "pin";
  if(k==="borrar"){ S.auth[cur]=S.auth[cur].slice(0,-1); renderApp(); return }
  if(S.auth[cur].length>=4) return;
  S.auth[cur]+=k;
  renderApp();
  if(S.auth[cur].length===4) setTimeout(authSubmit, 150);
}
async function authSubmit(){
  const a=S.auth;
  if(a.paso==="pin"){
    a.cargando=true; a.error=""; renderApp();
    const r = await api("login", { empleadoId:a.elegido.id, pin:a.pin, local:a.local });
    a.cargando=false;
    if(r && r.ok){ aplicarLogin(r); return }
    if(r && r.primeraVez){ a.paso="pinConfirm"; a.pin1=""; renderApp(); return }
    a.error = (r&&r.error) || "No se pudo validar el PIN.";
    a.pin=""; renderApp();
    return;
  }
  if(a.paso==="pinConfirm"){
    a.cargando=true; a.error=""; renderApp();
    const r = await api("login", { empleadoId:a.elegido.id, pin:a.pin, pinConfirm:a.pin1, local:a.local });
    a.cargando=false;
    if(r && r.ok){ aplicarLogin(r); return }
    a.error = (r&&r.error) || "Los PIN no coinciden. Probá de nuevo.";
    a.paso="pin"; a.pin=""; a.pin1=""; renderApp();
  }
}
function aplicarLogin(r){
  const yaFijado = !!S.deviceLocal;
  const esGestion = S.auth ? S.auth.esGestion : false;
  const localElegido = (S.auth && !esGestion) ? S.auth.local : null;
  const puedeFijar = ["encargado","turno","colaborador"].indexOf(r.empleado.rol) !== -1;
  S.token = r.token; S.empleado = r.empleado;
  S.esGestion = esGestion; S.gestionLocal = esGestion ? S.auth.local : null;
  // Admin/supervisor: un login NUEVO (recién entrando, o después de haber
  // tocado "Salir") arranca siempre neutral, sin local elegido — nunca el
  // primero de la lista ni el último que se había mirado. Retomar el
  // último local solo tiene sentido si la sesión seguía abierta (ver
  // start(), que sí usa "ultimoLocal" para sobrevivir a un refresco de
  // página sin haber cerrado sesión).
  S.local = (S.deviceLocal) || (r.empleado.rol==="encargado"||r.empleado.rol==="turno"||r.empleado.rol==="colaborador" ? r.empleado.local : localElegido);
  // Siempre arranca en "Salida" — si no, a quien entra por primera vez le
  // puede quedar pegada la pestaña en la que estaba el usuario anterior en
  // este mismo dispositivo (por ejemplo "Equipo", que ni siquiera tendría
  // permiso de ver).
  S.tab = "salida";
  if(!S.deviceLocal) guardarSesionPC();
  S.auth=null;
  if(!yaFijado && puedeFijar && localElegido && confirm(`¿Fijar "${localElegido}" como local de este dispositivo? La próxima vez arranca directo, sin volver a elegir local.`)){
    S.deviceLocal = localElegido; ls.set("deviceLocal", localElegido);
  }
  toast("Hola, "+r.empleado.nombre.split(" ")[0]);
  reiniciarInactividad();
  if(r.datos && r.datos.ok){
    // Vino en la misma respuesta del login — nos ahorramos una ida y vuelta más a Apps Script.
    S.sabores = r.datos.sabores; S.saboresPorId = {}; S.sabores.forEach(s=>S.saboresPorId[s.id]=s);
    S.regs = r.datos.registros; S.stock = r.datos.stock;
  } else {
    cargarDatos();
  }
  iniciarPolling();
  renderApp();
}
function cerrarSesion(silencioso){
  limpiarSesion();
  S.busy = false; // si se cierra la sesión en medio de un guardado (ej. auto-cierre de tablet tras una salida), que no quede "Guardando…" trabado para la próxima persona que entre
  S.local = S.deviceLocal || null;
  S.tab = "salida";
  S.equipo = undefined; S.gestion = undefined; S.saboresAdmin = undefined; S.editandoSaborId = null; S.errorSaboresAdmin = null; S.errorEquipo = null; S.errorGestion = null;
  clearTimeout(S.inactTimer);
  clearInterval(S.pollTimer);
  if(!silencioso) toast("Sesión cerrada");
  iniciarAuth();
}
function reiniciarInactividad(){
  clearTimeout(S.inactTimer);
  if(S.lectorRemito) return; // leyendo/revisando un remito: no se cierra ni se bloquea solo
  if(S.deviceLocal){
    // Tablet: se cierra la sesión entera (vuelve a elegir quién sos).
    S.inactTimer = setTimeout(()=>cerrarSesion(false), INACTIVIDAD_TABLET_MS);
  } else if(!S.esGestion){
    // PC, local real: no cierra sesión, solo bloquea la pantalla — así si
    // alguien deja la PC abierta, nadie puede tocar nada sin el PIN.
    S.inactTimer = setTimeout(()=>bloquearPC(), INACTIVIDAD_PC_MS);
  }
  // PC + Operaciones (admin/supervisor): sin timer — la sesión queda
  // abierta hasta que toquen "Salir" (decidido por Gabi).
}
function bloquearPC(){
  if(S.bloqueado) return;
  S.bloqueado = true; S.bloqueoPin = ""; S.bloqueoClave = ""; S.bloqueoError = "";
  renderApp();
}
async function desbloquearPC(){
  if(S.esGestion){ if(!S.bloqueoClave) return }
  else if(S.bloqueoPin.length!==4) return;
  S.bloqueoCargando = true; S.bloqueoError=""; renderApp();
  const r = S.esGestion
    ? await api("loginGestion", { empleadoId:S.empleado.id, clave:S.bloqueoClave, local:S.gestionLocal })
    : await api("login", { empleadoId:S.empleado.id, pin:S.bloqueoPin, local:S.local });
  S.bloqueoCargando = false;
  if(r && r.ok){
    S.token = r.token; guardarSesionPC();
    S.bloqueado = false; S.bloqueoPin = ""; S.bloqueoClave = "";
    reiniciarInactividad();
    renderApp();
  } else {
    S.bloqueoError = (r&&r.error) || (S.esGestion?"Contraseña incorrecta.":"PIN incorrecto.");
    S.bloqueoPin = ""; S.bloqueoClave = ""; renderApp();
  }
}
["click","input","touchstart"].forEach(ev=>document.addEventListener(ev, ()=>{ if(S.empleado && !S.bloqueado) reiniciarInactividad() }, {passive:true}));

function renderNav(){
  if(!S.local || !S.sabores.length) return "";
  const st=stockMap(), al=alertas(st);
  const esColaborador = S.empleado.rol==="colaborador";
  const tabs = [["salida","Salida"], esColaborador?["devolucion","Devolución"]:["ingreso","Ingreso"]];
  if(!esColaborador) tabs.push(["stock","Stock"]);
  tabs.push(["historial","Historial"]);
  if(S.empleado.rol==="admin"||S.empleado.rol==="supervisor"||S.empleado.rol==="encargado") tabs.push(["equipo","Equipo"]);
  if(S.empleado.rol==="admin") tabs.push(["sabores","Sabores"]);
  return `<nav role="tablist" id="tabs" class="bottomNav">${tabs.map(([t,l])=>`<button role="tab" data-t="${t}" aria-selected="${S.tab===t}">${ICONOS_TAB[t]}<span>${l}</span>${t==="stock"&&al.length?`<span class="n">${al.length}</span>`:""}</button>`).join("")}</nav>`;

  if(!S.local) return `
    <div style="margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden">
      <video src="media/promo-minion-icepop.mp4" autoplay muted loop playsinline disablepictureinpicture disableremoteplayback style="width:100%;display:block;background:#000;pointer-events:none"></video>
    </div>
    <div class="note">Elegí el local arriba para empezar.</div>`;
  if(!S.sabores.length){
    if(S.errorCarga) return `<div class="note">${esc(S.errorCarga)}<br><button class="btn ghost" id="reintentarCarga" style="margin-top:10px">Reintentar</button></div>`;
    return `<div class="note">Cargando datos de ${esc(S.local)}…</div>`;
  }
  const st=stockMap();
  let h="";
  if(S.tab==="salida") h=gridSalida(st);
  else if(S.tab==="ingreso") h = S.modoDevolucion ? gridDevolucion(st) : gridIngreso(st);
  else if(S.tab==="devolucion") h=gridDevolucion(st);

  else if(S.tab==="historial") h=histView();
  else if(S.tab==="equipo") h=teamView();
  else if(S.tab==="sabores") h=saboresView();
  return h;
}

const CATEGORIA_COLOR = { "Chocolates":"#5C3A25", "Cremas":"#C9A46B", "Frutales":"#D9546B", "Dulces de leche":"#B5762E" };
const CATEGORIAS_ORDEN = ["Chocolates","Cremas","Frutales","Dulces de leche"];
function colorCategoria(cat){ return CATEGORIA_COLOR[cat] || "#8A7A6B" }
function categoriasPresentes(){
  const set=new Set(S.sabores.map(s=>s.categoria||"Cremas"));
  return CATEGORIAS_ORDEN.filter(c=>set.has(c)).concat([...set].filter(c=>!CATEGORIAS_ORDEN.includes(c)));
}

function chipFiltros(){
  const cats=categoriasPresentes();
  return `<div class="tools">
    <div class="grow"><input type="search" id="q" placeholder="Buscar sabor" value="${esc(S.q)}"></div>
    <button class="chip" id="soloAlerta" aria-pressed="${S.soloAlerta}">Debajo del mínimo</button>
  </div>
  <div class="tools catChips">
    <button class="chip" data-cat="todas" aria-pressed="${S.filtroCategoria==="todas"}">Todos</button>
    ${cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${S.filtroCategoria===c}" style="${S.filtroCategoria===c?`background:${colorCategoria(c)};border-color:${colorCategoria(c)};color:#fff`:""}">${esc(c)}</button>`).join("")}
  </div>`;
}
function listaFiltrada(st){
  const q=normalizar(S.q.trim());
  return S.sabores.filter(s=>(!q||normalizar(s.nombre).includes(q))&&(S.filtroCategoria==="todas"||(s.categoria||"Cremas")===S.filtroCategoria)&&(!S.soloAlerta||estadoSabor(s.id,st)));
}

function gridSalida(st){
  const cart=S.cart.salida, emp=S.empleado.nombre;
  const list=listaFiltrada(st);
  const card=s=>{
    const c=cart[s.id]||0, ed=estadoSabor(s.id,st);
    return `<div class="card${c?" sel":""}">
      <button class="pick" data-add="${s.id}" aria-label="${esc(s.nombre)}, sumar una">
        <span class="strip" style="background:${colorCategoria(s.categoria)}"></span>
        <span class="cardTop">${plateHTML(s.id)}<span class="pnombre">${esc(s.nombre)}</span></span>
        ${ed?`<span class="badge ${ed.cls}">${ed.label}</span>`:`<span class="badge" style="visibility:hidden">&nbsp;</span>`}
        <span class="pstock"><b>${st[s.id]}</b><span>${unidad(s.id,st[s.id])}</span></span>
      </button>
      ${c?`<span class="qty">${c}</span><button class="minus" data-sub="${s.id}" aria-label="Restar una">−</button>`:""}</div>`};
  return `<p class="sec">Retira: <b>${esc(emp)}</b></p>
  ${chipFiltros()}
  <p class="sec" style="margin-top:16px">Tocá un sabor para sumar una unidad</p>
  ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">Ningún sabor coincide con la búsqueda.</div>`}`;
}

function lectorRemitoView(){
  const lr=S.lectorRemito;
  if(lr.paso==="leyendo"){
    return `<p class="sec">Leer remito</p>
    <div class="photoStage">
      <img src="${lr.fotoDataUrl}" alt="Foto del remito">
      <div class="scanline"></div>
      <div class="scanOverlay"><b>Leyendo el remito…</b><span>Separando sabores y cantidades…</span></div>
    </div>`;
  }
  if(lr.paso==="error"){
    return `<p class="sec">Leer remito</p>
    <div class="empty">${esc(lr.error)}</div>
    <button class="btn ghost" type="button" id="remitoCancelar" style="margin-top:10px">Volver</button>`;
  }
  const total=lr.items.reduce((a,it)=>a+(it.ignorar?0:(it.cantidad||0)),0);
  const sinResolver=lr.items.filter(it=>!it.saborId && !it.ignorar).length;
  const fila=(it,i)=>{
    const flag=!it.saborId && !it.ignorar;
    return `<div class="row${flag?" flag":""}">
      ${it.saborId?plateHTML(it.saborId):`<span class="plate" style="display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--warn);font-weight:800">?</span>`}
      <div class="nm"><b>${esc(it.saborId?it.nombreSabor:it.nombreDetectado)}</b>${flag?`<div class="meta">Detectado como "${esc(it.nombreDetectado)}" — no está en tu catálogo</div>`:it.ignorar?`<div class="meta">Se va a ignorar</div>`:""}</div>
      <div class="right"><input type="number" min="0" data-remito-qty="${i}" value="${it.cantidad}" ${it.ignorar?"disabled":""}></div>
      ${flag||it.ignorar?`<div class="flagPick"><select data-remito-elegir="${i}">
        <option value="" ${!it.saborId&&!it.ignorar?"selected":""}>Elegí a qué sabor corresponde…</option>
        ${S.sabores.map(s=>`<option value="${s.id}" ${it.saborId===s.id?"selected":""}>${esc(s.nombre)}</option>`).join("")}
        <option value="ignorar" ${it.ignorar?"selected":""}>Ignorar este renglón</option>
      </select></div>`:""}
    </div>`;
  };
  return `<p class="sec">Detectado en el remito</p>
  <div class="remitoResumen">${lr.items.length} renglones, ${total} unidades en total.${sinResolver?` ${sinResolver} sin resolver — elegí el sabor o ignorá el renglón antes de cargar.`:""}</div>
  ${lr.remitoDetectado?`<p class="lede" style="margin:8px 0 0;color:var(--muted)">N° de remito detectado: <b style="color:var(--ink)">${esc(lr.remitoDetectado)}</b></p>`:""}
  <div class="rows" style="margin-top:14px">${lr.items.map(fila).join("")}</div>
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn ghost" type="button" id="remitoCancelar">Cancelar</button>
    <button class="btn" type="button" id="remitoCargar" ${sinResolver?"disabled":""}>Cargar al carrito de ingreso</button>
  </div>`;
}
async function leerRemitoFoto(base64, mime){
  const r = await api("leerRemito", {foto:base64, mime, local:S.local}, 60000);
  if(r && r.ok){
    S.lectorRemito = { paso:"revision", items:r.items, remitoDetectado:r.remitoDetectado, fotoUrl:r.fotoUrl, fotoDataUrl:S.lectorRemito.fotoDataUrl };

function stockView(st){
  if(S.conteo) return stockViewConteo();
  if(S.verPedido) return stockViewPedido(st);
  const al=alertas(st);
  let kgTotal=0;
  const filas=S.sabores.map(s=>{
    const s7=salidasDias(7);
    const cov = (s7[s.id]||0)>0 ? (st[s.id]/((s7[s.id]||0)/7)) : (st[s.id]>0?99:0);
    const ed=estadoSabor(s.id,st);
    if(s.peso) kgTotal += (st[s.id]||0)*s.peso;
    return {s, cov, ed};
  });
  const s7=salidasDias(7), consumoSemanal=Math.round(Object.values(s7).reduce((a,b)=>a+b,0));
  const pedidoTotal=S.sabores.reduce((a,s)=>a+pedidoSugerido(s.id,st),0);
  const puedeGestionar = S.empleado.rol!=="colaborador";
  const puedePedido = S.empleado.rol!=="colaborador";
  const last=S.stock?new Date(S.stock.ts).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):null;
  const listaVisible = listaFiltrada(st);

  const desgloseCajas=s=>{
    if(!s.cantidad_maestra) return "";
    const total=st[s.id]||0, cajas=Math.floor(total/s.cantidad_maestra), sueltas=total%s.cantidad_maestra;
    if(!cajas) return ` · ${sueltas} suelta${sueltas===1?"":"s"}`;
    return ` · ${cajas} caja${cajas===1?"":"s"}${sueltas?" + "+sueltas+" suelta"+(sueltas===1?"":"s"):""}`;
  };

function puedeAnular(r){
  if(r.anulado) return false;
  const rol=S.empleado.rol, edad=Date.now()-r.ts;
  if(rol==="admin"||rol==="supervisor") return true;
  if(rol==="encargado"||rol==="turno") return edad<=24*3600*1000;
  if(rol==="colaborador") return String(r.empleadoId)===String(S.empleado.id) && edad<=10*60*1000;
  return false;
}
function histView(){
  const dias = S.periodoHist==="60" ? 60 : Number(S.periodoHist);
  const desde = Date.now() - dias*864e5;
  const regs=[...S.regs].filter(r=>r.ts>=desde).sort((a,b)=>b.ts-a.ts);
  // Ciclo de 3 semanas: la actual (S.semanaHist=0) + las 2 anteriores. Rota
  // sola cada lunes porque lunesDe() siempre se calcula contra "ahora" — no
  // hay nada guardado que haya que "pasar" de una semana a la otra.
  const inicioSem=lunesDe()-S.semanaHist*7*864e5, finSem=inicioSem+7*864e5;
  const diasSem=["Lu","Ma","Mi","Ju","Vi","Sá","Do"], sem={};
  for(const r of regsActivos()) if(r.tipo==="salida"&&r.ts>=inicioSem&&r.ts<finSem){const d=(new Date(r.ts).getDay()+6)%7;
    for(const [id,q] of Object.entries(r.items||{})){(sem[id]=sem[id]||[0,0,0,0,0,0,0])[d]+=+q||0}}
  const ids=S.sabores.filter(s=>sem[s.id]);
  const rangoSem=`${new Date(inicioSem).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})} al ${new Date(finSem-864e5).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})}`;
  const semanaChips=["Esta semana","Semana pasada","Hace 2 semanas"].map((l,i)=>`<button type="button" class="chip" data-semana-hist="${i}" aria-pressed="${S.semanaHist===i}">${l}</button>`).join("");
  const totalesDia=[0,0,0,0,0,0,0];
  ids.forEach(s=>sem[s.id].forEach((x,i)=>totalesDia[i]+=x));
  const totalGeneral=totalesDia.reduce((a,b)=>a+b,0);
  const tabla=ids.length?`<div class="tbl"><table><thead><tr><th>Sabor</th>${diasSem.map(d=>`<th>${d}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${ids.map(s=>`<tr><td>${esc(s.nombre)}</td>${sem[s.id].map(x=>`<td>${x||"·"}</td>`).join("")}<td><b>${sem[s.id].reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}
    <tr class="totalFila"><td><b>Total vasquetas</b></td>${totalesDia.map(x=>`<td><b>${x||"·"}</b></td>`).join("")}<td><b>${totalGeneral}</b></td></tr>
    </tbody></table></div>`
    :`<div class="empty">Sin salidas esa semana.</div>`;
  const it=r=>Object.entries(r.items||{}).filter(([,q])=>q).map(([id,q])=>r.tipo==="conteo"?`${esc(nombre(id))}: ${q}`:`${esc(nombre(id))} ×${q}`).join(" · ");
  const claseTipo=r=>r.subtipo==="devolucion"?"devolucion":r.tipo;
  const labelTipo=r=>r.subtipo==="devolucion"?"devolución":r.tipo;
  const lista=regs.slice(0,150).map(r=>`<div class="h${r.anulado?" anulado":""}"><div class="top"><span class="pill ${claseTipo(r)}">${labelTipo(r)}</span>
    <span class="who">${esc(r.empleado||"Sin nombre")}</span><span>${r.total||""} u.${r.remito?" · Remito "+esc(r.remito):""}</span>
    <time>${new Date(r.ts).toLocaleString("es-AR",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</time></div>
    ${r.tipo==="conteo"?`<div class="items">Conteo físico de ${Object.keys(r.items||{}).length} sabores</div>`:`<div class="items">${it(r)}</div>`}
    ${r.anulado?`<div class="anulTag">Anulado por ${esc(r.anulado_por)}${r.motivo?": "+esc(r.motivo):""}</div>`:puedeAnular(r)?`<button type="button" class="anularBtn" data-anular="${r.id}">Anular</button>`:""}
    ${S.empleado.rol==="admin"?`<button type="button" class="anularBtn" style="color:var(--alert);border-color:var(--alert)" data-eliminar-reg="${r.id}" data-tipo-reg="${r.tipo}">Eliminar</button>`:""}
    </div>`).join("");
  return `<div class="tools"><div style="display:flex;gap:6px">
      ${[["1","Hoy"],["7","7 días"],["30","30 días"],["60","Todo"]].map(([v,l])=>`<button type="button" class="chip" data-periodo="${v}" aria-pressed="${S.periodoHist===v}">${l}</button>`).join("")}
    </div></div>
  <p class="sec" style="margin-bottom:8px">Salidas por sabor — ${esc(rangoSem)}</p>
  <div class="tools" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${semanaChips}</div>
  ${tabla}
  <p class="sec">Movimientos</p>${lista?`<div class="hist">${lista}</div>`:`<div class="empty">Sin movimientos en este período.</div>`}`;
}

function _equipoCacheKey(local){ return "equipoCache_"+local }
async function cargarEquipo(){
  const local = S.local;
  // Pintamos al toque con el último equipo que vimos de este local (si lo hay)
  // mientras se refresca en segundo plano, mismo criterio que ya usamos en
  // el login: no confundir "no llegó respuesta" con "no hay nadie cargado".
  if(S.equipo===null){
    try{
      const c = ls.get(_equipoCacheKey(local), "");
      if(c){ S.equipo = JSON.parse(c); S.errorEquipo = null; if(S.tab==="equipo") renderApp(); }
    }catch(e){}
  }
  const r = await api("empleadosAdmin", {local});
  if(S.local!==local) return; // se cambió de local mientras esperábamos
  if(r && r.ok){
    S.equipo = r.empleados; S.errorEquipo = null;
    try{ ls.set(_equipoCacheKey(local), JSON.stringify(r.empleados)); }catch(e){}
  } else if(!S.equipo || !S.equipo.length){
    S.equipo = []; S.errorEquipo = (r&&r.error) || "No se pudo conectar. Probá de nuevo.";
  }
  if(S.tab==="equipo") renderApp();
}
async function cargarGestion(){
  if(S.gestion===null){
    try{
      const c = ls.get("gestionCache", "");
      if(c){ S.gestion = JSON.parse(c); S.errorGestion = null; if(S.tab==="equipo") renderApp(); }
    }catch(e){}
  }
  const r = await api("empleadosAdmin", {local:""});
  if(r && r.ok){
    S.gestion = r.empleados; S.errorGestion = null;
    try{ ls.set("gestionCache", JSON.stringify(r.empleados)); }catch(e){}
  } else if(!S.gestion || !S.gestion.length){
    S.gestion = []; S.errorGestion = (r&&r.error) || "No se pudo conectar. Probá de nuevo.";
  }
  if(S.tab==="equipo") renderApp();
}

/** "devolucion" es su propia pestaña (colaborador) o un modo adentro de
 *  "ingreso" (responsable, vía el link "¿Es una devolución?") — este
 *  helper resuelve en cuál carrito (S.cart) hay que mirar/guardar según
 *  cómo se llegó, para no duplicar esa lógica en cada lugar que la usa. */
function cartKeyActual(){
  return (S.tab==="devolucion" || (S.tab==="ingreso" && S.modoDevolucion)) ? "devolucion" : S.tab;
}
function renderBar(){
  const bar=$("#bar"); if(!bar) return; const inn=$("#barIn");
  let visible=false;
  if(S.tab==="stock" && S.conteo){
    visible=true;
    inn.innerHTML = S.confirm
      ? `<div class="sum">¿Guardar el conteo de <b>${esc(S.local)}</b>? Reemplaza el stock actual.</div><button class="btn ghost" id="volver" ${S.busy?"disabled":""}>Volver</button><button class="btn" id="ok" ${S.busy?"disabled":""}>${S.busy?"Guardando…":"Guardar conteo"}</button>`
      : `<div class="sum">Revisá los números y guardá.</div><button class="btn ghost" id="cancelConteo">Cancelar</button><button class="btn" id="go">Guardar conteo</button>`;
  } else if(S.tab==="salida" || S.tab==="ingreso" || S.tab==="devolucion"){
    const cartKey=cartKeyActual(), enDevolucion=cartKey==="devolucion";
    const cart=S.cart[cartKey], ent=Object.entries(cart).filter(([,q])=>q>0), tot=ent.reduce((a,[,q])=>a+q,0);
    if(tot){
      visible=true;
      const verbo=S.tab==="salida"?"salida":(enDevolucion?"devolución":"ingreso");
      const st=stockMap();
      if(S.confirm){
        const neg=S.tab==="salida"?ent.filter(([id,q])=>st[id]-q<0).map(([id])=>nombre(id)):[];
        inn.innerHTML = `<div class="sum"><b>${esc(S.empleado.nombre)}</b> · ${esc(S.local)}<br>${ent.map(([id,q])=>`${esc(nombre(id))} ×${q}`).join(" · ")}
          ${neg.length?`<div class="warn">Queda en negativo: ${neg.map(esc).join(", ")}.</div>`:""}</div>
          <button class="btn ghost" id="volver" ${S.busy?"disabled":""}>Volver</button><button class="btn" id="ok" ${S.busy?"disabled":""}>${S.busy?"Guardando…":"Confirmar "+verbo}</button>`;
      } else {
        inn.innerHTML = `<div class="sum"><b>${tot} ${tot===1?"unidad":"unidades"}</b> · ${ent.length} ${ent.length===1?"sabor":"sabores"}</div>
          <button class="btn ghost" id="limpiar">Borrar</button><button class="btn" id="go">Registrar ${verbo}</button>`;
      }
    }
  }
  bar.hidden=!visible;
  const nav=$("#tabs"); if(nav) nav.hidden=visible;
}

/* ============================================================
   CARGA DE DATOS + POLLING (reemplaza los onSnapshot)
============================================================ */
function _datosCacheKey(local){ return "datosCache_"+local }
async function cargarDatos(){
  if(!S.local || !S.token) return;
  const local=S.local; // por si cambia de local mientras esta llamada está en vuelo
  const r = await api("datos", {local});
  if(local!==S.local) return; // el usuario ya se movió a otro local, esta respuesta quedó vieja
  if(!r || !r.ok){
    S.errorCarga = (r&&r.error) || "No se pudo conectar. Se va a reintentar solo.";
    if(!S.sabores.length) renderApp();
    return;
  }
  S.errorCarga = null;
  S.sabores = r.sabores;
  S.saboresPorId = {}; S.sabores.forEach(s=>S.saboresPorId[s.id]=s);
  S.regs = r.registros;
  S.stock = r.stock;
  try{ ls.set(_datosCacheKey(local), JSON.stringify({sabores:r.sabores, registros:r.registros, stock:r.stock})); }catch(e){}
  if(S.conteo){ renderBar(); return }
  if(_estaEscribiendo()) return; // no repintamos toda la pantalla mientras alguien está escribiendo algo — se ve solo en el próximo refresco
  renderApp();
}
function _estaEscribiendo(){
  const t = document.activeElement && document.activeElement.tagName;
  return t==="INPUT" || t==="TEXTAREA" || t==="SELECT";
}
function iniciarPolling(){
  clearInterval(S.pollTimer);
  S.pollTimer = setInterval(()=>{ cargarDatos(); colaFlush(); }, POLL_MS);
}
function setLocal(local){
  S.local = local; S.sabores=[]; S.saboresPorId={}; S.regs=[]; S.stock=undefined; S.errorCarga=null;
  try{ ls.set("ultimoLocal", local); }catch(e){}
  S.cart={salida:{},ingreso:{},devolucion:{}}; S.modoDevolucion=false; S.conteo=null; S.verPedido=false; S.confirm=false; S.equipo=undefined; S.errorEquipo=null; S.pedidoAdj={}; S.semanaHist=0;
  // Pintamos al toque con lo último que vimos de este local (si lo vimos antes)
  // mientras se refresca en segundo plano — evita la pantalla en blanco al
  // cambiar de sucursal, que es lo más lento de esta app (Apps Script).
  try{
    const cache = ls.get(_datosCacheKey(local),"");
    if(cache){
      const d = JSON.parse(cache);
      S.sabores = d.sabores; S.saboresPorId={}; S.sabores.forEach(s=>S.saboresPorId[s.id]=s);
      S.regs = d.registros; S.stock = d.stock;
    }
  }catch(e){}
  cargarDatos(); renderApp();
}

/* ============================================================
   GUARDAR — registrar (salida/ingreso), conteo, con cola offline
============================================================ */
async function guardarMovimiento(){
  if(S.busy) return; S.busy=true; renderBar();
  try{
    const cartKey=cartKeyActual(), enDevolucion=cartKey==="devolucion";
    const tipo = enDevolucion ? "ingreso" : S.tab; // una devolución es un ingreso con subtipo, el backend no tiene un tercer tipo de movimiento
    const cart=S.cart[cartKey];
    const items={}; for(const [id,q] of Object.entries(cart)) if(q>0) items[id]=q;
    const total=Object.values(items).reduce((a,b)=>a+b,0);
    const clienteId=uuid();
    const payload={clienteId, tipo, local:S.local, items,
      remito: tipo==="ingreso"&&!enDevolucion ? S.remito.trim() : undefined,
      fotoRemito: tipo==="ingreso"&&!enDevolucion ? (S.fotoRemitoUrl||undefined) : undefined,
      subtipo: enDevolucion ? "devolucion" : undefined};
    const r = await api("registrar", payload);
    if(r && r.ok){
      toast((S.tab==="salida"?"Salida registrada: ":enDevolucion?"Devolución registrada: ":"Ingreso registrado: ")+total+" u.");
      S.cart[cartKey]={}; S.remito=""; S.fotoRemitoUrl=""; S.confirm=false; S.modoDevolucion=false;
      await cargarDatos();
    } else if(r && r.offline){
      colaAgregar("registrar", payload);
      toast("Sin conexión: se guardó y se va a enviar solo.");
      S.cart[cartKey]={}; S.remito=""; S.fotoRemitoUrl=""; S.confirm=false; S.modoDevolucion=false;
    } else {
      toast((r&&r.error)||"No se pudo guardar. Probá de nuevo.");
    }
  }finally{
    // pase lo que pase (incluso un error inesperado) el botón tiene que
    // volver a quedar usable — si no, la tablet queda trabada en
    // "Guardando…" para siempre y no hay forma de refrescar para salir.
    S.busy=false; renderApp();
  }
}
async function guardarConteo(){
  if(S.busy) return; S.busy=true; renderBar();
  try{
  const items={}; S.sabores.forEach(s=>items[s.id]=S.conteo[s.id]||0);
  const clienteId=uuid();
  const payload={clienteId, local:S.local, items};
  const r = await api("conteo", payload);
  if(r && r.ok){
    toast("Conteo guardado");
    S.conteo=null; S.confirm=false;
    await cargarDatos();
  } else if(r && r.offline){
    colaAgregar("conteo", payload);
    toast("Sin conexión: el conteo se va a enviar solo.");
    S.conteo=null; S.confirm=false;
  } else {
    toast((r&&r.error)||"No se pudo guardar el conteo.");
  }
  }finally{
    S.busy=false; renderApp();
  }
}
async function conBoton(btn, fn){
  if(!btn || btn.disabled) return;
  const original=btn.textContent;
  btn.disabled=true; btn.textContent="Cargando…";
  try{ return await fn(); }
  finally{ btn.disabled=false; btn.textContent=original; }
}
async function anularMovimiento(id, btn){
  const motivo = prompt("Motivo (opcional):"); if(motivo===null) return;
  await conBoton(btn, async ()=>{
    const r = await api("anular", {registroId:id, motivo});
    if(r && r.ok){ toast("Movimiento anulado"); cargarDatos() } else toast((r&&r.error)||"No se pudo anular.");
  });
}

/* ============================================================
   EVENTOS
============================================================ */
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,a"); if(!t) return;

  if(t.dataset.authback){ authVolver(); return }
  if(t.dataset.cambiarDispositivo){ cambiarDispositivo(); return }
  if(t.dataset.authemp){ const emp=S.auth.empleados.find(x=>String(x.id)===t.dataset.authemp); if(emp) authElegirEmpleado(emp); return }
  if(t.dataset.tecla){ authTecla(t.dataset.tecla); return }
  if(t.dataset.teclaBloqueo){
    if(S.bloqueoCargando) return;
    if(t.dataset.teclaBloqueo==="borrar") S.bloqueoPin = S.bloqueoPin.slice(0,-1);
    else if(S.bloqueoPin.length<4) S.bloqueoPin += t.dataset.teclaBloqueo;
    renderApp();
    if(S.bloqueoPin.length===4) setTimeout(desbloquearPC, 150);
    return;
  }
  if(t.id==="bloqueoDesbloquear"){ desbloquearPC(); return }
  if(t.id==="bloqueoSalir"){ S.bloqueado=false; S.bloqueoPin=""; S.bloqueoClave=""; cerrarSesion(false); return }
  if(t.id==="authLocalOk"){
    const v=$("#authLocal").value.trim();
    if(!v) return;
    let match=S.locales.find(l=>l.nombre.toLowerCase()===v.toLowerCase());
    if(!match){ toast("Elegí un local de la lista"); return }
    // si el pedido inicial de locales todavía no terminó, esperamos ESE mismo pedido (no disparamos uno nuevo)
    // para no sumar una ida y vuelta extra al backend en el caso normal (que ya terminó hace rato)
    if(localesFetchPromise){
      t.disabled = true; t.textContent = "Verificando…";
      try{ await localesFetchPromise; }catch(e){ /* si el refresco de fondo falló, seguimos con lo que ya teníamos en vez de quedar trabados acá */ }
      t.disabled = false; t.textContent = "Continuar";
      match = S.locales.find(l=>l.nombre.toLowerCase()===v.toLowerCase()) || match;
    }
    authElegirLocal(match.nombre);
    return;
  }
  if(t.id==="authClaveOk"){ await authEnviarClave(); return }
  if(t.id==="authReintentar"){ await cargarEmpleadosDeAuth(); return }
  if(t.id==="salir"){ cerrarSesion(false); return }
  if(t.id==="reintentarCarga"){ S.errorCarga=null; renderApp(); cargarDatos(); return }
  if(t.id==="reintentarSabores"){ S.saboresAdmin=undefined; renderApp(); return }
  if(t.id==="reintentarEquipo"){ S.equipo=undefined; renderApp(); return }
  if(t.id==="reintentarGestion"){ S.gestion=undefined; renderApp(); return }
  if(t.id==="editarNombre"){ await editarMiNombre(); return }

  if(t.dataset.t){ S.tab=t.dataset.t; S.confirm=false; S.needEmp=false; S.modoDevolucion=false; renderApp(); return }
  if(t.dataset.add){ const c=S.cart.salida; c[t.dataset.add]=(c[t.dataset.add]||0)+1; S.confirm=false; renderApp(); return }
  if(t.dataset.sub){ const c=S.cart.salida; c[t.dataset.sub]=Math.max(0,(c[t.dataset.sub]||0)-1); if(!c[t.dataset.sub]) delete c[t.dataset.sub]; S.confirm=false; renderApp(); return }
  if(t.dataset.icaja){ const c=S.cart.ingreso; c[t.dataset.icaja]=(c[t.dataset.icaja]||0)+(Number(t.dataset.cant)||0); S.confirm=false; renderApp(); return }
  if(t.dataset.iinc){ const c=S.cart.ingreso; c[t.dataset.iinc]=(c[t.dataset.iinc]||0)+1; S.confirm=false; renderApp(); return }
  if(t.dataset.idec){ const c=S.cart.ingreso; c[t.dataset.idec]=Math.max(0,(c[t.dataset.idec]||0)-1); if(!c[t.dataset.idec]) delete c[t.dataset.idec]; S.confirm=false; renderApp(); return }
  if(t.dataset.dinc){ const c=S.cart.devolucion, max=Number(t.dataset.max)||0; c[t.dataset.dinc]=Math.min(max,(c[t.dataset.dinc]||0)+1); S.confirm=false; renderApp(); return }
  if(t.dataset.ddec){ const c=S.cart.devolucion; c[t.dataset.ddec]=Math.max(0,(c[t.dataset.ddec]||0)-1); if(!c[t.dataset.ddec]) delete c[t.dataset.ddec]; S.confirm=false; renderApp(); return }
  if(t.dataset.pinc){ S.pedidoAdj[t.dataset.pinc]=(S.pedidoAdj[t.dataset.pinc]||0)+2; renderApp(); return }
  if(t.dataset.pdec){ S.pedidoAdj[t.dataset.pdec]=(S.pedidoAdj[t.dataset.pdec]||0)-2; renderApp(); return }
  if(t.dataset.dias){ S.diasEntrega=Number(t.dataset.dias); ls.set("diasEntrega",String(S.diasEntrega)); S.pedidoAdj={}; renderApp(); return }
  if(t.dataset.periodo){ S.periodoHist=t.dataset.periodo; ls.set("periodoHist",S.periodoHist); renderApp(); return }
  if(t.dataset.semanaHist!==undefined){ S.semanaHist=Number(t.dataset.semanaHist); renderApp(); return }
  if(t.dataset.anular){ await anularMovimiento(t.dataset.anular, t); return }
  if(t.dataset.eliminarReg){ await eliminarRegistroDef(t.dataset.eliminarReg, t.dataset.tipoReg, t); return }
  if(t.dataset.baja){ await darDeBaja(t.dataset.baja, t); return }
  if(t.dataset.resetpin){ await resetearPin(t.dataset.resetpin, t); return }
  if(t.dataset.editarNombreEmp){ await editarNombreEmpleado(t.dataset.editarNombreEmp, t.dataset.nombreActual, t); return }
  if(t.dataset.eliminarEmp){ await eliminarEmpleadoDef(t.dataset.eliminarEmp, t.dataset.nombreEmp, t); return }
  if(t.dataset.editarSaborBtn){ S.editandoSaborId=t.dataset.editarSaborBtn; renderApp(); return }
  if(t.dataset.cancelarSabor){ S.editandoSaborId=null; renderApp(); return }
  if(t.dataset.toggleSabor){
    const s=(S.saboresAdmin||[]).find(x=>x.id===t.dataset.toggleSabor);
    if(s) await conBoton(t, ()=>toggleSabor(s));
    return;
  }

  if(t.dataset.cat){ S.filtroCategoria = t.dataset.cat; renderApp(); return }
  if(t.id==="soloAlerta"){ S.soloAlerta=!S.soloAlerta; renderApp(); return }
  if(t.id==="limpiar"){ S.cart[cartKeyActual()]={}; renderApp(); return }
  if(t.id==="irDevolucion"){ S.modoDevolucion=true; S.confirm=false; renderApp(); return }
  if(t.id==="volverIngreso"){ S.modoDevolucion=false; S.confirm=false; renderApp(); return }
  if(t.id==="btnLeerRemitoFoto"){ $("#inputRemitoFoto").click(); return }
  if(t.id==="remitoCancelar"){ S.lectorRemito=null; reiniciarInactividad(); renderApp(); return }
  if(t.id==="remitoCargar"){
    const lr=S.lectorRemito;
    lr.items.forEach(it=>{ if(it.saborId && !it.ignorar && it.cantidad>0) S.cart.ingreso[it.saborId]=(S.cart.ingreso[it.saborId]||0)+it.cantidad; });
    if(lr.remitoDetectado) S.remito=lr.remitoDetectado;
    S.fotoRemitoUrl=lr.fotoUrl||"";
    S.lectorRemito=null;
    reiniciarInactividad();
    toast("Cargado al carrito — revisá y confirmá el ingreso");
    renderApp();
    return;
  }
  if(t.id==="conteoBtn"){ const st=stockMap(); S.conteo={}; Object.keys(st).forEach(id=>S.conteo[id]=Math.max(0,st[id])); S.confirm=false; renderApp(); return }
  if(t.id==="verPedidoBtn"){ S.verPedido=true; renderApp(); return }
  if(t.id==="volverPedido"){ S.verPedido=false; renderApp(); return }
  if(t.id==="aplicarTodos"){
    const v=Math.max(0,parseInt($("#aplicarTodosValor").value,10)||0);
    Object.keys(S.conteo).forEach(id=>S.conteo[id]=v);
    renderApp(); return;
  }
  if(t.id==="cancelConteo"){ S.conteo=null; renderApp(); return }
  if(t.id==="volver"){ S.confirm=false; renderApp(); return }
  if(t.id==="go"){ S.confirm=true; renderApp(); return }
  if(t.id==="ok"){ if(S.tab==="stock"&&S.conteo) guardarConteo(); else guardarMovimiento(); return }
  if(t.id==="waCopiar"){
    const txt=$(".waBubble").textContent;
    try{ await navigator.clipboard.writeText(txt); toast("Copiado"); }catch(e){ toast("No se pudo copiar"); }
    return;
  }
});
document.addEventListener("focusin", e=>{
  if(e.target.id==="local"||e.target.id==="authLocal") e.target.select();
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.q=e.target.value; const pos=e.target.selectionStart; renderApp(); const q=$("#q"); if(q){ q.focus(); q.setSelectionRange(pos,pos) } }
  if(e.target.id==="remito"){ S.remito=e.target.value }
  if(e.target.id==="authClave"){ S.auth.clave=e.target.value }
  if(e.target.id==="bloqueoClaveInput"){ S.bloqueoClave=e.target.value }
  if(e.target.dataset.c){ S.conteo[e.target.dataset.c]=Math.max(0,parseInt(e.target.value,10)||0) }
  if(e.target.dataset.remitoQty!==undefined){ S.lectorRemito.items[+e.target.dataset.remitoQty].cantidad=Math.max(0,parseInt(e.target.value,10)||0) }
});
document.addEventListener("change", e=>{
  if(e.target.id==="inputRemitoFoto"){
    const file=e.target.files[0]; e.target.value="";
    if(!file) return;
    const lector=new FileReader();
    lector.onload=()=>{
      const dataUrl=lector.result;
      const base64=dataUrl.split(",")[1];
      S.lectorRemito={ paso:"leyendo", fotoDataUrl:dataUrl };
      reiniciarInactividad(); // cancela el timer que ya estaba corriendo de antes de abrir el lector
      renderApp();
      leerRemitoFoto(base64, file.type||"image/jpeg");
    };
    lector.readAsDataURL(file);
    return;
  }
  if(e.target.dataset.remitoElegir!==undefined){
    const it=S.lectorRemito.items[+e.target.dataset.remitoElegir], v=e.target.value;
    if(v==="ignorar"){ it.ignorar=true; it.saborId=null; it.nombreSabor=null; }
    else if(v){ it.saborId=v; it.nombreSabor=(S.saboresPorId[v]||{}).nombre||""; it.ignorar=false; }
    else { it.saborId=null; it.nombreSabor=null; it.ignorar=false; }
    renderApp();
    return;
  }
  if(e.target.id==="local"){
    const v=e.target.value.trim();
    const match=S.locales.find(l=>l.nombre.toLowerCase()===v.toLowerCase() && !l.esGestion);
    if(match && match.nombre!==S.local) setLocal(match.nombre);
    else e.target.value=S.local||"";
  }
});
async function conBotonCargando(form, fn){
  const btn=form.querySelector('button[type=submit]');
  if(!btn || btn.disabled) return;
  const textoOriginal=btn.textContent;
  btn.disabled=true; btn.textContent="Cargando…";
  try{ await fn(); }
  finally{ btn.disabled=false; btn.textContent=textoOriginal; }
}
document.addEventListener("submit", async e=>{
  if(e.target.id==="altaFormEquipo" || e.target.id==="altaFormGestion"){
    e.preventDefault();
    await conBotonCargando(e.target, async ()=>{
      const esGestion = e.target.id==="altaFormGestion";
      const fd=new FormData(e.target);
      const r = await api("altaEmpleado", {nombre:fd.get("nombre"), rol:fd.get("rol"), local: esGestion?"":S.local});
      if(r && r.ok){
        toast("Alta creada"); e.target.reset();
        if(esGestion) cargarGestion(); else cargarEquipo();
      } else toast((r&&r.error)||"No se pudo dar de alta.");
    });
  }
  if(e.target.dataset && e.target.dataset.editarSabor){
    e.preventDefault();
    await conBotonCargando(e.target, async ()=>{
      const id=e.target.dataset.editarSabor;
      const actual=(S.saboresAdmin||[]).find(x=>x.id===id);
      const fd=new FormData(e.target);
      await guardarSabor({
        id, nombre:fd.get("nombre"), tipo:fd.get("tipo"), familia:fd.get("familia"), categoria:fd.get("categoria"),
        minimo:fd.get("minimo"), peso:fd.get("peso"), cantidad_maestra:fd.get("cantidad_maestra"),
        orden: actual?actual.orden:0, activo: fd.get("activo")==="on",
      });
    });
  }
  if(e.target.id==="altaSaborForm"){
    e.preventDefault();
    await conBotonCargando(e.target, async ()=>{
      const fd=new FormData(e.target);
      await guardarSabor({ nombre:fd.get("nombre"), tipo:fd.get("tipo"), familia:fd.get("familia"), categoria:fd.get("categoria"), minimo:fd.get("minimo"), peso:fd.get("peso"), cantidad_maestra:fd.get("cantidad_maestra") });
      e.target.reset();
    });
  }
});

/* ============================================================
   ARRANQUE
============================================================ */
/* ============================================================
   AVISO DE VERSIÓN NUEVA — el sitio es un solo HTML estático sin
   build step, así que el navegador se queda con este archivo en su
   caché HTTP; alguien puede seguir usando una versión vieja horas sin
   enterarse (y en la tablet, instalada como acceso directo, no hay
   barra de direcciones para "simplemente recargar"). Mismo criterio
   que luccianos-academy: preguntar la versión publicada pidiendo este
   mismo archivo con un parámetro que cambia siempre (así esa lectura
   puntual no puede venir de la caché), y avisar si difiere.
============================================================ */
const CHEQUEO_VERSION_MS = 5 * 60 * 1000;
let avisoVersionMostrado = false;

async function versionPublicada(){
  try{
    const resp = await fetch(`./?nocache=${Date.now()}`, { cache: "no-store" });
    if(!resp.ok) return null;
    const texto = await resp.text();
    const m = texto.match(/FRONTEND_VERSION\s*=\s*"([\d.]+)"/);
    return m ? m[1] : null;
  }catch(e){ return null; } // sin conexión o servidor caído: se reintenta en el próximo chequeo
}
function mostrarAvisoVersion(nueva){
  if(avisoVersionMostrado) return;
  avisoVersionMostrado = true;
  const barra = document.createElement("div");
  barra.className = "avisoActualizacion";
  barra.innerHTML = `<span>Hay una versión nueva (${esc(nueva)}).</span><button class="btn" type="button" id="btnActualizarApp">Actualizar</button>`;
  document.body.appendChild(barra);
  barra.querySelector("#btnActualizarApp").addEventListener("click", async (e)=>{
    const boton = e.currentTarget;
    boton.disabled = true; boton.textContent = "Actualizando…";
    try{ if(window.caches){ const claves = await caches.keys(); await Promise.all(claves.map(k=>caches.delete(k))); } }catch(err){}
    // El "?v=" cambia la URL del documento, así el navegador no puede servir la copia vieja que tenía cacheada.
    location.replace(`${location.pathname}?v=${nueva}${location.hash}`);
  });
}
async function chequearVersionNueva(){
  const publicada = await versionPublicada();
  if(publicada && publicada!==FRONTEND_VERSION) mostrarAvisoVersion(publicada);
}
function iniciarChequeoDeVersion(){
  // También al toque, no solo más adelante — si no, recién instalada (o
  // reabierta después de días con una copia vieja en caché) podía tardar
  // hasta 5 minutos en darse cuenta de que había una versión nueva.
  chequearVersionNueva();
  setInterval(chequearVersionNueva, CHEQUEO_VERSION_MS);
  // Volver a la app después de un rato es el momento más probable de estar
  // corriendo algo viejo — sobre todo en la tablet/celular, que queda
  // abierta en segundo plano días entre usos.
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") chequearVersionNueva(); });
}

async function start(){
  if(!S.locales.length){
    const cache = ls.get("localesCache","");
    if(cache){ try{ S.locales = JSON.parse(cache); }catch(e){} }
  }
  cargarLocalesSiFalta(); // en paralelo, no bloquea el primer render
  if(S.token && S.empleado){
    S.local = S.deviceLocal || S.empleado.local || S.local;
    if(!S.local && (S.empleado.rol==="admin"||S.empleado.rol==="supervisor")){
      const ultimo = ls.get("ultimoLocal","");
      if(ultimo && S.locales.find(l=>l.nombre===ultimo && !l.esGestion)) S.local = ultimo;
    }
    renderApp();
    reiniciarInactividad();
    await cargarDatos();
    iniciarPolling();
    colaFlush();
  } else {
    iniciarAuth();
  }
  iniciarChequeoDeVersion();
}
start();

function renderBloqueo(){
  if(S.esGestion){
    // Entró por Operaciones (sin PIN propio) — el desbloqueo pide la misma
    // contraseña de local, no un PIN que esta cuenta nunca llegó a crear.
    return `<div class="authWrap"><div class="authCard">
      <h1>Sesión bloqueada</h1>
      <p>${esc(S.empleado.nombre.split(" ")[0])}, ingresá la contraseña de Operaciones para seguir.</p>
      <input type="password" id="bloqueoClaveInput" placeholder="Contraseña" autocomplete="off" style="width:100%" value="${esc(S.bloqueoClave)}" ${S.bloqueoCargando?"disabled":""}>
      ${S.bloqueoCargando?`<div class="note">Verificando…</div>`:S.bloqueoError?`<div class="warn">${esc(S.bloqueoError)}</div>`:""}
      <button type="button" class="btn" id="bloqueoDesbloquear" style="width:100%;margin-top:10px" ${S.bloqueoCargando?"disabled":""}>${S.bloqueoCargando?"Verificando…":"Desbloquear"}</button>
      <button type="button" class="btn ghost" id="bloqueoSalir" style="width:100%;margin-top:10px" ${S.bloqueoCargando?"disabled":""}>Salir</button>
    </div></div>`;
  }
  return `<div class="authWrap"><div class="authCard">
    <h1>Sesión bloqueada</h1>
    <p>${esc(S.empleado.nombre.split(" ")[0])}, ingresá tu PIN para seguir.</p>
    <div class="dots">${[0,1,2,3].map(i=>`<span class="${i<S.bloqueoPin.length?"on":""}"></span>`).join("")}</div>
    ${S.bloqueoCargando?`<div class="note">Verificando…</div>`:S.bloqueoError?`<div class="warn">${esc(S.bloqueoError)}</div>`:""}
    <div class="keypad">
      ${["1","2","3","4","5","6","7","8","9"].map(k=>`<button type="button" data-tecla-bloqueo="${k}" ${S.bloqueoCargando?"disabled":""}>${k}</button>`).join("")}
      <button type="button" class="op" id="bloqueoSalir" ${S.bloqueoCargando?"disabled":""}>Salir</button>
      <button type="button" data-tecla-bloqueo="0" ${S.bloqueoCargando?"disabled":""}>0</button>
      <button type="button" class="op" data-tecla-bloqueo="borrar" ${S.bloqueoCargando?"disabled":""}>Borrar</button>
    </div>
  </div></div>`;
}
function renderApp(){
  const m=$("#app");
  if(S.auth){ m.innerHTML = renderAuth(); return }
  if(!S.empleado){ iniciarAuth(); return }
  if(S.bloqueado){ m.innerHTML = renderBloqueo(); return }
  m.innerHTML = renderHeader() + `<div class="wrap"><main id="main">${renderMain()}</main></div>` + renderNav() + `<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>`;
  renderBar();
  if(S.offline || S.cola.length){
    const b=document.createElement("div"); b.className="offlineBadge";
    b.textContent = S.cola.length ? `${S.cola.length} sin enviar` : "Sin conexión";
    document.body.appendChild(b); setTimeout(()=>b.remove(), 4000);
  }
}
